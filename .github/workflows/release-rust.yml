name: Release Rust crate

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact 40-character commit SHA to validate and release
        required: true
        type: string
      expected_version:
        description: Stable Rust crate version to validate
        required: true
        type: string
      publish:
        description: Run the protected crates.io publication path
        required: true
        default: false
        type: boolean
      approved_sha256:
        description: Reviewed SHA-256 of the exact crate archive (required when publishing)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: erpc-sdk-rust-release
  cancel-in-progress: false

jobs:
  validation:
    name: Validate Rust release source and archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enforce repository, event, input, and checkout binding
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          PUBLISH: ${{ inputs.publish }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
        run: |
          set -euo pipefail
          CHECKOUT_HEAD="$(git rev-parse HEAD)" node scripts/verify-release.mjs --workflow-guard

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt

      - name: Verify the Rust release cohort
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: node scripts/verify-release.mjs --scope rust --expected-version "$EXPECTED_VERSION"

      - name: Run release verifier behavior tests
        run: node --test scripts/verify-release.test.mjs

      - name: Verify method parity and agent harness
        run: |
          node scripts/verify-method-parity.mjs
          node scripts/agent-harness.mjs check
          node --test scripts/agent-harness.test.mjs

      - name: Check formatting
        run: cargo +1.85.0 fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo +1.85.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Run the complete Rust test suite
        run: cargo +1.85.0 test --workspace --locked

      - name: Build warning-free Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.85.0 doc --workspace --no-deps --locked

      - name: Build the Rust release
        run: cargo +1.85.0 build --workspace --release --locked

      - name: Package and prove the clean Rust archive
        id: package
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          PUBLISH: ${{ inputs.publish }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          PACKAGE_DIR="$RUNNER_TEMP/erpc-sdk-rust-release"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          PACKAGE_LIST="$PACKAGE_DIR/package-list.txt"
          cargo +1.85.0 package --locked --package erpc-sdk --list > "$PACKAGE_LIST"
          cargo +1.85.0 package --locked --package erpc-sdk
          ARCHIVE_PATH="$(ARCHIVE_DIR=target/package EXPECTED_VERSION="$EXPECTED_VERSION" \
            node scripts/verify-release.mjs --select-archive)"
          ARCHIVE_COPY="$PACKAGE_DIR/$(basename "$ARCHIVE_PATH")"
          cp "$ARCHIVE_PATH" "$ARCHIVE_COPY"
          ARCHIVE_SHA256="$(sha256sum "$ARCHIVE_PATH" | awk '{print $1}')"
          ARCHIVE_LIST="$PACKAGE_DIR/archive-list.txt"
          MANIFEST="$PACKAGE_DIR/Cargo.toml"
          VCS_INFO="$PACKAGE_DIR/cargo-vcs-info.json"
          tar -tzf "$ARCHIVE_PATH" > "$ARCHIVE_LIST"
          tar -xOf "$ARCHIVE_PATH" "erpc-sdk-$EXPECTED_VERSION/Cargo.toml" > "$MANIFEST"
          tar -xOf "$ARCHIVE_PATH" "erpc-sdk-$EXPECTED_VERSION/.cargo_vcs_info.json" > "$VCS_INFO"
          ARCHIVE_LIST_FILE="$ARCHIVE_LIST" MANIFEST_FILE="$MANIFEST" VCS_INFO_FILE="$VCS_INFO" \
            EXPECTED_COMMIT="$EXPECTED_COMMIT" EXPECTED_VERSION="$EXPECTED_VERSION" \
            node scripts/verify-release.mjs --archive-check
          if [ "$PUBLISH" = true ]; then
            test -n "$APPROVED_SHA256"
            test "$ARCHIVE_SHA256" = "$APPROVED_SHA256"
          fi
          test -z "$(git status --porcelain=v1)"
          ARCHIVE_SHA256="$ARCHIVE_SHA256" PACKAGE_LIST_FILE="$PACKAGE_LIST" \
            ARCHIVE_COPY="$ARCHIVE_COPY" node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const contents = readFileSync(process.env.PACKAGE_LIST_FILE, 'utf8')
            .split(/\r?\n/).map(line => line.trim()).filter(Boolean)
          const evidence = {
            repository_id: process.env.REPOSITORY_ID,
            source_sha: process.env.EXPECTED_COMMIT,
            version: process.env.EXPECTED_VERSION,
            run_id: process.env.RUN_ID,
            run_attempt: process.env.RUN_ATTEMPT,
            archive_sha256: process.env.ARCHIVE_SHA256,
            archive: process.env.ARCHIVE_COPY,
            contents,
            results: {
              verifier: 'rust scope passed',
              package: 'cargo package --locked passed with clean source',
              archive_provenance: 'cargo_vcs_info passed',
            },
          }
          writeFileSync(
            `${process.env.PACKAGE_LIST_FILE.slice(0, process.env.PACKAGE_LIST_FILE.lastIndexOf('/'))}/validation-evidence.json`,
            `${JSON.stringify(evidence, null, 2)}\n`,
          )
          NODE
          echo "archive_sha256=$ARCHIVE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload Rust archive and validation evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: erpc-sdk-rust-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/erpc-sdk-rust-release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified Rust crate to crates.io
    if: ${{ inputs.publish == true }}
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Recheck repository, event, input, and checkout binding
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          PUBLISH: ${{ inputs.publish }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
        run: |
          set -euo pipefail
          CHECKOUT_HEAD="$(git rev-parse HEAD)" node scripts/verify-release.mjs --workflow-guard

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt

      - name: Verify the exact Rust release cohort
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: node scripts/verify-release.mjs --scope rust --expected-version "$EXPECTED_VERSION"

      - name: Prepare the reproducible archive before authentication
        id: package
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          cargo +1.85.0 package --locked --package erpc-sdk --list > "$RUNNER_TEMP/erpc-sdk-rust-package-list.txt"
          cargo +1.85.0 package --locked --package erpc-sdk
          ARCHIVE_PATH="$(ARCHIVE_DIR=target/package EXPECTED_VERSION="$EXPECTED_VERSION" \
            node scripts/verify-release.mjs --select-archive)"
          ARCHIVE_SHA256="$(sha256sum "$ARCHIVE_PATH" | awk '{print $1}')"
          test "$ARCHIVE_SHA256" = "$APPROVED_SHA256"
          ARCHIVE_LIST="$RUNNER_TEMP/erpc-sdk-rust-archive-list.txt"
          MANIFEST="$RUNNER_TEMP/erpc-sdk-rust-manifest.toml"
          VCS_INFO="$RUNNER_TEMP/erpc-sdk-rust-vcs-info.json"
          tar -tzf "$ARCHIVE_PATH" > "$ARCHIVE_LIST"
          tar -xOf "$ARCHIVE_PATH" "erpc-sdk-$EXPECTED_VERSION/Cargo.toml" > "$MANIFEST"
          tar -xOf "$ARCHIVE_PATH" "erpc-sdk-$EXPECTED_VERSION/.cargo_vcs_info.json" > "$VCS_INFO"
          ARCHIVE_LIST_FILE="$ARCHIVE_LIST" MANIFEST_FILE="$MANIFEST" VCS_INFO_FILE="$VCS_INFO" \
            EXPECTED_COMMIT="$EXPECTED_COMMIT" EXPECTED_VERSION="$EXPECTED_VERSION" \
            node scripts/verify-release.mjs --archive-check
          test -z "$(git status --porcelain=v1)"
          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$ARCHIVE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Inspect the exact crates.io version before authentication
        id: preflight
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/erpc-sdk-rust-registry.json"
          set +e
          HTTP_STATUS="$(curl --silent --show-error --max-time 20 --retry 0 \
            --user-agent 'erpc-sdk-release-verification (https://github.com/elsoul/erpc-sdk)' \
            --output "$RESPONSE_FILE" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/erpc-sdk/$EXPECTED_VERSION")"
          CURL_STATUS=$?
          set -e
          test "$CURL_STATUS" -eq 0
          RESULT="$(REGISTRY_STATUS="$HTTP_STATUS" REGISTRY_RESPONSE_FILE="$RESPONSE_FILE" \
            node scripts/verify-release.mjs --registry-check)"
          case "$RESULT" in
            absent)
              STATE=absent
              ;;
            match:*)
              STATE=match
              ;;
            *)
              echo "crates.io preflight stopped in result: $RESULT" >&2
              exit 1
              ;;
          esac
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "response_file=$RESPONSE_FILE" >> "$GITHUB_OUTPUT"

      - name: Obtain the short-lived crates.io token
        if: steps.preflight.outputs.state == 'absent'
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish exactly one verified crate archive
        if: steps.preflight.outputs.state == 'absent' && steps.crates_auth.outcome == 'success'
        id: publish_crate
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        run: timeout --signal=TERM 300s cargo +1.85.0 publish --locked --package erpc-sdk --registry crates-io

      - name: Record local Cargo publish result without exposing credentials
        if: always() && steps.preflight.outputs.state == 'absent'
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
          PUBLISH_OUTCOME: ${{ steps.publish_crate.outcome }}
        run: |
          set -euo pipefail
          test -f "$ARCHIVE_PATH"
          LOCAL_ARCHIVE_SHA256="$(sha256sum "$ARCHIVE_PATH" | awk '{print $1}')"
          test "$LOCAL_ARCHIVE_SHA256" = "$APPROVED_SHA256"
          echo "Cargo publish outcome: $PUBLISH_OUTCOME"
          echo 'The crates.io auth action post-revocation hook remains enabled.'

      - name: Verify registry truth and downloaded archive proof
        if: always() && (steps.preflight.outputs.state == 'match' || steps.preflight.outputs.state == 'absent')
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
          INITIAL_STATE: ${{ steps.preflight.outputs.state }}
          INITIAL_RESPONSE_FILE: ${{ steps.preflight.outputs.response_file }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$INITIAL_RESPONSE_FILE"
          REGISTRY_RESULT=''
          if [ "$INITIAL_STATE" = absent ]; then
            for attempt in 1 2 3 4 5 6; do
              RESPONSE_FILE="$RUNNER_TEMP/erpc-sdk-rust-registry-$attempt.json"
              set +e
              HTTP_STATUS="$(curl --silent --show-error --max-time 20 --retry 0 \
                --user-agent 'erpc-sdk-release-verification (https://github.com/elsoul/erpc-sdk)' \
                --output "$RESPONSE_FILE" --write-out '%{http_code}' \
                "https://crates.io/api/v1/crates/erpc-sdk/$EXPECTED_VERSION")"
              CURL_STATUS=$?
              set -e
              test "$CURL_STATUS" -eq 0
              set +e
              REGISTRY_RESULT="$(REGISTRY_STATUS="$HTTP_STATUS" REGISTRY_RESPONSE_FILE="$RESPONSE_FILE" \
                node scripts/verify-release.mjs --registry-check)"
              CHECK_STATUS=$?
              set -e
              if [ "$CHECK_STATUS" -eq 0 ] && [[ "$REGISTRY_RESULT" == match:* ]]; then
                break
              fi
              if [ "$CHECK_STATUS" -ne 0 ] || [ "$REGISTRY_RESULT" != absent ]; then
                echo "crates.io post-publish verification stopped in result: $REGISTRY_RESULT" >&2
                exit 1
              fi
              if [ "$attempt" -lt 6 ]; then sleep 5; fi
            done
            [[ "$REGISTRY_RESULT" == match:* ]]
          else
            REGISTRY_RESULT="$(REGISTRY_STATUS=200 REGISTRY_RESPONSE_FILE="$RESPONSE_FILE" \
              node scripts/verify-release.mjs --registry-check)"
          fi
          REGISTRY_CHECKSUM="${REGISTRY_RESULT#match:}"
          test -n "$REGISTRY_CHECKSUM"
          DOWNLOAD_PATH="$RUNNER_TEMP/erpc-sdk-$EXPECTED_VERSION.crate"
          curl --fail --silent --show-error --location --max-time 60 --retry 0 \
            --user-agent 'erpc-sdk-release-verification (https://github.com/elsoul/erpc-sdk)' \
            --output "$DOWNLOAD_PATH" \
            "https://crates.io/api/v1/crates/erpc-sdk/$EXPECTED_VERSION/download"
          DOWNLOADED_SHA256="$(sha256sum "$DOWNLOAD_PATH" | awk '{print $1}')"
          test "$DOWNLOADED_SHA256" = "$APPROVED_SHA256"
          test "$DOWNLOADED_SHA256" = "$REGISTRY_CHECKSUM"
          ARCHIVE_LIST="$RUNNER_TEMP/erpc-sdk-rust-published-list.txt"
          MANIFEST="$RUNNER_TEMP/erpc-sdk-rust-published-manifest.toml"
          VCS_INFO="$RUNNER_TEMP/erpc-sdk-rust-published-vcs-info.json"
          tar -tzf "$DOWNLOAD_PATH" > "$ARCHIVE_LIST"
          tar -xOf "$DOWNLOAD_PATH" "erpc-sdk-$EXPECTED_VERSION/Cargo.toml" > "$MANIFEST"
          tar -xOf "$DOWNLOAD_PATH" "erpc-sdk-$EXPECTED_VERSION/.cargo_vcs_info.json" > "$VCS_INFO"
          ARCHIVE_LIST_FILE="$ARCHIVE_LIST" MANIFEST_FILE="$MANIFEST" VCS_INFO_FILE="$VCS_INFO" \
            EXPECTED_COMMIT="$EXPECTED_COMMIT" EXPECTED_VERSION="$EXPECTED_VERSION" \
            node scripts/verify-release.mjs --archive-check
          printf '%s\n' \
            "registry_checksum=$REGISTRY_CHECKSUM" \
            "download_sha256=$DOWNLOADED_SHA256" \
            "approved_sha256=$APPROVED_SHA256" \
            "version=$EXPECTED_VERSION" \
            "source_sha=$EXPECTED_COMMIT" \
            "auth_cleanup=crates-io-auth-action post-revocation hook enabled" \
            > "$RUNNER_TEMP/erpc-sdk-rust-publish-proof.txt"

      - name: Upload publication proof
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: erpc-sdk-rust-publication-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/erpc-sdk-rust-publish-proof.txt
            ${{ runner.temp }}/erpc-sdk-${{ inputs.expected_version }}.crate
          if-no-files-found: ignore
          retention-days: 7
