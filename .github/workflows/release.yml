      - publication-recovery-readonly
      - publication-recovery-pypi
    if: ${{ needs.publication-recovery-control.result == 'success' && needs.publication-recovery-readonly.result == 'success' && needs.publication-recovery-pypi.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out C without credentials
