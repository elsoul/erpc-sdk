          gh api --paginate --slurp "$api/releases?per_page=100" > "$releases_file"
          release_id="$(node --input-type=module - "$releases_file" "$BODY_FILE" "$tag" "$title" "$EXPECTED_COMMIT" <<'NODE'
          import { readFileSync } from 'node:fs'
