  release-set-observe:
    name: Observe schema2 package, tag, Go, and receipt proofs
    if: ${{ inputs.recovery_mode == 'disabled' && inputs.release_set_mode == 'observe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Install pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate receipt assembly inputs
        env:
          RELEASE_SET_PLAN_FILE: ${{ inputs.release_set_plan_file }}
          RELEASE_SET_PLAN_SHA256: ${{ inputs.release_set_plan_sha256 }}
        run: |
          set -euo pipefail
          test -f "$RELEASE_SET_PLAN_FILE"
          node scripts/verify-release.mjs --release-set-validate
          printf '%s\n' 'release-set-observe=authenticated-run-artifact-zip-and-public-byte-proof'
      - name: Run the authenticated full-A GitHub observer when the protected FD is present
        if: ${{ env.RELEASE_SET_GITHUB_READ_TOKEN_FD != '' }}
        env:
          RELEASE_SET_PLAN_FILE: ${{ inputs.release_set_plan_file }}
          RELEASE_SET_PLAN_SHA256: ${{ inputs.release_set_plan_sha256 }}
          RELEASE_SET_GITHUB_READ_TOKEN_FD: ${{ env.RELEASE_SET_GITHUB_READ_TOKEN_FD }}
        run: node scripts/verify-release.mjs --release-set-github-observe
      - name: Upload immutable receipt snapshot handoff
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-set-proof-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-set-proof-receipts
          if-no-files-found: error
          retention-days: 365

  release-set-finalize:
    name: Finalize schema2 GitHub Release
    if: ${{ inputs.recovery_mode == 'disabled' && inputs.release_set_mode == 'finalize' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Install pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate final numeric Release state before mutation
        env:
          RELEASE_SET_PLAN_FILE: ${{ inputs.release_set_plan_file }}
          RELEASE_SET_PLAN_SHA256: ${{ inputs.release_set_plan_sha256 }}
        run: |
          set -euo pipefail
          test -f "$RELEASE_SET_PLAN_FILE"
          node scripts/verify-release.mjs --release-set-validate
          printf '%s\n' 'release-set-finalize=tags-go-snapshot-draft-assets-patch-anonymous-proof'
          printf '%s\n' 'release-set-upload-policy=one-attempt-then-observe'
          printf '%s\n' 'release-set-latest=explicitly-observed make_latest:false'

  release-set-publish-npm:
    name: Publish or reuse schema2 npm artifact
    needs: release-set-publish
    if: ${{ inputs.recovery_mode == 'disabled' && inputs.release_set_mode == 'publish' && needs.release-set-publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      receipt_artifact_id: ${{ steps.npm_receipt_artifact.outputs.artifact-id }}
      publication_artifact_id: ${{ steps.npm_publication_artifact.outputs.artifact-id }}
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned npm observer Python tooling
        run: python -m pip install --disable-pip-version-check pypi-attestations==0.0.30 sigstore==4.5.1 cryptography==50.0.2
      - name: Install and verify pinned npm client
        run: npm install --global npm@11.19.1 && test "$(npm --version)" = 11.19.1
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-set-verified-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-set-verified
      - name: Recheck exact npm target and local upload bytes
        id: preflight
        env:
          PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          BUNDLE_DIR: ${{ runner.temp }}/release-set-verified/bundle
          RELEASE_USER_AGENT: erpc-sdk-release-verification (https://github.com/elsoul/erpc-sdk)
        run: |
          set -euo pipefail
          readarray -t npm_info < <(node --input-type=module - "$PLAN_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'
          const plan = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          const artifact = plan.artifacts.find(item => item.kind === 'npm')
          if (!artifact) throw new Error('npm artifact missing from schema2 plan')
          console.log(artifact.version); console.log(artifact.filename); console.log(artifact.sha256)
          NODE
          )
          version="${npm_info[0]}"; filename="${npm_info[1]}"; expected="${npm_info[2]}"
          response="$RUNNER_TEMP/npm-release-set.json"
          status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$response" --write-out '%{http_code}' "https://registry.npmjs.org/%40elsoul%2Ferpc-sdk/$version")"
          status_recheck="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/%40elsoul%2Ferpc-sdk/$version")"
          if [ "$status" = 404 ]; then
            test "$status_recheck" = 404
            state=absent
          elif [ "$status" = 200 ]; then
            tarball="$(node --input-type=module - "$response" <<'NODE'
          import { readFileSync } from 'node:fs'
          const data = JSON.parse(readFileSync(process.argv[2], 'utf8')); console.log(data.dist?.tarball ?? '')
          NODE
            )"
            observed="$RUNNER_TEMP/npm-release-set.tgz"
            curl --fail --silent --show-error --location --max-time 60 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$observed" "$tarball"
            test "$(sha256sum "$observed" | awk '{print $1}')" = "$expected"
            state=match
          else
            echo "npm preflight stopped in HTTP $status" >&2
            exit 64
          fi
          test "$(sha256sum "$BUNDLE_DIR/$filename" | awk '{print $1}')" = "$expected"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$state" > "$RUNNER_TEMP/npm-release-set-state"
      - name: Build original npm publisher context
        env:
          PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          PUBLISHER_FILE: ${{ runner.temp }}/npm-publisher.json
        run: |
          set -euo pipefail
          if [ "$(cat "$RUNNER_TEMP/npm-release-set-state")" = absent ]; then
            node --input-type=module - "$PUBLISHER_FILE" "$PLAN_FILE" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [output, planFile] = process.argv.slice(2)
          const plan = JSON.parse(readFileSync(planFile, 'utf8'))
          writeFileSync(output, `${JSON.stringify({ repository: 'elsoul/erpc-sdk', repositoryId: '1429568627', sourceCommit: plan.sourceCommit, workflowPath: '.github/workflows/release.yml', ref: 'refs/heads/main', event: 'workflow_dispatch', environment: 'npm', publisherRunId: process.env.GITHUB_RUN_ID, publisherAttempt: process.env.GITHUB_RUN_ATTEMPT })}\n`)
          NODE
            exit 0
          fi
          : > "$RUNNER_TEMP/empty-npmrc"
          : > "$RUNNER_TEMP/empty-global-npmrc"
          audit_dir="$RUNNER_TEMP/npm-publisher-audit"
          mkdir -p "$audit_dir"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/empty-npmrc" NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/empty-global-npmrc" npm install --ignore-scripts --no-audit --no-fund --prefix "$audit_dir" "@elsoul/erpc-sdk@$(node --input-type=module - "$PLAN_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync(process.argv[2], 'utf8')).versions.nonRustVersion)
          NODE
          )" --registry=https://registry.npmjs.org/ >/dev/null
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/empty-npmrc" NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/empty-global-npmrc" npm audit signatures --json --include-attestations --prefix "$audit_dir" > "$RUNNER_TEMP/npm-publisher-audit.json"
          node --input-type=module - "$RUNNER_TEMP/npm-publisher-audit.json" "$PUBLISHER_FILE" "$PLAN_FILE" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [auditFile, output, planFile] = process.argv.slice(2)
          const audit = JSON.parse(readFileSync(auditFile, 'utf8')); const plan = JSON.parse(readFileSync(planFile, 'utf8'))
          const target = audit.verified?.find(item => item.name === '@elsoul/erpc-sdk' && item.version === plan.versions.nonRustVersion && (!item.registry || item.registry === 'https://registry.npmjs.org'))
          const bundles = (target?.attestationBundles ?? []).filter(item => item.predicateType === 'https://slsa.dev/provenance/v1' && item.bundle?.dsseEnvelope?.payload)
          if (bundles.length !== 1) throw new Error('npm original publisher attestation is not unique')
          const provenance = JSON.parse(Buffer.from(bundles[0].bundle.dsseEnvelope.payload, 'base64').toString('utf8'))
          const invocation = provenance.predicate?.runDetails?.metadata?.invocationId
          const match = /^https:\/\/github\.com\/elsoul\/erpc-sdk\/actions\/runs\/([1-9][0-9]*)\/attempts\/([1-9][0-9]*)$/.exec(invocation ?? '')
          const source = provenance.predicate?.buildDefinition?.resolvedDependencies?.find(item => item.digest?.gitCommit === plan.sourceCommit)?.digest?.gitCommit
          if (!match || !/^[0-9a-f]{40}$/.test(source ?? '') || source !== plan.sourceCommit) throw new Error('npm original publisher context is not source-bound')
          writeFileSync(output, `${JSON.stringify({ repository: 'elsoul/erpc-sdk', repositoryId: '1429568627', sourceCommit: source, workflowPath: '.github/workflows/release.yml', ref: 'refs/heads/main', event: 'workflow_dispatch', environment: 'npm', publisherRunId: match[1], publisherAttempt: match[2] })}\n`)
          NODE
      - name: Authenticate original npm publisher run context
        env:
          PUBLISHER_FILE: ${{ runner.temp }}/npm-publisher.json
          CONTEXT_DIR: ${{ runner.temp }}/npm-publisher-runs
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          mkdir -p "$CONTEXT_DIR"
          node --input-type=module - "$PUBLISHER_FILE" "$CONTEXT_DIR/requests.tsv" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const publishers = JSON.parse(readFileSync(process.argv[2], 'utf8')); const seen = new Set(); const rows = []
          for (const publisher of [publishers]) { const key = `${publisher.publisherRunId}/${publisher.publisherAttempt}`; if (!seen.has(key)) { seen.add(key); rows.push(key) } }
          writeFileSync(process.argv[3], `${rows.join('\n')}\n`)
          NODE
          while IFS=/ read -r run_id attempt; do
            [ -n "$run_id" ] || continue
            gh api "/repos/$REPOSITORY/actions/runs/$run_id/attempts/$attempt" > "$CONTEXT_DIR/$run_id-$attempt.json"
          done < "$CONTEXT_DIR/requests.tsv"
          node --input-type=module - "$PUBLISHER_FILE" "$CONTEXT_DIR" "$EXPECTED_COMMIT" <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs'
          const [publisherFile, directory, source] = process.argv.slice(2); const publisher = JSON.parse(readFileSync(publisherFile, 'utf8')); const run = JSON.parse(readFileSync(`${directory}/${publisher.publisherRunId}-${publisher.publisherAttempt}.json`, 'utf8'))
          if (String(run.id) !== String(publisher.publisherRunId) || String(run.run_attempt) !== String(publisher.publisherAttempt) || run.head_sha !== source || run.head_branch !== 'main' || run.event !== 'workflow_dispatch' || run.path !== '.github/workflows/release.yml' || String(run.repository?.id ?? run.repository_id) !== '1429568627' || (run.repository?.full_name !== undefined && run.repository.full_name !== 'elsoul/erpc-sdk')) throw new Error('npm original publisher run context is not bound to the approved source')
          const current = run.id === Number(process.env.GITHUB_RUN_ID) && run.run_attempt === Number(process.env.GITHUB_RUN_ATTEMPT); if (!current && (run.status !== 'completed' || !['success', 'failure', 'cancelled', 'timed_out', 'action_required', 'neutral', 'skipped'].includes(run.conclusion))) throw new Error('npm historical publisher run is not terminal')
          if (readdirSync(directory).length < 2) throw new Error('npm original publisher run context is incomplete')
          NODE
      - name: Publish exact npm archive once when absent
        if: steps.preflight.outputs.state == 'absent'
        id: publish_npm
        continue-on-error: true
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/empty-npmrc
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/empty-global-npmrc
        run: npm publish "${{ runner.temp }}/release-set-verified/bundle/${{ steps.preflight.outputs.filename }}" --registry=https://registry.npmjs.org/ --access public --provenance --ignore-scripts
      - name: Observe npm public bytes, provenance, and consumers
        if: always() && (steps.preflight.outputs.state == 'absent' || steps.preflight.outputs.state == 'match')
        id: observe_npm
        env:
          RELEASE_SET_PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          RELEASE_SET_PLAN_SHA256: ${{ inputs.release_set_plan_sha256 }}
          RELEASE_SET_BINDING_FILE: ${{ runner.temp }}/release-set-verified/binding/release-set-binding.json
          RELEASE_SET_ARTIFACT_DIR: ${{ runner.temp }}/release-set-verified/bundle
          RELEASE_SET_BINDING_DIR: ${{ runner.temp }}/release-set-verified/binding
          RELEASE_SET_RUN_FILE: ${{ runner.temp }}/release-set-verified/evidence/run.json
          RELEASE_SET_ARTIFACT_METADATA_FILE: ${{ runner.temp }}/release-set-verified/evidence/bundle-metadata.json
          RELEASE_SET_BINDING_METADATA_FILE: ${{ runner.temp }}/release-set-verified/evidence/binding-metadata.json
          RELEASE_SET_BUNDLE_ZIP_FILE: ${{ runner.temp }}/release-set-verified/zips/bundle.zip
          RELEASE_SET_BINDING_ZIP_FILE: ${{ runner.temp }}/release-set-verified/zips/binding.zip
          RELEASE_SET_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          RELEASE_SET_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          RELEASE_SET_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          RELEASE_SET_PREPARED_BINDING_ARTIFACT_ID: ${{ inputs.prepared_binding_artifact_id }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CHECKOUT_HEAD: ${{ inputs.expected_commit }}
          CHECKOUT_STATUS: ''
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_SET_NPM_PUBLISHER_FILE: ${{ runner.temp }}/npm-publisher.json
          RELEASE_SET_NPM_OBSERVER_RUN_ID: ${{ github.run_id }}
          RELEASE_SET_NPM_OBSERVER_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_SET_NPM_OBSERVER_WORKFLOW: .github/workflows/release.yml
          RELEASE_SET_NPM_OBSERVER_SOURCE: ${{ inputs.expected_commit }}
          RELEASE_SET_NPM_OUTPUT_FILE: ${{ runner.temp }}/npm-proof.json
          RELEASE_SET_NPM_WORK_DIR: ${{ runner.temp }}/npm-observer
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_SET_NPM_WORK_DIR"
          RELEASE_SET_NPM_NODE="$(command -v node)" RELEASE_SET_NPM_CLI="$(command -v npm)" RELEASE_SET_NPM_PYTHON="$(command -v python)" node scripts/verify-release.mjs --release-set-npm-observe
      - name: Record npm publication outcome
        if: always()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/release-set-npm-publication
          RECEIPT_DIR: ${{ runner.temp }}/release-set-npm-receipt
          OBSERVER_FILE: ${{ runner.temp }}/npm-proof.json
          PREFLIGHT_STATE: ${{ steps.preflight.outputs.state }}
          UPLOAD_OUTCOME: ${{ steps.publish_npm.outcome }}
          OBSERVER_OUTCOME: ${{ steps.observe_npm.outcome }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          node --input-type=module - "$OUTPUT_DIR/publication.json" "$RECEIPT_DIR" "$OBSERVER_FILE" <<'NODE'
          import { copyFileSync, existsSync, mkdirSync, writeFileSync } from 'node:fs'
          const [output, receiptDirectory, observer] = process.argv.slice(2); const attempted = Boolean(process.env.UPLOAD_OUTCOME && process.env.UPLOAD_OUTCOME !== 'skipped'); const observed = process.env.OBSERVER_OUTCOME === 'success' && existsSync(observer)
          writeFileSync(output, `${JSON.stringify({ schemaVersion: 1, kind: 'npm-public-publication-outcome', preflightState: process.env.PREFLIGHT_STATE, auth: { requested: attempted, uploadAttempted: attempted, uploadOutcome: process.env.UPLOAD_OUTCOME || 'not-requested' }, observer: { outcome: process.env.OBSERVER_OUTCOME || 'skipped', receiptPresent: observed }, sourceCommit: process.env.EXPECTED_COMMIT, observedRunId: process.env.GITHUB_RUN_ID, observedAttempt: process.env.GITHUB_RUN_ATTEMPT } )}\n`)
          if (observed) { mkdirSync(receiptDirectory, { recursive: true }); copyFileSync(observer, `${receiptDirectory}/npm-proof.json`) }
          NODE
      - name: Clean npm credential workspace
        if: always()
        run: rm -rf "$RUNNER_TEMP/empty-npmrc" "$RUNNER_TEMP/empty-global-npmrc" "$RUNNER_TEMP/npm-publisher-audit" "$RUNNER_TEMP/npm-publisher-audit.json" "$RUNNER_TEMP/npm-publisher-runs"
      - name: Upload npm publication outcome
        if: always()
        id: npm_publication_artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-set-npm-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-set-npm-publication
          if-no-files-found: error
          retention-days: 365
      - name: Upload successful npm receipt
        if: steps.observe_npm.outcome == 'success'
        id: npm_receipt_artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-set-npm-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-set-npm-receipt/npm-proof.json
          if-no-files-found: error
          retention-days: 365
      - name: Retain npm receipt artifact allocation
        if: always()
        run: printf 'release_set_npm_receipt_artifact_id=%s\n' '${{ steps.npm_receipt_artifact.outputs.artifact-id }}' >> "$GITHUB_STEP_SUMMARY"

  release-set-publish-pypi:
    name: Publish or reuse schema2 PyPI artifacts
    needs: release-set-publish
    if: ${{ inputs.recovery_mode == 'disabled' && inputs.release_set_mode == 'publish' && needs.release-set-publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      receipt_artifact_id: ${{ steps.pypi_receipt_artifact.outputs.artifact-id }}
      publication_artifact_id: ${{ steps.pypi_publication_artifact.outputs.artifact-id }}
    environment: pypi
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-set-verified-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-set-verified
      - name: Install pinned PyPI observer tooling
        run: python -m pip install --disable-pip-version-check build==1.6.0 pypi-attestations==0.0.30 sigstore==4.5.1 cryptography==50.0.2
      - name: Recheck PyPI files and stage only verified missing bytes
        id: preflight
        env:
          PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          BUNDLE_DIR: ${{ runner.temp }}/release-set-verified/bundle
          STAGE_DIR: ${{ runner.temp }}/release-set-pypi
          MISSING_FILE: ${{ runner.temp }}/pypi-missing-files.json
          PROVENANCE_DIR: ${{ runner.temp }}/release-set-pypi-provenance
          RELEASE_USER_AGENT: erpc-sdk-release-verification (https://github.com/elsoul/erpc-sdk)
        run: |
          set -euo pipefail
          mkdir -p "$STAGE_DIR" "$PROVENANCE_DIR"
          version="$(node --input-type=module - "$PLAN_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync(process.argv[2], 'utf8')).versions.nonRustVersion)
          NODE
          )"
          response="$RUNNER_TEMP/pypi-release-set.json"
          status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$response" --write-out '%{http_code}' "https://pypi.org/pypi/erpc-sdk/$version/json")"
          status_recheck="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/erpc-sdk/$version/json")"
          node --input-type=module - "$response" "$status" "$status_recheck" "$RUNNER_TEMP/pypi-preflight-input.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [response, status, recheck, output] = process.argv.slice(2)
          writeFileSync(output, `${JSON.stringify({ npm: { status: 404, body: '{}', fullStatus: 404, fullBody: '', fullRecheckStatus: 404, fullRecheckBody: '', absenceGate: true }, pypi: { status, body: readFileSync(response, 'utf8'), absenceGate: status === '404' && recheck === '404' }, rubygems: { status: 404, body: '{}', fullStatus: 404, fullBody: '', fullRecheckStatus: 404, fullRecheckBody: '', absenceGate: true } })}\n`)
          NODE
          RELEASE_SET_PLAN_FILE="$PLAN_FILE" RELEASE_SET_PREFLIGHT_INPUT_FILE="$RUNNER_TEMP/pypi-preflight-input.json" RELEASE_SET_PREFLIGHT_OUTPUT_FILE="$RUNNER_TEMP/pypi-preflight.json" node scripts/verify-release.mjs --release-set-preflight
          state="$(node --input-type=module - "$RUNNER_TEMP/pypi-preflight.json" <<'NODE'
          import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync(process.argv[2], 'utf8')).registries.pypi.state)
          NODE
          )"
          node --input-type=module - "$response" "$PLAN_FILE" "$BUNDLE_DIR" "$STAGE_DIR" "$PROVENANCE_DIR" "$MISSING_FILE" "$state" <<'NODE'
          import { readFileSync, copyFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const [responseFile, planFile, bundle, stage, provenanceDir, missingFile, state] = process.argv.slice(2)
          const plan = JSON.parse(readFileSync(planFile, 'utf8')); const response = state === 'absent' ? {} : JSON.parse(readFileSync(responseFile, 'utf8'))
          const expected = plan.artifacts.filter(item => item.kind.startsWith('pypi')); const visible = new Map((response.urls ?? []).map(item => [item.filename, item]))
          const missing = []
          for (const item of expected) {
            const publicFile = visible.get(item.filename)
            if (publicFile !== undefined) {
              if (publicFile.yanked !== false || publicFile.digests?.sha256 !== item.sha256) throw new Error(`PyPI preflight conflict for ${item.filename}`)
              writeFileSync(join(provenanceDir, `${item.filename}.url`), `${publicFile.url}\n`)
            } else missing.push(item.filename)
          }
          for (const filename of missing) copyFileSync(join(bundle, filename), join(stage, filename))
          writeFileSync(missingFile, `${JSON.stringify(missing)}\n`)
          NODE
          node --input-type=module - "$PLAN_FILE" "$STAGE_DIR" <<'NODE'
          import { createHash } from 'node:crypto'
          import { readdirSync, readFileSync, statSync } from 'node:fs'
          import { join } from 'node:path'
          const [planFile, stage] = process.argv.slice(2); const plan = JSON.parse(readFileSync(planFile, 'utf8'))
          const expected = new Map(plan.artifacts.filter(item => item.kind.startsWith('pypi')).map(item => [item.filename, item.sha256]))
          for (const filename of readdirSync(stage)) { if (!expected.has(filename) || !statSync(join(stage, filename)).isFile()) throw new Error(`unexpected PyPI staged member ${filename}`); const digest = createHash('sha256').update(readFileSync(join(stage, filename))).digest('hex'); if (digest !== expected.get(filename)) throw new Error(`PyPI staged digest mismatch for ${filename}`) }
          NODE
          for provenance in "$PROVENANCE_DIR"/*.url; do
            [ -e "$provenance" ] || continue
            name="$(basename "$provenance" .url)"
            curl --fail --silent --show-error --max-time 30 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$PROVENANCE_DIR/$name.json" "https://pypi.org/integrity/erpc-sdk/$version/$name/provenance"
          done
          missing_count="$(node --input-type=module - "$MISSING_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync(process.argv[2], 'utf8')).length)
          NODE
          )"
          {
            echo "state=$state"
            echo "missing=$([ "$missing_count" -gt 0 ] && echo true || echo false)"
            echo "missing_files=$missing_count"
          } >> "$GITHUB_OUTPUT"
      - name: Build original per-file PyPI publisher contexts
        env:
          PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          PROVENANCE_DIR: ${{ runner.temp }}/release-set-pypi-provenance
          PUBLISHERS_FILE: ${{ runner.temp }}/pypi-publishers.json
        run: |
          set -euo pipefail
          python - "$PLAN_FILE" "$PROVENANCE_DIR" "$PUBLISHERS_FILE" <<'PY'
          import json, os, re, sys
          from pypi_attestations import Distribution, GitHubPublisher, Provenance
          plan_file, provenance_dir, output_file = sys.argv[1:]
          plan = json.load(open(plan_file, encoding='utf-8'))
          expected = {item['filename']: item for item in plan['artifacts'] if item['kind'].startswith('pypi')}
          current = {"repository": "elsoul/erpc-sdk", "repositoryId": "1429568627", "sourceCommit": plan['sourceCommit'], "workflowPath": ".github/workflows/release.yml", "ref": "refs/heads/main", "event": "workflow_dispatch", "environment": "pypi", "publisherRunId": os.environ['GITHUB_RUN_ID'], "publisherAttempt": os.environ['GITHUB_RUN_ATTEMPT']}
          contexts = {}
          for filename, descriptor in expected.items():
              provenance_path = os.path.join(provenance_dir, filename + '.json')
              if not os.path.exists(provenance_path):
                  contexts[filename] = current
                  continue
              document = Provenance.model_validate_json(open(provenance_path, encoding='utf-8').read())
              found = []
              for bundle in document.attestation_bundles:
                  for attestation in bundle.attestations:
                      statement = json.loads(attestation.envelope.statement.decode('utf-8'))
                      subject = next((item for item in statement.get('subject', []) if item.get('name') == filename and item.get('digest', {}).get('sha256') == descriptor['sha256']), None)
                      if statement.get('predicateType') != 'https://docs.pypi.org/attestations/publish/v1' or subject is None:
                          continue
                      attestation.verify(GitHubPublisher(repository='elsoul/erpc-sdk', workflow='release.yml', environment='pypi'), Distribution(name=filename, digest=descriptor['sha256']))
                      claims = attestation.certificate_claims
                      invocation = claims.get('1.3.6.1.4.1.57264.1.21')
                      match = re.fullmatch(r'https://github\.com/elsoul/erpc-sdk/actions/runs/([1-9][0-9]*)/attempts/([1-9][0-9]*)', invocation or '')
                      source = claims.get('1.3.6.1.4.1.57264.1.13')
                      if not match or source != plan['sourceCommit']:
                          raise SystemExit(f'publisher context is not source-bound for {filename}')
                      found.append({**current, 'sourceCommit': source, 'publisherRunId': match.group(1), 'publisherAttempt': match.group(2)})
              if len(found) != 1:
                  raise SystemExit(f'publisher context is not unique for {filename}')
              contexts[filename] = found[0]
          json.dump(contexts, open(output_file, 'w', encoding='utf-8')); open(output_file, 'a', encoding='utf-8').write('\n')
          PY
      - name: Authenticate original PyPI publisher run contexts
