          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-binding
      - name: Download immutable aggregate evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: foundation-proof-aggregate-${{ github.run_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/foundation-proofs
      - name: Verify approved bundle before GitHub writes
        env:
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_ARTIFACT_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          FOUNDATION_BINDING_FILE: ${{ runner.temp }}/sdk-foundation-binding/foundation-binding.json
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: node scripts/verify-release.mjs --foundation-verify
      - name: Verify complete observed proof set before GitHub writes
        env:
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PROOF_DIR: ${{ runner.temp }}/foundation-proofs
          FOUNDATION_PROOF_MANIFEST_FILE: ${{ runner.temp }}/foundation-proofs/foundation-proof-manifest.json
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: |
          set -euo pipefail
          test -f "$FOUNDATION_PROOF_DIR/foundation-proof-manifest.json"
          node scripts/verify-release.mjs --foundation-proof-verify
      - name: Verify the exact tags before Release mutation
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/tags/non-rust-v0.9.1:refs/tags/non-rust-v0.9.1 refs/tags/packages/go/v0.9.1:refs/tags/packages/go/v0.9.1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_COMMIT" || true
          test "$(git rev-parse refs/tags/non-rust-v0.9.1)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse refs/tags/packages/go/v0.9.1)" = "$EXPECTED_COMMIT"
      - name: Prepare exact Release assets
        env:
          PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          BUNDLE_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          ASSET_DIR: ${{ runner.temp }}/sdk-foundation-release-assets
          PROOF_DIR: ${{ runner.temp }}/foundation-proofs
        run: |
          set -euo pipefail
          mkdir -p "$ASSET_DIR"
          cp "$PLAN_FILE" "$ASSET_DIR/foundation-plan.json"
          cp "$BUNDLE_DIR/release-body.md" "$ASSET_DIR/release-body.md"
          cp "$BUNDLE_DIR/go-inventory.json" "$ASSET_DIR/go-inventory.json"
          cp "$BUNDLE_DIR/rust-receipt.json" "$ASSET_DIR/rust-receipt.json"
          node --input-type=module - "$PLAN_FILE" "$BUNDLE_DIR" "$ASSET_DIR" <<'NODE'
          import { copyFileSync, readFileSync } from 'node:fs'
          const [planFile, bundle, assets] = process.argv.slice(2)
          const plan = JSON.parse(readFileSync(planFile, 'utf8'))
          for (const artifact of plan.artifacts) copyFileSync(`${bundle}/${artifact.filename}`, `${assets}/${artifact.filename}`)
          for (const proof of plan.proofAssets) copyFileSync(`${process.env.PROOF_DIR}/${proof}`, `${assets}/${proof}`)
          NODE
      - name: Reconcile existing Release or create a draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: non-rust-v0.9.1
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_TITLE: 'SDK release state: non-Rust 0.9.1 / Rust 0.10.0'
          BODY_FILE: ${{ runner.temp }}/sdk-foundation-bundle/release-body.md
          PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
        run: |
          set -euo pipefail
          node --input-type=module - "$PLAN_FILE" "$BODY_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const [planFile, bodyFile] = process.argv.slice(2)
          const plan = JSON.parse(readFileSync(planFile, 'utf8'))
          const body = readFileSync(bodyFile, 'utf8')
          if (plan.githubRelease?.body !== body || plan.githubRelease?.bodySha256 !== createHash('sha256').update(body).digest('hex')) throw new Error('Release body is not the approved plan body')
          NODE
          release_json="$RUNNER_TEMP/release.json"
          api_url="https://api.github.com/repos/$REPOSITORY/releases/tags/$TAG"
          set +e
          http_status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --output "$release_json" --write-out '%{http_code}' "$api_url")"
          curl_status=$?
          set -e
          test "$curl_status" -eq 0
          if [ "$http_status" = 404 ]; then
            gh release create "$TAG" --repo "$REPOSITORY" --target "$EXPECTED_COMMIT" --title "$RELEASE_TITLE" --notes-file "$BODY_FILE" --draft --latest=false
            http_status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --output "$release_json" --write-out '%{http_code}' "$api_url")"
            test "$http_status" = 200
          elif [ "$http_status" != 200 ]; then
            echo "GitHub Release read failed with HTTP $http_status" >&2
            exit 1
          fi
          node --input-type=module - "$release_json" "$BODY_FILE" "$TAG" "$EXPECTED_COMMIT" <<'NODE'
          import { readFileSync } from 'node:fs'
          const [releaseFile, bodyFile, tag, commit] = process.argv.slice(2)
          const release = JSON.parse(readFileSync(releaseFile, 'utf8'))
          const body = readFileSync(bodyFile, 'utf8')
          if (release.tag_name !== tag || release.name !== 'SDK release state: non-Rust 0.9.1 / Rust 0.10.0' || release.body !== body || release.target_commitish !== commit && release.target_commitish !== tag) throw new Error('existing GitHub Release does not match the approved body/tag/source')
          if (release.immutable && release.draft === false) console.log('immutable-release-reuse=true')
          console.log(`release_id=${release.id}`)
          NODE
      - name: Reconcile Release assets without overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: non-rust-v0.9.1
          ASSET_DIR: ${{ runner.temp }}/sdk-foundation-release-assets
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
        run: |
          set -euo pipefail
          release_id="$(gh api "/repos/$REPOSITORY/releases/tags/$TAG" --jq .id)"
          assets_json="$RUNNER_TEMP/release-assets.json"
          gh api "/repos/$REPOSITORY/releases/$release_id/assets?per_page=100" > "$assets_json"
          expected_assets="$RUNNER_TEMP/expected-release-assets.txt"
          remote_assets="$RUNNER_TEMP/remote-release-assets.txt"
          find "$ASSET_DIR" -maxdepth 1 -type f -exec basename {} \; | sort > "$expected_assets"
          node --input-type=module - "$assets_json" "$expected_assets" "$remote_assets" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [assetsFile, expectedFile, remoteFile] = process.argv.slice(2)
          const remote = JSON.parse(readFileSync(assetsFile, 'utf8'))
          const expected = new Set(readFileSync(expectedFile, 'utf8').split(/\r?\n/).filter(Boolean))
          for (const asset of remote) if (!expected.has(asset.name)) throw new Error(`unexpected existing Release asset ${asset.name}`)
          writeFileSync(remoteFile, remote.map(asset => asset.name).join('\n') + (remote.length ? '\n' : ''))
          NODE
          snapshot_dir="$RUNNER_TEMP/foundation-proof-snapshot"
          if grep -Fxq 'foundation-proof-manifest.json' "$remote_assets"; then
            mkdir -p "$snapshot_dir"
            gh release download "$TAG" --repo "$REPOSITORY" --pattern 'foundation-proof-manifest.json' --dir "$snapshot_dir" >/dev/null
            snapshot_context="$(jq -r '[.preparedRunId, .preparedRunAttempt, .preparedArtifactId, .proofReceiptsArtifactId] | @tsv' "$snapshot_dir/foundation-proof-manifest.json")"
            IFS=$'\t' read -r snapshot_run snapshot_attempt snapshot_artifact snapshot_receipts_artifact <<< "$snapshot_context"
            test -n "$snapshot_receipts_artifact" && test "$snapshot_receipts_artifact" != null
            remote_snapshot_dir="$RUNNER_TEMP/foundation-proof-remote"
            mkdir -p "$remote_snapshot_dir"
            for proof in npm-proof.json pypi-proof.json rubygems-proof.json rust-proof.json tag-proof.json go-proof.json; do
              if grep -Fxq "$proof" "$remote_assets"; then
                gh release download "$TAG" --repo "$REPOSITORY" --pattern "$proof" --dir "$remote_snapshot_dir" >/dev/null
                expected_digest="$(jq -r --arg name "$proof" '.receipts[$name]' "$snapshot_dir/foundation-proof-manifest.json")"
                test "$(sha256sum "$remote_snapshot_dir/$proof" | awk '{print $1}')" = "$expected_digest"
                cp "$remote_snapshot_dir/$proof" "$snapshot_dir/$proof"
              fi
            done
            recovery_zip="$RUNNER_TEMP/foundation-proof-receipts.zip"
            recovery_dir="$RUNNER_TEMP/foundation-proof-receipts-recovery"
            mkdir -p "$recovery_dir"
            curl --fail --silent --show-error --location --max-time 60 --retry 0 --user-agent "$RELEASE_USER_AGENT" --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/zip' --output "$recovery_zip" "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$snapshot_receipts_artifact/zip"
            unzip -q "$recovery_zip" -d "$recovery_dir"
            for proof in npm-proof.json pypi-proof.json rubygems-proof.json rust-proof.json tag-proof.json go-proof.json; do
              expected_digest="$(jq -r --arg name "$proof" '.receipts[$name]' "$snapshot_dir/foundation-proof-manifest.json")"
              test -f "$recovery_dir/$proof"
              test "$(sha256sum "$recovery_dir/$proof" | awk '{print $1}')" = "$expected_digest"
              cp "$recovery_dir/$proof" "$snapshot_dir/$proof"
            done
            FOUNDATION_PREPARED_RUN_ID="$snapshot_run" FOUNDATION_PREPARED_RUN_ATTEMPT="$snapshot_attempt" FOUNDATION_PREPARED_ARTIFACT_ID="$snapshot_artifact" FOUNDATION_PROOF_RECEIPTS_ARTIFACT_ID="$snapshot_receipts_artifact" FOUNDATION_PROOF_DIR="$snapshot_dir" FOUNDATION_PROOF_MANIFEST_FILE="$snapshot_dir/foundation-proof-manifest.json" node scripts/verify-release.mjs --foundation-proof-verify
            cp "$snapshot_dir"/*.json "$ASSET_DIR/"
          fi
          preflight_dir="$RUNNER_TEMP/release-asset-preflight"
          mkdir -p "$preflight_dir"
          while IFS= read -r name; do
            if grep -Fxq "$name" "$remote_assets"; then
              gh release download "$TAG" --repo "$REPOSITORY" --pattern "$name" --dir "$preflight_dir" >/dev/null
              test "$(sha256sum "$preflight_dir/$name" | awk '{print $1}')" = "$(sha256sum "$ASSET_DIR/$name" | awk '{print $1}')"
            fi
          done < "$expected_assets"
          missing=()
          while IFS= read -r name; do
            if ! grep -Fxq "$name" "$remote_assets"; then missing+=("$ASSET_DIR/$name"); fi
          done < "$expected_assets"
          if [ "${#missing[@]}" -gt 0 ]; then gh release upload "$TAG" --repo "$REPOSITORY" "${missing[@]}"; fi
          download_dir="$RUNNER_TEMP/release-asset-downloads"
          mkdir -p "$download_dir"
          for asset in "$ASSET_DIR"/*; do
            name="$(basename "$asset")"
            gh release download "$TAG" --repo "$REPOSITORY" --pattern "$name" --dir "$download_dir" >/dev/null
            test "$(sha256sum "$download_dir/$name" | awk '{print $1}')" = "$(sha256sum "$asset" | awk '{print $1}')"
          done
      - name: Publish matching draft and verify final Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: non-rust-v0.9.1
          BODY_FILE: ${{ runner.temp }}/sdk-foundation-bundle/release-body.md
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release-final.json"
          gh api "/repos/$REPOSITORY/releases/tags/$TAG" > "$release_json"
          draft="$(node --input-type=module - "$release_json" <<'NODE'
          import { readFileSync } from 'node:fs'
          console.log(JSON.parse(readFileSync(process.argv[2], 'utf8')).draft ? 'true' : 'false')
          NODE
          )"
          if [ "$draft" = true ]; then gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --latest=false; fi
          gh api "/repos/$REPOSITORY/releases/tags/$TAG" > "$release_json"
          node --input-type=module - "$release_json" "$BODY_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'
          const [releaseFile, bodyFile] = process.argv.slice(2)
          const release = JSON.parse(readFileSync(releaseFile, 'utf8'))
          if (release.draft || release.tag_name !== 'non-rust-v0.9.1' || release.name !== 'SDK release state: non-Rust 0.9.1 / Rust 0.10.0' || release.body !== readFileSync(bodyFile, 'utf8')) throw new Error('final GitHub Release proof failed')
          NODE
          cp "$release_json" "$RUNNER_TEMP/final-release-proof.json"
      - name: Upload final Release proof
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-final-release-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/final-release-proof.json
          if-no-files-found: error
          retention-days: 365

  # Schema2 path. This is deliberately opt-in and disabled by default. It
  # reuses the existing protected publisher/tag/Release operations only after
  # the verifier has authenticated their actual preparation and observation
  # artifacts.
  release-set-prepare:
    name: Prepare schema2 release set
    if: ${{ inputs.recovery_mode == 'disabled' && inputs.release_set_mode == 'prepare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      plan_sha256: ${{ steps.prepare.outputs.plan_sha256 }}
      bundle_artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      binding_artifact_id: ${{ steps.binding.outputs.artifact-id }}
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Install pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned Python packaging toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22.x'
          cache: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: false
      - name: Materialize schema2 JSON inputs before guards
        env:
          RELEASE_SET_PLAN_TEMPLATE_JSON: ${{ inputs.release_set_plan_template_json }}
          RELEASE_SET_PLAN_JSON: ${{ inputs.release_set_plan_json }}
          RELEASE_SET_PLAN_TEMPLATE_FILE: ${{ runner.temp }}/release-set-inputs/plan-template.json
          RELEASE_SET_PLAN_FILE: ${{ runner.temp }}/release-set-inputs/plan.json
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises'
          import { dirname } from 'node:path'

          const parseInput = (name, raw, required) => {
            if (typeof raw !== 'string' || (required && raw.trim() === '')) throw new Error(`${name} is required`)
            if (!required && raw.trim() === '') return undefined
            let value
            try {
              value = JSON.parse(raw)
            } catch {
              throw new Error(`${name} is not valid JSON`)
            }
            if (value === null || typeof value !== 'object' || Array.isArray(value)) throw new Error(`${name} must be a JSON object`)
            return value
          }

          const template = parseInput('release_set_plan_template_json', process.env.RELEASE_SET_PLAN_TEMPLATE_JSON, true)
          const plan = parseInput('release_set_plan_json', process.env.RELEASE_SET_PLAN_JSON, false)
          const templateFile = process.env.RELEASE_SET_PLAN_TEMPLATE_FILE
          const planFile = process.env.RELEASE_SET_PLAN_FILE
          if (!templateFile || !planFile || templateFile === planFile) throw new Error('schema2 input output paths are invalid')
          await mkdir(dirname(templateFile), { recursive: true })
          await writeFile(templateFile, `${JSON.stringify(template)}\n`)
          if (plan !== undefined) await writeFile(planFile, `${JSON.stringify(plan)}\n`)
          NODE
      - name: Validate supplied reviewed plan before package effects
        if: ${{ inputs.release_set_plan_sha256 != '' }}
        env:
          RELEASE_SET_PLAN_FILE: ${{ runner.temp }}/release-set-inputs/plan.json
          RELEASE_SET_PLAN_SHA256: ${{ inputs.release_set_plan_sha256 }}
        run: |
          set -euo pipefail
          test -f "$RELEASE_SET_PLAN_FILE"
          node scripts/verify-release.mjs --release-set-validate
      - name: Fetch and validate exact-source CI proof before package effects
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          CI_DIR: ${{ runner.temp }}/release-set-ci
        run: |
          set -euo pipefail
          mkdir -p "$CI_DIR"
          gh api "/repos/$REPOSITORY/actions/workflows/ci.yml" > "$CI_DIR/workflow.json"
          ci_workflow_id="$(node --input-type=module - "$CI_DIR/workflow.json" <<'NODE'
          import { readFileSync } from 'node:fs'
          const workflow = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          if (!Number.isSafeInteger(workflow.id) || workflow.path !== '.github/workflows/ci.yml') throw new Error('CI workflow identity is not exact')
          console.log(workflow.id)
          NODE
          )"
          gh api "/repos/$REPOSITORY/actions/workflows/$ci_workflow_id/runs?branch=main&head_sha=$EXPECTED_COMMIT&per_page=100" > "$CI_DIR/runs.json"
          RELEASE_SET_CI_WORKFLOW_FILE="$CI_DIR/workflow.json" RELEASE_SET_CI_RUNS_FILE="$CI_DIR/runs.json" RELEASE_SET_CI_SELECTION_FILE="$CI_DIR/selection.json" EXPECTED_COMMIT="$EXPECTED_COMMIT" node scripts/verify-release.mjs --release-set-ci-select
          ci_run_id="$(node --input-type=module - "$CI_DIR/selection.json" <<'NODE'
          import { readFileSync } from 'node:fs'
          console.log(JSON.parse(readFileSync(process.argv[2], 'utf8')).id)
          NODE
          )"
          ci_run_attempt="$(node --input-type=module - "$CI_DIR/selection.json" <<'NODE'
          import { readFileSync } from 'node:fs'
          console.log(JSON.parse(readFileSync(process.argv[2], 'utf8')).runAttempt)
          NODE
          )"
          gh api "/repos/$REPOSITORY/actions/runs/$ci_run_id/attempts/$ci_run_attempt" > "$CI_DIR/recheck.json"
          gh api "/repos/$REPOSITORY/actions/runs/$ci_run_id/attempts/$ci_run_attempt/jobs?per_page=100" > "$CI_DIR/jobs.json"
          RELEASE_SET_CI_WORKFLOW_FILE="$CI_DIR/workflow.json" RELEASE_SET_CI_RUNS_FILE="$CI_DIR/runs.json" RELEASE_SET_CI_SELECTION_FILE="$CI_DIR/selection.json" RELEASE_SET_CI_RECHECK_FILE="$CI_DIR/recheck.json" RELEASE_SET_CI_JOBS_FILE="$CI_DIR/jobs.json" RELEASE_SET_CI_EVIDENCE_FILE="$CI_DIR/evidence.json" EXPECTED_COMMIT="$EXPECTED_COMMIT" node scripts/verify-release.mjs --release-set-ci-proof
      - name: Validate template and live runtime before package effects
        env:
          RELEASE_SET_PLAN_TEMPLATE_FILE: ${{ runner.temp }}/release-set-inputs/plan-template.json
          RELEASE_SET_PLAN_SHA256: ${{ inputs.release_set_plan_sha256 }}
          RELEASE_SET_CI_EVIDENCE_FILE: ${{ runner.temp }}/release-set-ci/evidence.json
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CHECKOUT_HEAD: ${{ inputs.expected_commit }}
          CHECKOUT_STATUS: ''
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test -f "$RELEASE_SET_PLAN_TEMPLATE_FILE"
          test -f "$RELEASE_SET_CI_EVIDENCE_FILE"
          CHECKOUT_STATUS="$(git status --porcelain)" CHECKOUT_HEAD="$(git rev-parse HEAD)" node scripts/verify-release.mjs --release-set-prepare-guard
      - name: Build measured package archives and Go source inputs
        env:
          BUNDLE_DIR: ${{ runner.temp }}/release-set-bundle
        run: |
          set -euo pipefail
          mkdir -p "$BUNDLE_DIR"
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @elsoul/erpc-sdk check
          corepack pnpm --filter @elsoul/erpc-sdk test
          corepack pnpm --filter @elsoul/erpc-sdk build
          (cd packages/typescript && npm install --global npm@11.19.1 && npm pack --ignore-scripts --pack-destination "$BUNDLE_DIR")
          python -m pip install --disable-pip-version-check --no-input build==1.6.0 twine==7.0.0
          python -m build --verbose packages/python --outdir "$BUNDLE_DIR"
          (cd packages/ruby && bundle install --jobs 4 --retry 3 && bundle exec rake check && bundle exec rake test && bundle exec rake package && cp pkg/*.gem "$BUNDLE_DIR/")
      - name: Validate exact source, measured plan, and common gates
        id: prepare
        env:
          RELEASE_SET_PLAN_TEMPLATE_FILE: ${{ runner.temp }}/release-set-inputs/plan-template.json
          RELEASE_SET_PLAN_FILE: ${{ runner.temp }}/release-set-bundle/release-set-plan.json
          RELEASE_SET_PLAN_DIGEST_OUTPUT: ${{ runner.temp }}/release-set-plan.sha256
          RELEASE_SET_ARTIFACT_DIR: ${{ runner.temp }}/release-set-bundle
          RELEASE_SET_GO_ROOT: packages/go
          RELEASE_SET_CI_EVIDENCE_FILE: ${{ runner.temp }}/release-set-ci/evidence.json
          RELEASE_SET_PLAN_SHA256: ${{ inputs.release_set_plan_sha256 }}
          RELEASE_SET_PREPARED_EVIDENCE_FILE: ${{ runner.temp }}/release-set-prepared.json
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CHECKOUT_HEAD: ${{ inputs.expected_commit }}
          CHECKOUT_STATUS: ''
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$EVENT_REF" = refs/heads/main
          test "$EVENT_SHA" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain)"
          test -f "$RELEASE_SET_PLAN_TEMPLATE_FILE"
          test -n "$RELEASE_SET_ARTIFACT_DIR"
          node scripts/verify-release.mjs --release-set-prepare
          printf 'plan_sha256=%s\n' "$(cat "$RELEASE_SET_PLAN_DIGEST_OUTPUT")" >> "$GITHUB_OUTPUT"
          node scripts/agent-harness.mjs check
          node --test scripts/agent-harness.test.mjs
      - name: Upload measured immutable bundle
        id: bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-set-bundle-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/release-set-bundle
