          import { readFileSync, writeFileSync } from 'node:fs'; import { validatePublicationRecoveryTagTargets } from './scripts/verify-release.mjs'
          const plan = JSON.parse(readFileSync(process.argv[2], 'utf8')); const checked = validatePublicationRecoveryTagTargets({ plan, releaseTag: 'non-rust-v0.11.0', goTag: 'packages/go/v0.11.0', releaseCommit: process.env.SOURCE_M, goCommit: process.env.SOURCE_M }); writeFileSync(process.argv[3], `${JSON.stringify(checked)}\n`)
          NODE
      - name: Observe Go proxy/direct bytes and consumers against M
        env:
          CONTEXT: ${{ runner.temp }}/recovery/recovery-context.json
          PLAN: ${{ runner.temp }}/recovery/recovery-bundle/release-set-plan.json
          VENV: ${{ runner.temp }}/recovery-venv
          WORK: ${{ runner.temp }}/recovery-go
