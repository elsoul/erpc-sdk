      - name: Build exact Release asset descriptor from prepared bytes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          BUNDLE_DIR: ${{ runner.temp }}/release-set-verified/bundle
          PROOF_DIR: ${{ runner.temp }}/release-set-receipts
