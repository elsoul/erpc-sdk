        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in non-rust-v0.9.1 packages/go/v0.9.1; do
            ref="refs/tags/$tag"
            existing="$(git ls-remote origin "$ref" | awk 'NR==1 {print $1}')"
            if [ -n "$existing" ]; then
              test "$existing" = "$EXPECTED_COMMIT"
            else
              git tag "$tag" "$EXPECTED_COMMIT"
