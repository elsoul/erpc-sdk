          writeFileSync(outputFile, `${JSON.stringify({ schemaVersion: 1, registry: 'crates.io', repository: process.env.EXPECTED_REPOSITORY, identity: version.crate, version: version.num, sourceCommit: 'f05abe4276991612c4b5e404fdc768baace32e61', foundationSourceCommit: process.env.FOUNDATION_SOURCE_SHA, sha256: version.checksum, registryStatus: Number(process.env.RUST_REGISTRY_STATUS), yanked: version.yanked, downloadStatus: 200, preparedRunId: process.env.FOUNDATION_PREPARED_RUN_ID, preparedRunAttempt: process.env.FOUNDATION_PREPARED_RUN_ATTEMPT, preparedArtifactId: process.env.FOUNDATION_PREPARED_ARTIFACT_ID, observerRunId: process.env.GITHUB_RUN_ID, observerAttempt: process.env.GITHUB_RUN_ATTEMPT, planSha256: process.env.FOUNDATION_PLAN_SHA256, observedAt: new Date().toISOString(), auth: { requested: false, uploadAttempted: false } })}\n`)
          NODE
      - name: Upload Rust reuse proof
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-proof-rust-${{ github.run_id }}
          path: ${{ runner.temp }}/rust-proof.json
          if-no-files-found: error
          retention-days: 30

  tags:
    name: Create approved non-Rust tags
    needs:
      - publication-validation
      - npm
      - pypi
      - rubygems
      - rust-reuse
    if: ${{ inputs.mode == 'publish' && needs.publication-validation.result == 'success' && needs.npm.result == 'success' && needs.pypi.result == 'success' && needs.rubygems.result == 'success' && needs.rust-reuse.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download approved bundle and binding before tag writes
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-bundle
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_binding_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-binding
      - name: Verify approved bundle before tag writes
        env:
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_ARTIFACT_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          FOUNDATION_BINDING_FILE: ${{ runner.temp }}/sdk-foundation-binding/foundation-binding.json
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: node scripts/verify-release.mjs --foundation-verify
      - name: Create or verify only the two approved refs
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/tag-states"
          mkdir -p "$state_dir"
          for tag in non-rust-v0.9.1 packages/go/v0.9.1; do
            ref="tags/$tag"
            set +e
            existing_status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --output "$RUNNER_TEMP/tag-ref.json" --write-out '%{http_code}' "https://api.github.com/repos/$REPOSITORY/git/ref/$ref")"
            curl_status=$?
            set -e
            test "$curl_status" -eq 0
            if [ "$existing_status" = 200 ]; then
              jq -r '.object.sha' "$RUNNER_TEMP/tag-ref.json" > "$state_dir/$(printf '%s' "$tag" | tr '/' '_')"
            elif [ "$existing_status" = 404 ]; then
              printf '%s\n' absent > "$state_dir/$(printf '%s' "$tag" | tr '/' '_')"
            else
              echo "Git ref read failed with HTTP $existing_status" >&2
              exit 1
            fi
          done
          for tag in non-rust-v0.9.1 packages/go/v0.9.1; do
            state="$(cat "$state_dir/$(printf '%s' "$tag" | tr '/' '_')")"
            if [ "$state" != absent ]; then test "$state" = "$EXPECTED_COMMIT"; fi
          done
          for tag in non-rust-v0.9.1 packages/go/v0.9.1; do
            state="$(cat "$state_dir/$(printf '%s' "$tag" | tr '/' '_')")"
            if [ "$state" = absent ]; then gh api --method POST "/repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$EXPECTED_COMMIT" >/dev/null; fi
          done
          for ref in tags/non-rust-v0.9.1 tags/packages/go/v0.9.1; do
            final_file="$state_dir/$(printf '%s' "$ref" | tr '/' '_')-final.json"
            status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --output "$final_file" --write-out '%{http_code}' "https://api.github.com/repos/$REPOSITORY/git/ref/$ref")"
            test "$status" = 200
            test "$(jq -r '.object.sha' "$final_file")" = "$EXPECTED_COMMIT"
          done
          node --input-type=module - "$state_dir" "$RUNNER_TEMP/tag-proof.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [stateDir, outputFile] = process.argv.slice(2)
          const readRef = name => ({ ref: `refs/tags/${name}`, sha: JSON.parse(readFileSync(`${stateDir}/tags_${name.replaceAll('/', '_')}-final.json`, 'utf8')).object.sha })
          writeFileSync(outputFile, `${JSON.stringify({ schemaVersion: 1, registry: 'github.com', repository: process.env.REPOSITORY, sourceCommit: process.env.EXPECTED_COMMIT, version: '0.9.1', planSha256: process.env.FOUNDATION_PLAN_SHA256, preparedRunId: process.env.FOUNDATION_PREPARED_RUN_ID, preparedRunAttempt: process.env.FOUNDATION_PREPARED_RUN_ATTEMPT, preparedArtifactId: process.env.FOUNDATION_PREPARED_ARTIFACT_ID, observerRunId: process.env.GITHUB_RUN_ID, observerAttempt: process.env.GITHUB_RUN_ATTEMPT, tags: { release: readRef('non-rust-v0.9.1'), go: readRef('packages/go/v0.9.1') }, auth: { requested: true, writeObserved: true, mechanism: 'github-token' }, observedAt: new Date().toISOString() })}\n`)
          NODE
      - name: Upload tag proof
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-proof-tags-${{ github.run_id }}
          path: ${{ runner.temp }}/tag-proof.json
          if-no-files-found: error
          retention-days: 30

  go-proof:
    name: Verify public Go module and inventory
    needs: tags
    if: ${{ inputs.mode == 'publish' && needs.tags.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out approved source and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download and verify the approved bundle before Go proof
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-bundle
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_binding_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-binding
      - name: Revalidate approved plan and sidecars for Go proof
        env:
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_ARTIFACT_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          FOUNDATION_BINDING_FILE: ${{ runner.temp }}/sdk-foundation-binding/foundation-binding.json
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: node scripts/verify-release.mjs --foundation-verify
      - name: Verify Go proxy, checksum, origin, and exact module members
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          MODULE: github.com/elsoul/erpc-sdk/packages/go
          VERSION: v0.9.1
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/tags/packages/go/v0.9.1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_COMMIT"
          mkdir -p "$RUNNER_TEMP/go-consumer"
          printf 'module example.invalid/consumer\n\ngo 1.22\n\nrequire %s %s\n' "$MODULE" "$VERSION" > "$RUNNER_TEMP/go-consumer/go.mod"
          for attempt in 1 2 3 4 5; do
            set +e
            (cd "$RUNNER_TEMP/go-consumer" && GOMODCACHE="$RUNNER_TEMP/go-mod-cache" GOPROXY="$GOPROXY" GOSUMDB="$GOSUMDB" go mod download -json "$MODULE@$VERSION") > "$RUNNER_TEMP/go-download.json"
            download_status=$?
            set -e
            if [ "$download_status" -eq 0 ] && python - "$RUNNER_TEMP/go-download.json" <<'PY'
          import json, sys
          receipt = json.load(open(sys.argv[1], encoding='utf-8'))
          raise SystemExit(1 if receipt.get('Error') else 0)
          PY
            then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 5
          done
          mkdir -p "$RUNNER_TEMP/go-direct-consumer"
          printf 'module example.invalid/direct-consumer\n\ngo 1.22\n\nrequire %s %s\n' "$MODULE" "$VERSION" > "$RUNNER_TEMP/go-direct-consumer/go.mod"
          (cd "$RUNNER_TEMP/go-direct-consumer" && GOMODCACHE="$RUNNER_TEMP/go-direct-mod-cache" GOPROXY=direct GOSUMDB="$GOSUMDB" go mod download -json "$MODULE@$VERSION") > "$RUNNER_TEMP/go-direct-download.json"
          python - "$RUNNER_TEMP/go-download.json" "$RUNNER_TEMP/go-direct-download.json" "$RUNNER_TEMP/sdk-foundation-bundle/go-inventory.json" "$EXPECTED_COMMIT" <<'PY'
          import base64, hashlib, json, os, re, sys, zipfile
          result = json.load(open(sys.argv[1], encoding='utf-8'))
          direct = json.load(open(sys.argv[2], encoding='utf-8'))
          module = os.environ['MODULE']
          version = os.environ['VERSION']
          required = {'Path', 'Version', 'Info', 'GoMod', 'Zip', 'Dir', 'Sum', 'GoModSum', 'Origin'}
          if not isinstance(result, dict) or result.get('Error') or not required.issubset(result):
              raise SystemExit('Go tool receipt is incomplete or reports an error')
          for key in ('Path', 'Version', 'Info', 'GoMod', 'Zip', 'Dir', 'Sum', 'GoModSum'):
              if not isinstance(result.get(key), str) or not result[key]:
                  raise SystemExit(f'Go tool receipt field {key} is not a nonempty string')
          for key in ('Info', 'GoMod', 'Zip', 'Dir'):
              if not os.path.isabs(result[key]):
                  raise SystemExit(f'Go tool receipt field {key} is not an absolute path')
          if result.get('Reuse') is True:
              raise SystemExit('Go proof must come from a fresh consumer download')
          origin = result.get('Origin')
          if not isinstance(origin, dict) or set(origin) != {'VCS', 'URL', 'Hash', 'Ref', 'Subdir'}:
              raise SystemExit('Go proxy origin shape is incomplete or has unexpected fields')
          if result.get('Path') != module or result.get('Version') != version:
              raise SystemExit('Go proxy module identity/version mismatch')
          if origin.get('VCS') != 'git' or origin.get('URL') != 'https://github.com/elsoul/erpc-sdk' or origin.get('Hash') != sys.argv[4] or origin.get('Ref') != 'refs/tags/packages/go/v0.9.1' or origin.get('Subdir') != 'packages/go':
              raise SystemExit('Go proxy origin does not bind the approved tag and commit')
          direct_origin = direct.get('Origin')
          if direct.get('Error') or direct.get('Path') != module or direct.get('Version') != version or not isinstance(direct_origin, dict) or set(direct_origin) != {'VCS', 'URL', 'Hash', 'Ref', 'Subdir'}:
              raise SystemExit('Go direct origin receipt is incomplete')
          if direct_origin.get('VCS') != 'git' or direct_origin.get('URL') != 'https://github.com/elsoul/erpc-sdk' or direct_origin.get('Hash') != sys.argv[4] or direct_origin.get('Ref') != 'refs/tags/packages/go/v0.9.1' or direct_origin.get('Subdir') != 'packages/go':
              raise SystemExit('Go direct origin does not bind the approved tag and commit')
          if not re.fullmatch(r'h1:[A-Za-z0-9+/]{43}=?', result['Sum']) or not re.fullmatch(r'h1:[A-Za-z0-9+/]{43}=?', result['GoModSum']):
              raise SystemExit('Go proxy did not provide checksum receipts')
          for checksum in (result['Sum'], result['GoModSum']):
              try:
                  base64.b64decode(checksum[3:], validate=True)
              except Exception as error:
                  raise SystemExit('Go proxy checksum receipt is not valid base64') from error
          inventory = json.load(open(sys.argv[3], encoding='utf-8'))
          expected = {entry['path']: entry['sha256'] for entry in inventory['files']}
          if len(expected) != len(inventory['files']) or set(expected) != set(inventory['files'][index]['path'] for index in range(len(inventory['files']))):
              raise SystemExit('Go inventory contains duplicate paths')
          prefix = f'{module}@{version}/'
          with zipfile.ZipFile(result['Zip']) as archive:
              names = []
              for member in archive.infolist():
                  if member.is_dir(): continue
                  if '\\' in member.filename or member.filename.startswith('/') or '..' in member.filename.split('/') or not member.filename.startswith(prefix): raise SystemExit('unexpected Go zip prefix or unsafe member')
                  name = member.filename[len(prefix):]
                  if not name or name in names or '..' in name.split('/'):
                      raise SystemExit('unsafe or duplicate Go zip member')
                  names.append(name)
                  if name not in expected or hashlib.sha256(archive.read(member)).hexdigest() != expected[name]:
                      raise SystemExit(f'Go inventory mismatch for {name}')
              if set(names) != set(expected): raise SystemExit('Go zip member set mismatch')
              gomod = archive.read(prefix + 'go.mod').decode('utf-8') if prefix + 'go.mod' in archive.namelist() else ''
              if not re.search(rf'^module {re.escape(module)}$', gomod, re.MULTILINE): raise SystemExit('Go module file does not identify the approved module')
          with open('go-proof.json', 'w', encoding='utf-8') as output:
              json.dump({'schemaVersion': 1, 'registry': 'proxy.golang.org', 'repository': os.environ['EXPECTED_REPOSITORY'], 'module': result['Path'], 'version': result['Version'], 'sum': result['Sum'], 'goModSum': result['GoModSum'], 'originHash': origin['Hash'], 'originSubdir': origin['Subdir'], 'directOriginHash': direct_origin['Hash'], 'directOriginSubdir': direct_origin['Subdir'], 'zipSha256': hashlib.sha256(open(result['Zip'], 'rb').read()).hexdigest(), 'sourceCommit': os.environ['FOUNDATION_SOURCE_SHA'], 'planSha256': os.environ['FOUNDATION_PLAN_SHA256'], 'preparedRunId': os.environ['FOUNDATION_PREPARED_RUN_ID'], 'preparedRunAttempt': os.environ['FOUNDATION_PREPARED_RUN_ATTEMPT'], 'preparedArtifactId': os.environ['FOUNDATION_PREPARED_ARTIFACT_ID'], 'observerRunId': os.environ['GITHUB_RUN_ID'], 'observerAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'auth': {'requested': False, 'uploadAttempted': False}, 'observedAt': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat()}, output)
              output.write('\n')
          PY
          cat > "$RUNNER_TEMP/go-consumer/main.go" <<'GO'
          package main

          import _ "github.com/elsoul/erpc-sdk/packages/go"

          func main() {}
          GO
          (cd "$RUNNER_TEMP/go-consumer" && GOMODCACHE="$RUNNER_TEMP/go-mod-cache" GOPROXY="$GOPROXY" GOSUMDB="$GOSUMDB" go run .)
      - name: Upload Go proof
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-proof-go-${{ github.run_id }}
          path: go-proof.json
          if-no-files-found: error
          retention-days: 30

  proof-aggregate:
    name: Aggregate observed publication and source proofs
    needs:
      - publication-validation
      - npm
      - pypi
      - rubygems
      - rust-reuse
      - tags
      - go-proof
    if: ${{ inputs.mode == 'publish' && needs.publication-validation.result == 'success' && needs.npm.result == 'success' && needs.pypi.result == 'success' && needs.rubygems.result == 'success' && needs.rust-reuse.result == 'success' && needs.tags.result == 'success' && needs.go-proof.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download approved bundle, binding, and observed receipts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-bundle
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_binding_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-binding
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: foundation-proof-*
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/foundation-proof-downloads
          merge-multiple: false
      - name: Verify bundle and create complete evidence manifest
        env:
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_ARTIFACT_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          FOUNDATION_BINDING_FILE: ${{ runner.temp }}/sdk-foundation-binding/foundation-binding.json
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          FOUNDATION_PROOF_DIR: ${{ runner.temp }}/foundation-proofs
          FOUNDATION_PROOF_MANIFEST_FILE: ${{ runner.temp }}/foundation-proofs/foundation-proof-manifest.json
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs --foundation-verify
          mkdir -p "$FOUNDATION_PROOF_DIR"
          cp "$RUNNER_TEMP/foundation-proof-downloads/foundation-proof-npm-$GITHUB_RUN_ID/npm-proof.json" "$FOUNDATION_PROOF_DIR/npm-proof.json"
          cp "$RUNNER_TEMP/foundation-proof-downloads/foundation-proof-pypi-$GITHUB_RUN_ID/pypi-proof.json" "$FOUNDATION_PROOF_DIR/pypi-proof.json"
          cp "$RUNNER_TEMP/foundation-proof-downloads/foundation-proof-rubygems-$GITHUB_RUN_ID/rubygems-proof.json" "$FOUNDATION_PROOF_DIR/rubygems-proof.json"
          cp "$RUNNER_TEMP/foundation-proof-downloads/foundation-proof-rust-$GITHUB_RUN_ID/rust-proof.json" "$FOUNDATION_PROOF_DIR/rust-proof.json"
          cp "$RUNNER_TEMP/foundation-proof-downloads/foundation-proof-tags-$GITHUB_RUN_ID/tag-proof.json" "$FOUNDATION_PROOF_DIR/tag-proof.json"
          cp "$RUNNER_TEMP/foundation-proof-downloads/foundation-proof-go-$GITHUB_RUN_ID/go-proof.json" "$FOUNDATION_PROOF_DIR/go-proof.json"
          node scripts/verify-release.mjs --foundation-proof-verify
          mkdir -p "$RUNNER_TEMP/foundation-proof-receipts"
          for proof in npm-proof.json pypi-proof.json rubygems-proof.json rust-proof.json tag-proof.json go-proof.json; do cp "$FOUNDATION_PROOF_DIR/$proof" "$RUNNER_TEMP/foundation-proof-receipts/$proof"; done
      - name: Upload immutable first-snapshot receipts
        id: receipts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-proof-receipts-${{ github.run_id }}
          path: ${{ runner.temp }}/foundation-proof-receipts
          if-no-files-found: error
          retention-days: 365
      - name: Bind receipt snapshot artifact to the evidence manifest
        env:
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PROOF_DIR: ${{ runner.temp }}/foundation-proofs
          FOUNDATION_PROOF_MANIFEST_FILE: ${{ runner.temp }}/foundation-proofs/foundation-proof-manifest.json
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          FOUNDATION_PROOF_RECEIPTS_ARTIFACT_ID: ${{ steps.receipts.outputs.artifact-id }}
        run: node scripts/verify-release.mjs --foundation-proof-verify
      - name: Upload immutable aggregate evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-proof-aggregate-${{ github.run_id }}
          path: ${{ runner.temp }}/foundation-proofs
          if-no-files-found: error
          retention-days: 365

  github-release:
    name: Create or verify the final GitHub Release
    needs:
      - publication-validation
      - tags
      - go-proof
      - proof-aggregate
      - npm
      - pypi
      - rubygems
      - rust-reuse
    if: ${{ inputs.mode == 'publish' && needs.publication-validation.result == 'success' && needs.tags.result == 'success' && needs.go-proof.result == 'success' && needs.proof-aggregate.result == 'success' && needs.npm.result == 'success' && needs.pypi.result == 'success' && needs.rubygems.result == 'success' && needs.rust-reuse.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download approved bundle and binding
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-bundle
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_binding_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-binding
      - name: Download immutable aggregate evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: foundation-proof-aggregate-${{ github.run_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/foundation-proofs
      - name: Verify approved bundle before GitHub writes
        env:
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_ARTIFACT_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          FOUNDATION_BINDING_FILE: ${{ runner.temp }}/sdk-foundation-binding/foundation-binding.json
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: node scripts/verify-release.mjs --foundation-verify
      - name: Verify complete observed proof set before GitHub writes
        env:
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PROOF_DIR: ${{ runner.temp }}/foundation-proofs
          FOUNDATION_PROOF_MANIFEST_FILE: ${{ runner.temp }}/foundation-proofs/foundation-proof-manifest.json
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: |
          set -euo pipefail
          test -f "$FOUNDATION_PROOF_DIR/foundation-proof-manifest.json"
          node scripts/verify-release.mjs --foundation-proof-verify
      - name: Verify the exact tags before Release mutation
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/tags/non-rust-v0.9.1:refs/tags/non-rust-v0.9.1 refs/tags/packages/go/v0.9.1:refs/tags/packages/go/v0.9.1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_COMMIT" || true
          test "$(git rev-parse refs/tags/non-rust-v0.9.1)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse refs/tags/packages/go/v0.9.1)" = "$EXPECTED_COMMIT"
      - name: Prepare exact Release assets
        env:
          PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          BUNDLE_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          ASSET_DIR: ${{ runner.temp }}/sdk-foundation-release-assets
          PROOF_DIR: ${{ runner.temp }}/foundation-proofs
        run: |
          set -euo pipefail
          mkdir -p "$ASSET_DIR"
          cp "$PLAN_FILE" "$ASSET_DIR/foundation-plan.json"
          cp "$BUNDLE_DIR/release-body.md" "$ASSET_DIR/release-body.md"
          cp "$BUNDLE_DIR/go-inventory.json" "$ASSET_DIR/go-inventory.json"
          cp "$BUNDLE_DIR/rust-receipt.json" "$ASSET_DIR/rust-receipt.json"
          node --input-type=module - "$PLAN_FILE" "$BUNDLE_DIR" "$ASSET_DIR" <<'NODE'
          import { copyFileSync, readFileSync } from 'node:fs'
          const [planFile, bundle, assets] = process.argv.slice(2)
          const plan = JSON.parse(readFileSync(planFile, 'utf8'))
          for (const artifact of plan.artifacts) copyFileSync(`${bundle}/${artifact.filename}`, `${assets}/${artifact.filename}`)
          for (const proof of plan.proofAssets) copyFileSync(`${process.env.PROOF_DIR}/${proof}`, `${assets}/${proof}`)
          NODE
      - name: Reconcile existing Release or create a draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: non-rust-v0.9.1
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_TITLE: 'SDK release state: non-Rust 0.9.1 / Rust 0.10.0'
          BODY_FILE: ${{ runner.temp }}/sdk-foundation-bundle/release-body.md
          PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
        run: |
          set -euo pipefail
          node --input-type=module - "$PLAN_FILE" "$BODY_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const [planFile, bodyFile] = process.argv.slice(2)
          const plan = JSON.parse(readFileSync(planFile, 'utf8'))
          const body = readFileSync(bodyFile, 'utf8')
          if (plan.githubRelease?.body !== body || plan.githubRelease?.bodySha256 !== createHash('sha256').update(body).digest('hex')) throw new Error('Release body is not the approved plan body')
          NODE
          release_json="$RUNNER_TEMP/release.json"
          api_url="https://api.github.com/repos/$REPOSITORY/releases/tags/$TAG"
          set +e
          http_status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --output "$release_json" --write-out '%{http_code}' "$api_url")"
          curl_status=$?
          set -e
          test "$curl_status" -eq 0
          if [ "$http_status" = 404 ]; then
            gh release create "$TAG" --repo "$REPOSITORY" --target "$EXPECTED_COMMIT" --title "$RELEASE_TITLE" --notes-file "$BODY_FILE" --draft --latest=false
            http_status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --output "$release_json" --write-out '%{http_code}' "$api_url")"
            test "$http_status" = 200
          elif [ "$http_status" != 200 ]; then
            echo "GitHub Release read failed with HTTP $http_status" >&2
            exit 1
          fi
          node --input-type=module - "$release_json" "$BODY_FILE" "$TAG" "$EXPECTED_COMMIT" <<'NODE'
          import { readFileSync } from 'node:fs'
          const [releaseFile, bodyFile, tag, commit] = process.argv.slice(2)
          const release = JSON.parse(readFileSync(releaseFile, 'utf8'))
          const body = readFileSync(bodyFile, 'utf8')
          if (release.tag_name !== tag || release.name !== 'SDK release state: non-Rust 0.9.1 / Rust 0.10.0' || release.body !== body || release.target_commitish !== commit && release.target_commitish !== tag) throw new Error('existing GitHub Release does not match the approved body/tag/source')
          if (release.immutable && release.draft === false) console.log('immutable-release-reuse=true')
          console.log(`release_id=${release.id}`)
          NODE
      - name: Reconcile Release assets without overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: non-rust-v0.9.1
          ASSET_DIR: ${{ runner.temp }}/sdk-foundation-release-assets
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
        run: |
          set -euo pipefail
          release_id="$(gh api "/repos/$REPOSITORY/releases/tags/$TAG" --jq .id)"
          assets_json="$RUNNER_TEMP/release-assets.json"
          gh api "/repos/$REPOSITORY/releases/$release_id/assets?per_page=100" > "$assets_json"
          expected_assets="$RUNNER_TEMP/expected-release-assets.txt"
          remote_assets="$RUNNER_TEMP/remote-release-assets.txt"
          find "$ASSET_DIR" -maxdepth 1 -type f -exec basename {} \; | sort > "$expected_assets"
          node --input-type=module - "$assets_json" "$expected_assets" "$remote_assets" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [assetsFile, expectedFile, remoteFile] = process.argv.slice(2)
          const remote = JSON.parse(readFileSync(assetsFile, 'utf8'))
          const expected = new Set(readFileSync(expectedFile, 'utf8').split(/\r?\n/).filter(Boolean))
          for (const asset of remote) if (!expected.has(asset.name)) throw new Error(`unexpected existing Release asset ${asset.name}`)
          writeFileSync(remoteFile, remote.map(asset => asset.name).join('\n') + (remote.length ? '\n' : ''))
          NODE
          snapshot_dir="$RUNNER_TEMP/foundation-proof-snapshot"
          if grep -Fxq 'foundation-proof-manifest.json' "$remote_assets"; then
            mkdir -p "$snapshot_dir"
            gh release download "$TAG" --repo "$REPOSITORY" --pattern 'foundation-proof-manifest.json' --dir "$snapshot_dir" >/dev/null
            snapshot_context="$(jq -r '[.preparedRunId, .preparedRunAttempt, .preparedArtifactId, .proofReceiptsArtifactId] | @tsv' "$snapshot_dir/foundation-proof-manifest.json")"
            IFS=$'\t' read -r snapshot_run snapshot_attempt snapshot_artifact snapshot_receipts_artifact <<< "$snapshot_context"
            test -n "$snapshot_receipts_artifact" && test "$snapshot_receipts_artifact" != null
            remote_snapshot_dir="$RUNNER_TEMP/foundation-proof-remote"
            mkdir -p "$remote_snapshot_dir"
            for proof in npm-proof.json pypi-proof.json rubygems-proof.json rust-proof.json tag-proof.json go-proof.json; do
              if grep -Fxq "$proof" "$remote_assets"; then
                gh release download "$TAG" --repo "$REPOSITORY" --pattern "$proof" --dir "$remote_snapshot_dir" >/dev/null
                expected_digest="$(jq -r --arg name "$proof" '.receipts[$name]' "$snapshot_dir/foundation-proof-manifest.json")"
                test "$(sha256sum "$remote_snapshot_dir/$proof" | awk '{print $1}')" = "$expected_digest"
                cp "$remote_snapshot_dir/$proof" "$snapshot_dir/$proof"
              fi
            done
            recovery_zip="$RUNNER_TEMP/foundation-proof-receipts.zip"
            recovery_dir="$RUNNER_TEMP/foundation-proof-receipts-recovery"
            mkdir -p "$recovery_dir"
            curl --fail --silent --show-error --location --max-time 60 --retry 0 --user-agent "$RELEASE_USER_AGENT" --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/zip' --output "$recovery_zip" "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$snapshot_receipts_artifact/zip"
            unzip -q "$recovery_zip" -d "$recovery_dir"
            for proof in npm-proof.json pypi-proof.json rubygems-proof.json rust-proof.json tag-proof.json go-proof.json; do
              expected_digest="$(jq -r --arg name "$proof" '.receipts[$name]' "$snapshot_dir/foundation-proof-manifest.json")"
              test -f "$recovery_dir/$proof"
              test "$(sha256sum "$recovery_dir/$proof" | awk '{print $1}')" = "$expected_digest"
              cp "$recovery_dir/$proof" "$snapshot_dir/$proof"
            done
            FOUNDATION_PREPARED_RUN_ID="$snapshot_run" FOUNDATION_PREPARED_RUN_ATTEMPT="$snapshot_attempt" FOUNDATION_PREPARED_ARTIFACT_ID="$snapshot_artifact" FOUNDATION_PROOF_RECEIPTS_ARTIFACT_ID="$snapshot_receipts_artifact" FOUNDATION_PROOF_DIR="$snapshot_dir" FOUNDATION_PROOF_MANIFEST_FILE="$snapshot_dir/foundation-proof-manifest.json" node scripts/verify-release.mjs --foundation-proof-verify
            cp "$snapshot_dir"/*.json "$ASSET_DIR/"
          fi
          preflight_dir="$RUNNER_TEMP/release-asset-preflight"
          mkdir -p "$preflight_dir"
          while IFS= read -r name; do
            if grep -Fxq "$name" "$remote_assets"; then
              gh release download "$TAG" --repo "$REPOSITORY" --pattern "$name" --dir "$preflight_dir" >/dev/null
              test "$(sha256sum "$preflight_dir/$name" | awk '{print $1}')" = "$(sha256sum "$ASSET_DIR/$name" | awk '{print $1}')"
            fi
          done < "$expected_assets"
          missing=()
          while IFS= read -r name; do
            if ! grep -Fxq "$name" "$remote_assets"; then missing+=("$ASSET_DIR/$name"); fi
          done < "$expected_assets"
          if [ "${#missing[@]}" -gt 0 ]; then gh release upload "$TAG" --repo "$REPOSITORY" "${missing[@]}"; fi
          download_dir="$RUNNER_TEMP/release-asset-downloads"
          mkdir -p "$download_dir"
          for asset in "$ASSET_DIR"/*; do
            name="$(basename "$asset")"
            gh release download "$TAG" --repo "$REPOSITORY" --pattern "$name" --dir "$download_dir" >/dev/null
            test "$(sha256sum "$download_dir/$name" | awk '{print $1}')" = "$(sha256sum "$asset" | awk '{print $1}')"
          done
      - name: Publish matching draft and verify final Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: non-rust-v0.9.1
          BODY_FILE: ${{ runner.temp }}/sdk-foundation-bundle/release-body.md
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release-final.json"
          gh api "/repos/$REPOSITORY/releases/tags/$TAG" > "$release_json"
          draft="$(node --input-type=module - "$release_json" <<'NODE'
          import { readFileSync } from 'node:fs'
          console.log(JSON.parse(readFileSync(process.argv[2], 'utf8')).draft ? 'true' : 'false')
          NODE
          )"
          if [ "$draft" = true ]; then gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --latest=false; fi
          gh api "/repos/$REPOSITORY/releases/tags/$TAG" > "$release_json"
          node --input-type=module - "$release_json" "$BODY_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'
          const [releaseFile, bodyFile] = process.argv.slice(2)
          const release = JSON.parse(readFileSync(releaseFile, 'utf8'))
          if (release.draft || release.tag_name !== 'non-rust-v0.9.1' || release.name !== 'SDK release state: non-Rust 0.9.1 / Rust 0.10.0' || release.body !== readFileSync(bodyFile, 'utf8')) throw new Error('final GitHub Release proof failed')
          NODE
          cp "$release_json" "$RUNNER_TEMP/final-release-proof.json"
      - name: Upload final Release proof
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-final-release-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/final-release-proof.json
          if-no-files-found: error
          retention-days: 365
