          export PUBLICATION_RECOVERY_CONTEXT_FILE="$CONTEXT" PUBLICATION_RECOVERY_PLAN_FILE="$PLAN" PUBLICATION_RECOVERY_OBSERVER_RUN_ID="$GITHUB_RUN_ID" PUBLICATION_RECOVERY_OBSERVER_ATTEMPT="$GITHUB_RUN_ATTEMPT" PUBLICATION_RECOVERY_WORK_DIR="$WORK" PUBLICATION_RECOVERY_OUTPUT_FILE="$OUTPUT" PUBLICATION_RECOVERY_GO="$recovery_go" PUBLICATION_RECOVERY_GIT="$recovery_git" PUBLICATION_RECOVERY_PYTHON="$VENV/bin/python"
          node scripts/verify-release.mjs --publication-recovery-go-observe
