name: Release SDK foundation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare an approval bundle or publish an already approved bundle
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - publish
      expected_commit:
        description: Exact 40-character main commit to validate
        required: true
        type: string
      expected_version:
        description: Fixed non-Rust cohort version
        required: true
        default: 0.9.1
        type: string
      prepared_run_id:
        description: Successful preparation run ID for publish mode
        required: false
        type: number
      prepared_run_attempt:
        description: Preparation run attempt for publish mode
        required: false
        type: number
      prepared_artifact_id:
        description: Immutable prepared bundle artifact ID for publish mode
        required: false
        type: string
      prepared_binding_artifact_id:
        description: Immutable preparation binding artifact ID for publish mode
        required: false
        type: string
      approval_plan_sha256:
        description: Reviewed SHA-256 of the stable approval plan
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-foundation-release
  cancel-in-progress: false

env:
  RELEASE_USER_AGENT: erpc-sdk-release-verification (https://github.com/elsoul/erpc-sdk)
  EXPECTED_REPOSITORY: elsoul/erpc-sdk
  EXPECTED_REPOSITORY_ID: '1429568627'

jobs:
  prepare:
    name: Prepare immutable approval bundle
    if: ${{ inputs.mode == 'prepare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      binding_artifact_id: ${{ steps.binding.outputs.artifact-id }}
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Guard repository, event, ref, source, and cohort
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          FOUNDATION_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          CHECKOUT_HEAD="$(git rev-parse HEAD)" node scripts/verify-release.mjs --foundation-guard

      - name: Install pinned Node and package tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: false
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          corepack pnpm install --frozen-lockfile
      - name: Install pinned Python tooling
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Go tooling
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22.x'
          cache: false
      - name: Install pinned Ruby tooling
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: packages/ruby

      - name: Run source, common-data, and OSS controls
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs --scope non-rust --expected-version "$EXPECTED_VERSION"
          node scripts/verify-method-parity.mjs
          node scripts/agent-harness.mjs check
          node --test scripts/agent-harness.test.mjs
          node --test scripts/verify-release.test.mjs
          bash scripts/tests/check-oss-hygiene.test.sh
          bash scripts/tests/oss-hooks.test.sh
          node --test scripts/tests/oss-controls.test.mjs

      - name: Validate and build the exact npm archive
        env:
          BUNDLE_DIR: ${{ runner.temp }}/sdk-foundation-bundle
        run: |
          set -euo pipefail
          mkdir -p "$BUNDLE_DIR"
          corepack pnpm --filter @elsoul/erpc-sdk check
          corepack pnpm --filter @elsoul/erpc-sdk test
          corepack pnpm --filter @elsoul/erpc-sdk build
          (cd packages/typescript && npm install --global npm@11.19.1 && npm pack --ignore-scripts --json --pack-destination "$BUNDLE_DIR" > "$RUNNER_TEMP/npm-pack.json")
          test "$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" = 1
          npm_smoke="$RUNNER_TEMP/npm-smoke"
          mkdir -p "$npm_smoke"
          npm init --yes --prefix "$npm_smoke" >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --prefix "$npm_smoke" "$BUNDLE_DIR"/*.tgz >/dev/null
          (cd "$npm_smoke" && node --input-type=module -e "const sdk = await import('@elsoul/erpc-sdk'); if (!sdk) throw new Error('npm ESM smoke failed')")
          (cd "$npm_smoke" && node -e "if (!require('@elsoul/erpc-sdk')) throw new Error('npm CommonJS smoke failed')")

      - name: Validate and build exact Python distributions
        env:
          BUNDLE_DIR: ${{ runner.temp }}/sdk-foundation-bundle
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build==1.6.0 twine==7.0.0
          python -m build packages/python --outdir "$BUNDLE_DIR"
          python -m twine check "$BUNDLE_DIR"/*.whl "$BUNDLE_DIR"/*.tar.gz
          python -m venv "$RUNNER_TEMP/python-smoke"
          "$RUNNER_TEMP/python-smoke/bin/python" -m pip install --disable-pip-version-check --no-deps "$BUNDLE_DIR"/*.whl
          "$RUNNER_TEMP/python-smoke/bin/python" -c 'import erpc_sdk; assert erpc_sdk.__version__ == "0.9.1"'

      - name: Validate and build the exact Ruby gem
        env:
          BUNDLE_DIR: ${{ runner.temp }}/sdk-foundation-bundle
        run: |
          set -euo pipefail
          bundle exec rake check
          bundle exec rake test
          bundle exec rake package
          GEM_FILES=(packages/ruby/pkg/erpc-sdk-*.gem)
          test "${#GEM_FILES[@]}" -eq 1
          cp "${GEM_FILES[0]}" "$BUNDLE_DIR/"
          ruby packages/ruby/scripts/verify-package.rb

      - name: Describe exact package artifacts
        id: artifacts
        env:
          FOUNDATION_ARTIFACT_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          FOUNDATION_ARTIFACT_METADATA_FILE: ${{ runner.temp }}/sdk-foundation-bundle/artifact-metadata.json
        run: node scripts/verify-release.mjs --foundation-describe-artifacts

      - name: Freeze the Go tracked-file inventory
        env:
          FOUNDATION_GO_ROOT: packages/go
          FOUNDATION_GO_INVENTORY_FILE: ${{ runner.temp }}/sdk-foundation-bundle/go-inventory.json
        run: node scripts/verify-release.mjs --foundation-go-inventory

      - name: Verify the pre-existing Rust 0.10.0 receipt read-only
        id: rust
        env:
          RUST_METADATA: ${{ runner.temp }}/rust-metadata.json
          RUST_ARCHIVE: ${{ runner.temp }}/sdk-foundation-bundle/erpc-sdk-0.10.0.crate
          FOUNDATION_RUST_SOURCE: f05abe4276991612c4b5e404fdc768baace32e61
          FOUNDATION_RUST_SHA256: f2ad81528b35470b8f193dc45ad9f95e2d5ba0749b916ab9422cb07639088dd7
        run: |
          set -euo pipefail
          set +e
          RUST_STATUS="$(curl --silent --show-error --location --max-time 30 --retry 0 \
            --user-agent "$RELEASE_USER_AGENT" \
            --output "$RUST_METADATA" --write-out '%{http_code}' \
            https://crates.io/api/v1/crates/erpc-sdk/0.10.0)"
          RUST_CURL_STATUS=$?
          set -e
          test "$RUST_CURL_STATUS" -eq 0
          FOUNDATION_REGISTRY=rust REGISTRY_STATUS="$RUST_STATUS" REGISTRY_RESPONSE_FILE="$RUST_METADATA" \
            node scripts/verify-release.mjs --foundation-registry
          curl --fail --silent --show-error --location --max-time 60 --retry 0 \
            --user-agent "$RELEASE_USER_AGENT" \
            --output "$RUST_ARCHIVE" \
            https://crates.io/api/v1/crates/erpc-sdk/0.10.0/download
          test "$(sha256sum "$RUST_ARCHIVE" | awk '{print $1}')" = "$FOUNDATION_RUST_SHA256"
          node --input-type=module - "$RUST_METADATA" "$RUNNER_TEMP/sdk-foundation-bundle/rust-receipt.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [metadataFile, outputFile] = process.argv.slice(2)
          const metadata = JSON.parse(readFileSync(metadataFile, 'utf8'))
          const version = metadata.version
          if (version?.crate !== 'erpc-sdk' || version.num !== '0.10.0' || version.yanked !== false || version.checksum !== process.env.FOUNDATION_RUST_SHA256) throw new Error('Rust registry receipt does not match the approved artifact')
          writeFileSync(outputFile, JSON.stringify({ identity: 'erpc-sdk', version: '0.10.0', sourceCommit: process.env.FOUNDATION_RUST_SOURCE, sha256: process.env.FOUNDATION_RUST_SHA256, yanked: false, downloadUrl: 'https://crates.io/api/v1/crates/erpc-sdk/0.10.0/download' }, null, 2) + '\n')
          NODE
      - name: Preflight the exact 0.9.1 registry versions
        id: preflight
        env:
          PREFLIGHT_DIR: ${{ runner.temp }}/sdk-foundation-preflight
          ARTIFACT_METADATA: ${{ runner.temp }}/sdk-foundation-bundle/artifact-metadata.json
        run: |
          set -euo pipefail
          mkdir -p "$PREFLIGHT_DIR"
          pypi_files="$(node --input-type=module - "$ARTIFACT_METADATA" <<'NODE'
          import { readFileSync } from 'node:fs'
          const artifacts = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          console.log(JSON.stringify(artifacts.filter(item => item.kind.startsWith('pypi')).map(item => item.filename)))
          NODE
          )"
          probe() {
            local registry="$1" url="$2" output="$3" artifacts="${4:-}"
            set +e
            local status
            status="$(curl --silent --show-error --max-time 20 --retry 0 \
              --user-agent "$RELEASE_USER_AGENT" --output "$output" --write-out '%{http_code}' "$url")"
            local curl_status=$?
            set -e
            test "$curl_status" -eq 0
            FOUNDATION_REGISTRY="$registry" REGISTRY_STATUS="$status" REGISTRY_RESPONSE_FILE="$output" \
              EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_ARTIFACTS="$artifacts" \
              node scripts/verify-release.mjs --foundation-registry > "$output.state"
            printf '%s\n' "$status" > "$output.status"
          }
          probe npm 'https://registry.npmjs.org/%40elsoul%2Ferpc-sdk/0.9.1' "$PREFLIGHT_DIR/npm.json"
          probe pypi 'https://pypi.org/pypi/erpc-sdk/0.9.1/json' "$PREFLIGHT_DIR/pypi.json" "$pypi_files"
          probe rubygems 'https://rubygems.org/api/v2/rubygems/erpc-sdk/versions/0.9.1.json' "$PREFLIGHT_DIR/rubygems.json"
          node --input-type=module - "$PREFLIGHT_DIR" "$RUNNER_TEMP/sdk-foundation-bundle/preflight.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [dir, output] = process.argv.slice(2)
          const read = name => ({ state: readFileSync(`${dir}/${name}.json.state`, 'utf8').trim(), status: Number(readFileSync(`${dir}/${name}.json.status`, 'utf8').trim()) })
          const preflight = { npm: read('npm'), pypi: read('pypi'), rubygems: read('rubygems'), rust: { state: 'match', status: 200 } }
          for (const [name, record] of Object.entries(preflight)) if (name !== 'rust' && record.state !== 'absent') throw new Error(`${name} 0.9.1 was not absent during preparation`)
          writeFileSync(output, JSON.stringify(preflight, null, 2) + '\n')
          NODE

      - name: Build the stable approval plan and body
        id: plan
        env:
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_ARTIFACT_METADATA_FILE: ${{ runner.temp }}/sdk-foundation-bundle/artifact-metadata.json
          FOUNDATION_GO_INVENTORY_FILE: ${{ runner.temp }}/sdk-foundation-bundle/go-inventory.json
          FOUNDATION_RUST_RECEIPT_FILE: ${{ runner.temp }}/sdk-foundation-bundle/rust-receipt.json
          FOUNDATION_PREFLIGHT_FILE: ${{ runner.temp }}/sdk-foundation-bundle/preflight.json
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_BODY_FILE: ${{ runner.temp }}/sdk-foundation-bundle/release-body.md
          FOUNDATION_PLAN_DIGEST_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.sha256
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs --foundation-plan
          PLAN_SHA256="$(tr -d '\r\n' < "$FOUNDATION_PLAN_DIGEST_FILE")"
          echo "plan_sha256=$PLAN_SHA256" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$PLAN_SHA256" > "$RUNNER_TEMP/plan-sha256-output"
          find "$RUNNER_TEMP/sdk-foundation-bundle" -maxdepth 1 -type f ! -name checksums.txt -print0 | xargs -0 sha256sum > "$RUNNER_TEMP/sdk-foundation-bundle/checksums.txt"

      - name: Upload the immutable approval bundle
        id: bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sdk-foundation-bundle-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/sdk-foundation-bundle
          if-no-files-found: error
          retention-days: 30

      - name: Bind the bundle to this successful preparation run
        id: binding_file
        env:
          BINDING_FILE: ${{ runner.temp }}/foundation-binding.json
          PLAN_SHA256: ${{ steps.plan.outputs.plan_sha256 }}
          ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          node --input-type=module - "$BINDING_FILE" <<'NODE'
          import { writeFileSync } from 'node:fs'
          const output = process.argv[2]
          writeFileSync(output, JSON.stringify({ repository: process.env.EXPECTED_REPOSITORY, repositoryId: process.env.EXPECTED_REPOSITORY_ID, workflowPath: '.github/workflows/release.yml', sourceCommit: process.env.GITHUB_SHA, version: process.env.EXPECTED_VERSION, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, artifactId: process.env.ARTIFACT_ID, planSha256: process.env.PLAN_SHA256 }, null, 2) + '\n')
          NODE
      - name: Upload the run/artifact binding
        id: binding
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sdk-foundation-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundation-binding.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish preparation summary
        env:
          PLAN_SHA256: ${{ steps.plan.outputs.plan_sha256 }}
          ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
          BINDING_ARTIFACT_ID: ${{ steps.binding.outputs.artifact-id }}
        run: |
          set -euo pipefail
          {
            echo '## SDK foundation approval bundle'
            echo "source_sha=$GITHUB_SHA"
            echo "plan_sha256=$PLAN_SHA256"
            echo "artifact_id=$ARTIFACT_ID"
            echo "binding_artifact_id=$BINDING_ARTIFACT_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  publication-validation:
    name: Validate approved publication bundle
    if: ${{ inputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      plan_sha256: ${{ steps.verify.outputs.plan_sha256 }}
    steps:
      - name: Check out the exact approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Guard publish source and cohort
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          FOUNDATION_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          CHECKOUT_HEAD="$(git rev-parse HEAD)" node scripts/verify-release.mjs --foundation-guard
      - name: Download exact preparation bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-bundle
      - name: Download exact preparation binding
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_binding_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-binding
      - name: Verify approved plan, artifact IDs, run, source, and bytes
        id: verify
        env:
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_ARTIFACT_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          FOUNDATION_BINDING_FILE: ${{ runner.temp }}/sdk-foundation-binding/foundation-binding.json
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ID" != "$PREPARED_RUN_ID"
          node scripts/verify-release.mjs --foundation-verify
          echo "plan_sha256=$FOUNDATION_PLAN_SHA256" >> "$GITHUB_OUTPUT"

  npm:
    name: Publish exact npm archive
    needs: publication-validation
    if: ${{ inputs.mode == 'publish' && needs.publication-validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30deaf803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download approved bundle and binding
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-bundle
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_binding_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-binding
      - name: Verify approved bundle before authentication
        env:
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_ARTIFACT_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          FOUNDATION_BINDING_FILE: ${{ runner.temp }}/sdk-foundation-binding/foundation-binding.json
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: node scripts/verify-release.mjs --foundation-verify
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: false
      - name: Install npm Trusted Publishing CLI and locate archive
        id: locate
        env:
          PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1
          NPM_FILE="$(node --input-type=module - "$PLAN_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'
          const plan = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          console.log(plan.artifacts.find(item => item.kind === 'npm').filename)
          NODE
          )"
          NPM_SHA256="$(node --input-type=module - "$PLAN_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'
          const plan = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          console.log(plan.artifacts.find(item => item.kind === 'npm').sha256)
          NODE
          )"
          echo "filename=$NPM_FILE" >> "$GITHUB_OUTPUT"
          echo "sha256=$NPM_SHA256" >> "$GITHUB_OUTPUT"
      - name: Inspect npm version before authentication
        id: preflight
        env:
          RESPONSE_FILE: ${{ runner.temp }}/npm-version.json
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          set +e
          STATUS="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RESPONSE_FILE" --write-out '%{http_code}' "https://registry.npmjs.org/%40elsoul%2Ferpc-sdk/$EXPECTED_VERSION")"
          CURL_STATUS=$?
          set -e
          test "$CURL_STATUS" -eq 0
          FOUNDATION_REGISTRY=npm REGISTRY_STATUS="$STATUS" REGISTRY_RESPONSE_FILE="$RESPONSE_FILE" EXPECTED_VERSION="$EXPECTED_VERSION" node scripts/verify-release.mjs --foundation-registry > "$RUNNER_TEMP/npm-state"
          echo "state=$(cat "$RUNNER_TEMP/npm-state")" >> "$GITHUB_OUTPUT"
      - name: Download matching npm archive without a token
        if: steps.preflight.outputs.state == 'match'
        env:
          NPM_FILE: ${{ steps.locate.outputs.filename }}
          NPM_SHA256: ${{ steps.locate.outputs.sha256 }}
          RESPONSE_FILE: ${{ runner.temp }}/npm-version.json
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 60 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RUNNER_TEMP/npm-published.tgz" "https://registry.npmjs.org/@elsoul/erpc-sdk/-/$(basename "$NPM_FILE")"
          test "$(sha256sum "$RUNNER_TEMP/npm-published.tgz" | awk '{print $1}')" = "$NPM_SHA256"
          node --input-type=module - "$RESPONSE_FILE" "$RUNNER_TEMP/npm-published.tgz" "$EXPECTED_VERSION" <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          const [metadataFile, archiveFile, version] = process.argv.slice(2)
          const metadata = JSON.parse(readFileSync(metadataFile, 'utf8'))?.versions?.[version]
          const observed = `sha512-${createHash('sha512').update(readFileSync(archiveFile)).digest('base64')}`
          if (metadata?.dist?.integrity !== observed) throw new Error('npm dist.integrity does not match the downloaded archive')
          NODE
      - name: Publish exact npm tarball with OIDC
        if: steps.preflight.outputs.state == 'absent'
        id: publish_npm
        continue-on-error: true
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/empty-npmrc
        run: |
          set -euo pipefail
          : > "$NPM_CONFIG_USERCONFIG"
          npm publish "$RUNNER_TEMP/sdk-foundation-bundle/${{ steps.locate.outputs.filename }}" --registry=https://registry.npmjs.org/ --access public --provenance --ignore-scripts
      - name: Verify npm publication after upload or reuse
        if: always() && (steps.preflight.outputs.state == 'absent' || steps.preflight.outputs.state == 'match')
        env:
          RESPONSE_FILE: ${{ runner.temp }}/npm-version-final.json
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          NPM_FILE: ${{ steps.locate.outputs.filename }}
          NPM_SHA256: ${{ steps.locate.outputs.sha256 }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            set +e
            STATUS="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RESPONSE_FILE" --write-out '%{http_code}' "https://registry.npmjs.org/%40elsoul%2Ferpc-sdk/$EXPECTED_VERSION")"
            CURL_STATUS=$?
            set -e
            test "$CURL_STATUS" -eq 0
            if [ "$STATUS" = 200 ]; then break; fi
            if [ "$STATUS" != 404 ] || [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 5
          done
          FOUNDATION_REGISTRY=npm REGISTRY_STATUS="$STATUS" REGISTRY_RESPONSE_FILE="$RESPONSE_FILE" EXPECTED_VERSION="$EXPECTED_VERSION" node scripts/verify-release.mjs --foundation-registry
          curl --fail --silent --show-error --location --max-time 60 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RUNNER_TEMP/npm-final.tgz" "https://registry.npmjs.org/@elsoul/erpc-sdk/-/$NPM_FILE"
          test "$(sha256sum "$RUNNER_TEMP/npm-final.tgz" | awk '{print $1}')" = "$NPM_SHA256"
          node --input-type=module - "$RESPONSE_FILE" "$RUNNER_TEMP/npm-final.tgz" "$EXPECTED_VERSION" <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          const [metadataFile, archiveFile, version] = process.argv.slice(2)
          const metadata = JSON.parse(readFileSync(metadataFile, 'utf8'))?.versions?.[version]
          const observed = `sha512-${createHash('sha512').update(readFileSync(archiveFile)).digest('base64')}`
          if (metadata?.dist?.integrity !== observed) throw new Error('npm dist.integrity does not match the downloaded archive')
          NODE
          printf '%s\n' '{"registry":"npm","verified":true,"credential":"short-lived OIDC","source":"approved archive"}' > "$RUNNER_TEMP/npm-proof.json"
      - name: Clean npm credential workspace
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/empty-npmrc"
      - name: Upload npm proof
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-proof-npm-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-proof.json
          if-no-files-found: ignore
          retention-days: 30

  pypi:
    name: Publish exact PyPI distributions
    needs: publication-validation
    if: ${{ inputs.mode == 'publish' && needs.publication-validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download approved bundle and binding
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-bundle
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_binding_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-binding
      - name: Verify approved bundle before authentication
        env:
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_ARTIFACT_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          FOUNDATION_BINDING_FILE: ${{ runner.temp }}/sdk-foundation-binding/foundation-binding.json
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: node scripts/verify-release.mjs --foundation-verify
      - name: Set up Python packaging tools
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Locate approved Python files
        id: locate
        env:
          PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
        run: |
          set -euo pipefail
          python - "$PLAN_FILE" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          plan = json.load(open(sys.argv[1], encoding='utf-8'))
          out = open(sys.argv[2], 'a', encoding='utf-8')
          for kind, key in [('pypi-wheel', 'wheel'), ('pypi-sdist', 'sdist')]:
              item = next(a for a in plan['artifacts'] if a['kind'] == kind)
              print(f"{key}_file={item['filename']}", file=out)
              print(f"{key}_sha256={item['sha256']}", file=out)
          PY
      - name: Inspect PyPI file state and stage only missing approved files
        id: preflight
        env:
          RESPONSE_FILE: ${{ runner.temp }}/pypi-version.json
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_ARTIFACTS: '["${{ steps.locate.outputs.wheel_file }}","${{ steps.locate.outputs.sdist_file }}"]'
          BUNDLE_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          STAGE_DIR: ${{ runner.temp }}/pypi-stage
        run: |
          set -euo pipefail
          mkdir -p "$STAGE_DIR"
          set +e
          STATUS="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RESPONSE_FILE" --write-out '%{http_code}' "https://pypi.org/pypi/erpc-sdk/$EXPECTED_VERSION/json")"
          CURL_STATUS=$?
          set -e
          test "$CURL_STATUS" -eq 0
          FOUNDATION_REGISTRY=pypi REGISTRY_STATUS="$STATUS" REGISTRY_RESPONSE_FILE="$RESPONSE_FILE" EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_ARTIFACTS="$EXPECTED_ARTIFACTS" node scripts/verify-release.mjs --foundation-registry > "$RUNNER_TEMP/pypi-state"
          STATE="$(cat "$RUNNER_TEMP/pypi-state")"
          python - "$STATUS" "$RESPONSE_FILE" "$BUNDLE_DIR" "$STAGE_DIR" "$EXPECTED_ARTIFACTS" "$STATE" <<'PY'
          import hashlib, json, shutil, sys
          status, response, bundle, stage, expected_json, state = sys.argv[1:]
          expected = json.loads(expected_json)
          plan = json.load(open(f'{bundle}/foundation-plan.json', encoding='utf-8'))
          approved = {a['filename']: a['sha256'] for a in plan['artifacts'] if a['kind'].startswith('pypi')}
          missing = set(expected)
          if status == '200':
              payload = json.load(open(response, encoding='utf-8'))
              files = {item['filename']: item for item in payload.get('urls', []) if item.get('filename') in expected}
              if any(name not in files for name in expected):
                  missing = {name for name in expected if name not in files}
              for name, item in files.items():
                  if item.get('yanked') or item.get('digests', {}).get('sha256') != approved[name]:
                      raise SystemExit(f'PyPI conflict for {name}')
                  missing.discard(name)
          for name in missing:
              shutil.copyfile(f'{bundle}/{name}', f'{stage}/{name}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'state={state}', file=output)
              print(f'missing={str(bool(missing)).lower()}', file=output)
          PY
      - name: Publish missing PyPI files with Trusted Publishing
        if: steps.preflight.outputs.missing == 'true'
        id: publish_pypi
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/pypi-stage
      - name: Verify complete PyPI file set and downloads
        if: always() && (steps.preflight.outputs.state == 'absent' || steps.preflight.outputs.state == 'partial' || steps.preflight.outputs.state == 'match')
        env:
          RESPONSE_FILE: ${{ runner.temp }}/pypi-version-final.json
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          WHEEL_FILE: ${{ steps.locate.outputs.wheel_file }}
          WHEEL_SHA256: ${{ steps.locate.outputs.wheel_sha256 }}
          SDIST_FILE: ${{ steps.locate.outputs.sdist_file }}
          SDIST_SHA256: ${{ steps.locate.outputs.sdist_sha256 }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            set +e
            STATUS="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RESPONSE_FILE" --write-out '%{http_code}' "https://pypi.org/pypi/erpc-sdk/$EXPECTED_VERSION/json")"
            CURL_STATUS=$?
            set -e
            test "$CURL_STATUS" -eq 0
            if [ "$STATUS" = 200 ]; then break; fi
            if [ "$STATUS" != 404 ] || [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 5
          done
          test "$STATUS" = 200
          python - "$RESPONSE_FILE" "$WHEEL_FILE" "$WHEEL_SHA256" "$SDIST_FILE" "$SDIST_SHA256" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          wanted = {sys.argv[2]: sys.argv[3], sys.argv[4]: sys.argv[5]}
          files = {item['filename']: item for item in payload.get('urls', [])}
          for name, digest in wanted.items():
              item = files.get(name)
              if not item or item.get('yanked') or item.get('digests', {}).get('sha256') != digest:
                  raise SystemExit(f'PyPI proof mismatch for {name}')
              print(f"{name}\t{item['url']}\t{digest}")
          PY
          while IFS=$'\t' read -r name url digest; do
            curl --fail --silent --show-error --location --max-time 60 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RUNNER_TEMP/$name" "$url"
            test "$(sha256sum "$RUNNER_TEMP/$name" | awk '{print $1}')" = "$digest"
          done < <(python - "$RESPONSE_FILE" "$WHEEL_FILE" "$WHEEL_SHA256" "$SDIST_FILE" "$SDIST_SHA256" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          wanted = {sys.argv[2]: sys.argv[3], sys.argv[4]: sys.argv[5]}
          for item in payload.get('urls', []):
              if item.get('filename') in wanted:
                  print(f"{item['filename']}\t{item['url']}\t{wanted[item['filename']]}")
          PY
          )
          printf '%s\n' '{"registry":"pypi","verified":true,"credential":"short-lived OIDC","attestations":"official action default"}' > "$RUNNER_TEMP/pypi-proof.json"
      - name: Upload PyPI proof
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-proof-pypi-${{ github.run_id }}
          path: ${{ runner.temp }}/pypi-proof.json
          if-no-files-found: ignore
          retention-days: 30

  rubygems:
