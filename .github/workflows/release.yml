          PYPI_RECEIPT_ID: ${{ needs.release-set-publish-pypi.outputs.receipt_artifact_id }}
          RUBYGEMS_RECEIPT_ID: ${{ needs.release-set-publish-rubygems.outputs.receipt_artifact_id }}
          RELEASE_SET_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          RELEASE_SET_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          RELEASE_SET_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          RELEASE_SET_PREPARED_BINDING_ARTIFACT_ID: ${{ inputs.prepared_binding_artifact_id }}
        run: |
          set -euo pipefail
          meta_dir="$RUNNER_TEMP/release-set-finalizer/package-artifact-metadata"
          mkdir -p "$meta_dir"
          gh api "repos/$REPOSITORY/actions/artifacts/$NPM_RECEIPT_ID" > "$meta_dir/npm-proof.json.meta.json"
          gh api "repos/$REPOSITORY/actions/artifacts/$PYPI_RECEIPT_ID" > "$meta_dir/pypi-proof.json.meta.json"
          gh api "repos/$REPOSITORY/actions/artifacts/$RUBYGEMS_RECEIPT_ID" > "$meta_dir/rubygems-proof.json.meta.json"
          node --input-type=module - "$meta_dir" "$RUNNER_TEMP/release-set-package-receipt-artifacts.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const [directory, output] = process.argv.slice(2); const runId = String(process.env.GITHUB_RUN_ID); const runAttempt = String(process.env.GITHUB_RUN_ATTEMPT); const sourceCommit = process.env.EXPECTED_COMMIT
          const requested = { 'npm-proof.json': process.env.NPM_RECEIPT_ID, 'pypi-proof.json': process.env.PYPI_RECEIPT_ID, 'rubygems-proof.json': process.env.RUBYGEMS_RECEIPT_ID }
          const expectedNames = { 'npm-proof.json': 'release-set-npm-proof-' + runId + '-' + runAttempt, 'pypi-proof.json': 'release-set-pypi-proof-' + runId + '-' + runAttempt, 'rubygems-proof.json': 'release-set-rubygems-proof-' + runId + '-' + runAttempt }
          const producer = { repository: 'elsoul/erpc-sdk', repositoryId: '1429568627', workflowPath: '.github/workflows/release.yml', sourceCommit, runId, runAttempt, ref: 'refs/heads/main', event: 'workflow_dispatch' }; const bindings = {}
          for (const filename of Object.keys(requested)) {
            const meta = JSON.parse(readFileSync(join(directory, filename + '.meta.json'), 'utf8'))
            if (String(meta.id) !== String(requested[filename]) || meta.name !== expectedNames[filename] || meta.expired !== false || meta.workflow_run?.id !== Number(runId) || meta.workflow_run?.head_sha !== sourceCommit || !/^sha256:[0-9a-f]{64}$/.test(meta.digest ?? '') || !Number.isSafeInteger(meta.size_in_bytes) || meta.size_in_bytes <= 0) throw new Error('package receipt artifact metadata is not exact for ' + filename)
            bindings[filename] = { artifactId: String(meta.id), artifactName: meta.name, sha256: meta.digest.slice(7), sizeInBytes: meta.size_in_bytes, producer }
          }
