          INPUT: ${{ runner.temp }}/recovery-pypi-input.json
          RESPONSE: ${{ runner.temp }}/recovery-pypi.json
          PUBLICATION_RECOVERY_SOURCE_M: ${{ env.PUBLICATION_RECOVERY_SOURCE_M }}
          PUBLICATION_RECOVERY_CONTROL_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          mkdir -p "$STAGE"
          version=0.11.0
          status="$(curl --silent --show-error --max-time 30 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RESPONSE" --write-out '%{http_code}' "https://pypi.org/pypi/erpc-sdk/$version/json")"
          if [ "$status" = 200 ]; then
            "$RUNNER_TEMP/recovery-venv/bin/python" - "$RESPONSE" "$RUNNER_TEMP/pypi-existing-proof.json" "$PUBLICATION_RECOVERY_SOURCE_M" "$PUBLICATION_RECOVERY_CONTROL_COMMIT" <<'PY'
          import json, re, sys, urllib.request
          from cryptography import x509
          from pypi_attestations import Distribution, GitHubPublisher, Provenance
          response, output, source, control = sys.argv[1:]
          payload = json.load(open(response, encoding='utf-8'))
          expected = {item['filename']: item for item in payload['urls'] if item.get('filename') in {'erpc_sdk-0.11.0-py3-none-any.whl', 'erpc_sdk-0.11.0.tar.gz'}}
          result = {}
          for filename, item in expected.items():
              digest = item.get('digests', {}).get('sha256')
              provenance_url = f"https://pypi.org/integrity/erpc-sdk/0.11.0/{filename}/provenance"
              with urllib.request.urlopen(item['url'], timeout=30) as handle: archive = handle.read()
