          path: ${{ runner.temp }}/release-set-receipt-downloads/npm
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.release-set-publish-pypi.outputs.receipt_artifact_id }}
          path: ${{ runner.temp }}/release-set-receipt-downloads/pypi
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.release-set-publish-rubygems.outputs.receipt_artifact_id }}
          path: ${{ runner.temp }}/release-set-receipt-downloads/rubygems
      - name: Verify preparation and materialize receipt workspace
        env:
          PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          BINDING_FILE: ${{ runner.temp }}/release-set-verified/binding/release-set-binding.json
