          cp "$RUNNER_TEMP/release-set-bundle-meta.json" "$VERIFIED_DIR/evidence/bundle-metadata.json"
          cp "$RUNNER_TEMP/release-set-binding-meta.json" "$VERIFIED_DIR/evidence/binding-metadata.json"
