                      subject = next((s for s in statement.get('subject', []) if s.get('name') == filename and s.get('digest', {}).get('sha256') == digest), None)
                      if statement.get('predicateType') != 'https://docs.pypi.org/attestations/publish/v1' or subject is None: continue
