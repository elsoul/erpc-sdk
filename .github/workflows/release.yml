      - name: Observe PyPI bytes, attestations, and fresh consumers
        if: always() && (steps.preflight.outputs.state == 'absent' || steps.preflight.outputs.state == 'partial' || steps.preflight.outputs.state == 'match')
        env:
          CONTEXT: ${{ runner.temp }}/recovery/recovery-context.json
          PLAN: ${{ runner.temp }}/recovery/recovery-bundle/release-set-plan.json
