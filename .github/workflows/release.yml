          REPOSITORY: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          mkdir -p "$CONTEXT_DIR"
          node --input-type=module - "$PUBLISHERS_FILE" "$CONTEXT_DIR/requests.tsv" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const publishers = JSON.parse(readFileSync(process.argv[2], 'utf8')); const seen = new Set(); const rows = []
          for (const publisher of Object.values(publishers)) { const key = `${publisher.publisherRunId}/${publisher.publisherAttempt}`; if (!seen.has(key)) { seen.add(key); rows.push(key) } }
          writeFileSync(process.argv[3], `${rows.join('\n')}\n`)
          NODE
          while IFS=/ read -r run_id attempt; do
            [ -n "$run_id" ] || continue
            gh api "/repos/$REPOSITORY/actions/runs/$run_id/attempts/$attempt" > "$CONTEXT_DIR/$run_id-$attempt.json"
          done < "$CONTEXT_DIR/requests.tsv"
          node --input-type=module - "$PUBLISHERS_FILE" "$CONTEXT_DIR" "$EXPECTED_COMMIT" <<'NODE'
          import { readFileSync } from 'node:fs'
          const [publisherFile, directory, source] = process.argv.slice(2); const publishers = JSON.parse(readFileSync(publisherFile, 'utf8'))
          for (const publisher of Object.values(publishers)) { const run = JSON.parse(readFileSync(`${directory}/${publisher.publisherRunId}-${publisher.publisherAttempt}.json`, 'utf8')); if (String(run.id) !== String(publisher.publisherRunId) || String(run.run_attempt) !== String(publisher.publisherAttempt) || run.head_sha !== source || run.head_branch !== 'main' || run.event !== 'workflow_dispatch' || run.path !== '.github/workflows/release.yml' || String(run.repository?.id ?? run.repository_id) !== '1429568627' || (run.repository?.full_name !== undefined && run.repository.full_name !== 'elsoul/erpc-sdk')) throw new Error('PyPI original publisher run context is not bound to the approved source'); const current = run.id === Number(process.env.GITHUB_RUN_ID) && run.run_attempt === Number(process.env.GITHUB_RUN_ATTEMPT); if (!current && (run.status !== 'completed' || !['success', 'failure', 'cancelled', 'timed_out', 'action_required', 'neutral', 'skipped'].includes(run.conclusion))) throw new Error('PyPI historical publisher run is not terminal') }
          NODE
      - name: Verify existing PyPI files before missing-file authentication
        if: steps.preflight.outputs.state == 'partial' || steps.preflight.outputs.state == 'match'
        env:
          RELEASE_SET_PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          RELEASE_SET_PLAN_SHA256: ${{ inputs.release_set_plan_sha256 }}
          RELEASE_SET_BINDING_FILE: ${{ runner.temp }}/release-set-verified/binding/release-set-binding.json
          RELEASE_SET_ARTIFACT_DIR: ${{ runner.temp }}/release-set-verified/bundle
          RELEASE_SET_BINDING_DIR: ${{ runner.temp }}/release-set-verified/binding
          RELEASE_SET_RUN_FILE: ${{ runner.temp }}/release-set-verified/evidence/run.json
          RELEASE_SET_ARTIFACT_METADATA_FILE: ${{ runner.temp }}/release-set-verified/evidence/bundle-metadata.json
          RELEASE_SET_BINDING_METADATA_FILE: ${{ runner.temp }}/release-set-verified/evidence/binding-metadata.json
          RELEASE_SET_BUNDLE_ZIP_FILE: ${{ runner.temp }}/release-set-verified/zips/bundle.zip
          RELEASE_SET_BINDING_ZIP_FILE: ${{ runner.temp }}/release-set-verified/zips/binding.zip
          RELEASE_SET_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          RELEASE_SET_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          RELEASE_SET_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          RELEASE_SET_PREPARED_BINDING_ARTIFACT_ID: ${{ inputs.prepared_binding_artifact_id }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CHECKOUT_HEAD: ${{ inputs.expected_commit }}
          CHECKOUT_STATUS: ''
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_SET_PYPI_PUBLISHERS_FILE: ${{ runner.temp }}/pypi-publishers.json
          RELEASE_SET_PYPI_OBSERVER_RUN_ID: ${{ github.run_id }}
          RELEASE_SET_PYPI_OBSERVER_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_SET_PYPI_OBSERVER_WORKFLOW: .github/workflows/release.yml
          RELEASE_SET_PYPI_OBSERVER_SOURCE: ${{ inputs.expected_commit }}
          RELEASE_SET_PYPI_OUTPUT_FILE: ${{ runner.temp }}/pypi-existing-proof.json
          RELEASE_SET_PYPI_WORK_DIR: ${{ runner.temp }}/pypi-existing-observer
          RELEASE_SET_PYPI_PREFLIGHT_ONLY: 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_SET_PYPI_WORK_DIR"
          RELEASE_SET_PYPI_PYTHON="$(command -v python)" node scripts/verify-release.mjs --release-set-pypi-observe
      - name: Publish exact missing PyPI files with the pinned trusted publisher
        if: steps.preflight.outputs.missing == 'true'
        id: publish_pypi
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/release-set-pypi
          attestations: true
      - name: Observe PyPI files, attestations, and consumers
        if: always() && (steps.preflight.outputs.state == 'absent' || steps.preflight.outputs.state == 'partial' || steps.preflight.outputs.state == 'match')
        id: observe_pypi
        env:
          RELEASE_SET_PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          RELEASE_SET_PLAN_SHA256: ${{ inputs.release_set_plan_sha256 }}
          RELEASE_SET_BINDING_FILE: ${{ runner.temp }}/release-set-verified/binding/release-set-binding.json
          RELEASE_SET_ARTIFACT_DIR: ${{ runner.temp }}/release-set-verified/bundle
          RELEASE_SET_BINDING_DIR: ${{ runner.temp }}/release-set-verified/binding
          RELEASE_SET_RUN_FILE: ${{ runner.temp }}/release-set-verified/evidence/run.json
          RELEASE_SET_ARTIFACT_METADATA_FILE: ${{ runner.temp }}/release-set-verified/evidence/bundle-metadata.json
          RELEASE_SET_BINDING_METADATA_FILE: ${{ runner.temp }}/release-set-verified/evidence/binding-metadata.json
          RELEASE_SET_BUNDLE_ZIP_FILE: ${{ runner.temp }}/release-set-verified/zips/bundle.zip
          RELEASE_SET_BINDING_ZIP_FILE: ${{ runner.temp }}/release-set-verified/zips/binding.zip
          RELEASE_SET_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          RELEASE_SET_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          RELEASE_SET_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          RELEASE_SET_PREPARED_BINDING_ARTIFACT_ID: ${{ inputs.prepared_binding_artifact_id }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CHECKOUT_HEAD: ${{ inputs.expected_commit }}
          CHECKOUT_STATUS: ''
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_SET_PYPI_PUBLISHERS_FILE: ${{ runner.temp }}/pypi-publishers.json
          RELEASE_SET_PYPI_OBSERVER_RUN_ID: ${{ github.run_id }}
          RELEASE_SET_PYPI_OBSERVER_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_SET_PYPI_OBSERVER_WORKFLOW: .github/workflows/release.yml
          RELEASE_SET_PYPI_OBSERVER_SOURCE: ${{ inputs.expected_commit }}
          RELEASE_SET_PYPI_OUTPUT_FILE: ${{ runner.temp }}/pypi-proof.json
          RELEASE_SET_PYPI_WORK_DIR: ${{ runner.temp }}/pypi-observer
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_SET_PYPI_WORK_DIR"
          RELEASE_SET_PYPI_PYTHON="$(command -v python)" node scripts/verify-release.mjs --release-set-pypi-observe
      - name: Record PyPI publication outcome
        if: always()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/release-set-pypi-publication
          RECEIPT_DIR: ${{ runner.temp }}/release-set-pypi-receipt
          OBSERVER_FILE: ${{ runner.temp }}/pypi-proof.json
          PREFLIGHT_STATE: ${{ steps.preflight.outputs.state }}
          MISSING: ${{ steps.preflight.outputs.missing }}
          UPLOAD_OUTCOME: ${{ steps.publish_pypi.outcome }}
          OBSERVER_OUTCOME: ${{ steps.observe_pypi.outcome }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          node --input-type=module - "$OUTPUT_DIR/publication.json" "$RECEIPT_DIR" "$OBSERVER_FILE" <<'NODE'
