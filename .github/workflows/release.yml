          const snapshot = JSON.parse(readFileSync(process.env.SNAPSHOT_BINDING_FILE, 'utf8')); const receiptArtifacts = JSON.parse(readFileSync(process.env.RECEIPT_ARTIFACTS_FILE, 'utf8'))
          const descriptor = { repository: plan.repository, repositoryId: plan.repositoryId, releaseTag: plan.tags.release, title: plan.githubRelease.title, bodySha256: plan.githubRelease.bodySha256, sourceCommit: plan.sourceCommit, assets: files, prerelease: false, latest: plan.githubRelease.latest === true, requirePublic: true, snapshot: { mode: 'current', snapshot, receiptArtifacts } }
          writeFileSync(descriptorFile, JSON.stringify(descriptor) + '\n')
          NODE
      - name: Reconcile draft, verify every existing asset, and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
