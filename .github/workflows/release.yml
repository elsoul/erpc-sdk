      - name: Upload authenticated bundle for protected publishers
        id: verified_handoff
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-set-verified-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-set-verified
          if-no-files-found: error
          retention-days: 7

  release-set-finalize-auto:
    name: Automatically finalize schema2 release
    needs:
      - release-set-publish
      - release-set-publish-npm
      - release-set-publish-pypi
      - release-set-publish-rubygems
    if: ${{ inputs.recovery_mode == 'disabled' && inputs.release_set_mode == 'publish' && needs.release-set-publish.result == 'success' && needs.release-set-publish-npm.result == 'success' && needs.release-set-publish-pypi.result == 'success' && needs.release-set-publish-rubygems.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
