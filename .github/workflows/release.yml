          release_values="$(node --input-type=module - "$PLAN_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'
          const plan = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          console.log(plan.tags.release); console.log(plan.githubRelease.title); console.log(plan.githubRelease.latest === true ? 'true' : 'false')
          NODE
          )"
          tag="$(printf '%s\n' "$release_values" | sed -n '1p')"
          title="$(printf '%s\n' "$release_values" | sed -n '2p')"
          latest="$(printf '%s\n' "$release_values" | sed -n '3p')"
