  publication-recovery-pypi-preflight:
    name: Credential-free PyPI recovery preflight
    needs:
      - publication-recovery-control
      - publication-recovery-readonly
    if: ${{ needs.publication-recovery-control.result == 'success' && needs.publication-recovery-readonly.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out C without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download recovery context and read-only proofs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.publication-recovery-control.outputs.context_artifact_id }}
          path: ${{ runner.temp }}/recovery
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: publication-recovery-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-readonly
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
      - name: Install credential-free preflight verifier
        env:
          VENV: ${{ runner.temp }}/recovery-preflight-venv
        run: |
          set -euo pipefail
          python -m venv --clear "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check --no-input pypi-attestations==0.0.30 sigstore==4.5.1 cryptography==50.0.2
          "$VENV/bin/python" -m pip check
          "$VENV/bin/python" - <<'PY'
          import importlib.metadata, importlib.util, pathlib, site, sys
          from cryptography import x509
          from pypi_attestations import Distribution, GitHubPublisher, Provenance
          assert pathlib.Path(sys.prefix).resolve() != pathlib.Path(sys.base_prefix).resolve()
          assert site.ENABLE_USER_SITE is False
          assert all(pathlib.Path(path).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()) for path in site.getsitepackages())
          assert importlib.util.find_spec('OpenSSL') is None
          try: importlib.metadata.version('pyOpenSSL'); raise AssertionError('pyOpenSSL distribution is installed')
          except importlib.metadata.PackageNotFoundError: pass
          PY
      - name: Fetch PyPI metadata before entering the protected environment
        env:
          CONTEXT: ${{ runner.temp }}/recovery/recovery-context.json
          RESPONSE: ${{ runner.temp }}/recovery-pypi-preflight-response.json
          INPUT: ${{ runner.temp }}/recovery-pypi-preflight.json
          SOURCE_M: ${{ env.PUBLICATION_RECOVERY_SOURCE_M }}
          CONTROL_COMMIT: ${{ inputs.expected_commit }}
          VENV: ${{ runner.temp }}/recovery-preflight-venv
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 30 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RESPONSE" --write-out '%{http_code}' https://pypi.org/pypi/erpc-sdk/0.11.0/json)"
          if [ "$status" = 200 ]; then
            "$VENV/bin/python" - "$RESPONSE" "$RUNNER_TEMP/pypi-existing-proof.json" "$SOURCE_M" "$CONTROL_COMMIT" <<'PY'
          import hashlib, json, re, sys, urllib.request
          from pypi_attestations import Distribution, GitHubPublisher, Provenance
          response, output, source, control = sys.argv[1:]; payload = json.load(open(response, encoding='utf-8')); result = {}
          for item in payload.get('urls', []):
              if item.get('filename') not in {'erpc_sdk-0.11.0-py3-none-any.whl', 'erpc_sdk-0.11.0.tar.gz'}: continue
              filename = item['filename']; digest = item.get('digests', {}).get('sha256'); provenance_url = f"https://pypi.org/integrity/erpc-sdk/0.11.0/{filename}/provenance"
              with urllib.request.urlopen(item['url'], timeout=30) as handle: archive = handle.read()
              with urllib.request.urlopen(provenance_url, timeout=30) as handle: provenance = handle.read()
              if hashlib.sha256(archive).hexdigest() != digest: raise SystemExit(f'PyPI preflight existing bytes mismatch for {filename}')
              document = Provenance.model_validate_json(provenance); matches = []
              for bundle in document.attestation_bundles:
                  for attestation in bundle.attestations:
                      statement = json.loads(attestation.envelope.statement.decode()); subject = next((s for s in statement.get('subject', []) if s.get('name') == filename and s.get('digest', {}).get('sha256') == digest), None)
                      if statement.get('predicateType') != 'https://docs.pypi.org/attestations/publish/v1' or subject is None: continue
                      attestation.verify(GitHubPublisher(repository='elsoul/erpc-sdk', workflow='release.yml', environment='pypi'), Distribution(name=filename, digest=digest)); claims = attestation.certificate_claims; claimed = claims.get('1.3.6.1.4.1.57264.1.13')
                      if claimed not in {source, control}: raise SystemExit(f'PyPI preflight existing source mismatch for {filename}')
                      invocation = claims.get('1.3.6.1.4.1.57264.1.21'); match = re.fullmatch(r'https://github\.com/elsoul/erpc-sdk/actions/runs/([1-9][0-9]*)/attempts/([1-9][0-9]*)', invocation or '')
                      if match is None: raise SystemExit(f'PyPI preflight existing invocation mismatch for {filename}')
                      matches.append({'repository':'elsoul/erpc-sdk','repositoryId':'1429568627','sourceCommit':claimed,'workflowPath':'.github/workflows/release.yml','ref':'refs/heads/main','event':'workflow_dispatch','environment':'pypi','publisherRunId':match.group(1),'publisherAttempt':match.group(2),'invocation':invocation})
              if len(matches) != 1: raise SystemExit(f'PyPI preflight existing attestation is not unique for {filename}')
              result[filename] = {'filename':filename,'sha256':digest,'yanked':item.get('yanked'),'attestationVerified':True,'publisherSourceCommit':matches[0]['sourceCommit'],'publisher':matches[0]}
          json.dump(result, open(output,'w')); open(output,'a').write('\n')
          PY
          else
            printf '{}\n' > "$RUNNER_TEMP/pypi-existing-proof.json"
          fi
          node --input-type=module - "$status" "$RESPONSE" "$RUNNER_TEMP/recovery-readonly/npm-proof.json" "$RUNNER_TEMP/recovery-readonly/rubygems-proof.json" "$RUNNER_TEMP/recovery-readonly/rust-proof.json" "$INPUT" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [status, responseFile, npmFile, rubyFile, rustFile, output] = process.argv.slice(2); const state = status === '404' ? 'absent' : status === '200' ? 'match' : 'unknown'; const payload = status === '200' ? JSON.parse(readFileSync(responseFile, 'utf8')) : {}; const verified = status === '200' ? JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/pypi-existing-proof.json', 'utf8')) : {}; const expected = new Set(['erpc_sdk-0.11.0-py3-none-any.whl', 'erpc_sdk-0.11.0.tar.gz']); const visible = new Set((payload.urls ?? []).map(item => item.filename)); const missing = [...expected].filter(name => !visible.has(name)); const existing = (payload.urls ?? []).filter(item => expected.has(item.filename)).map(item => { const proof = verified[item.filename]; if (proof === undefined) throw new Error(`PyPI preflight existing proof is missing for ${item.filename}`); return proof }); if (status !== '404' && status !== '200') throw new Error(`PyPI preflight HTTP ${status}`); if (status === '200' && (payload.info?.name !== 'erpc-sdk' || payload.info?.version !== '0.11.0')) throw new Error('PyPI preflight identity conflict'); writeFileSync(output, `${JSON.stringify({ npm: JSON.parse(readFileSync(npmFile, 'utf8')), rubygems: JSON.parse(readFileSync(rubyFile, 'utf8')), rust: JSON.parse(readFileSync(rustFile, 'utf8')), pypi: { state: missing.length === 2 ? 'absent' : missing.length === 0 ? 'match' : 'partial', status: Number(status), absenceGate: status === '404', missing, existing } })}\n`)
          NODE
          export PUBLICATION_RECOVERY_CONTEXT_FILE="$CONTEXT" PUBLICATION_RECOVERY_PREFLIGHT_INPUT_FILE="$INPUT" PUBLICATION_RECOVERY_PREFLIGHT_OUTPUT_FILE="$RUNNER_TEMP/recovery-pypi-preflight-checked.json"
          node scripts/verify-release.mjs --publication-recovery-preflight
      - name: Upload credential-free preflight evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: publication-recovery-pypi-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-pypi-preflight-checked.json
          if-no-files-found: error
          retention-days: 365

  publication-recovery-pypi:
    name: Publish or reuse only the missing PyPI recovery files
    needs:
      - publication-recovery-control
      - publication-recovery-readonly
      - publication-recovery-pypi-preflight
