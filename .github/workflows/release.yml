          const certificateClaims = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-certificate-claims.json`, 'utf8'))
          const observedSha256 = createHash('sha256').update(readFileSync(archiveFile)).digest('hex')
          const state = process.env.NPM_STATE === 'absent' ? 'published' : 'reused'
          writeFileSync(outputFile, `${JSON.stringify({ schemaVersion: 1, registry: 'npmjs.org', repository: process.env.EXPECTED_REPOSITORY, identity: metadata.name, version: metadata.version, state, tarball: metadata.dist.tarball, integrity: metadata.dist.integrity, provenance, certificateClaims, expectedSha256: process.env.NPM_SHA256, observedSha256, sourceCommit: process.env.FOUNDATION_SOURCE_SHA, planSha256: process.env.FOUNDATION_PLAN_SHA256, preparedRunId: process.env.FOUNDATION_PREPARED_RUN_ID, preparedRunAttempt: process.env.FOUNDATION_PREPARED_RUN_ATTEMPT, preparedArtifactId: process.env.FOUNDATION_PREPARED_ARTIFACT_ID, observerRunId: process.env.GITHUB_RUN_ID, observerAttempt: process.env.GITHUB_RUN_ATTEMPT, observedAt: new Date().toISOString(), auth: { requested: state === 'published', uploadAttempted: state === 'published', uploadOutcome: process.env.NPM_UPLOAD_OUTCOME || 'not-requested', publicProvenanceObserved: true } })}\n`)
          NODE
      - name: Clean npm credential workspace
        if: always()
        run: |
