        if: always()
        run: printf 'release_set_pypi_receipt_artifact_id=%s\n' '${{ steps.pypi_receipt_artifact.outputs.artifact-id }}' >> "$GITHUB_STEP_SUMMARY"

  release-set-publish-rubygems:
    name: Publish or reuse schema2 RubyGems artifact
    needs: release-set-publish
    if: ${{ inputs.recovery_mode == 'disabled' && inputs.release_set_mode == 'publish' && needs.release-set-publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      receipt_artifact_id: ${{ steps.rubygems_receipt_artifact.outputs.artifact-id }}
      publication_artifact_id: ${{ steps.rubygems_publication_artifact.outputs.artifact-id }}
    environment: rubygems
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-set-verified-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-set-verified
      - name: Install Ruby 3.1 observer runtime
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
      - name: Capture Ruby 3.1 path
        run: echo "RUBY31=$(command -v ruby)" >> "$GITHUB_ENV"
      - name: Install Ruby 3.4 observer runtime
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: false
      - name: Capture Ruby 3.4 path
        run: echo "RUBY34=$(command -v ruby)" >> "$GITHUB_ENV"
      - name: Recheck exact RubyGems target and local upload bytes
        id: preflight
        env:
          PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          BUNDLE_DIR: ${{ runner.temp }}/release-set-verified/bundle
          RELEASE_USER_AGENT: erpc-sdk-release-verification (https://github.com/elsoul/erpc-sdk)
        run: |
          set -euo pipefail
          version="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("versions").fetch("nonRustVersion")' "$PLAN_FILE")"
          gem_file="$(node --input-type=module - "$PLAN_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync(process.argv[2], 'utf8')).artifacts.find(item => item.kind === 'rubygems').filename)
          NODE
          )"
          expected="$(node --input-type=module - "$PLAN_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync(process.argv[2], 'utf8')).artifacts.find(item => item.kind === 'rubygems').sha256)
          NODE
          )"
          status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RUNNER_TEMP/rubygems-release-set.json" --write-out '%{http_code}' "https://rubygems.org/api/v2/rubygems/erpc-sdk/versions/$version.json")"
          status_recheck="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output /dev/null --write-out '%{http_code}' "https://rubygems.org/api/v2/rubygems/erpc-sdk/versions/$version.json")"
          if [ "$status" = 404 ]; then test "$status_recheck" = 404; state=absent; elif [ "$status" = 200 ]; then state=match; test "$(node --input-type=module - "$RUNNER_TEMP/rubygems-release-set.json" <<'NODE'
          import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync(process.argv[2], 'utf8')).sha)
          NODE
          )" = "$expected"; else echo "RubyGems preflight stopped in HTTP $status" >&2; exit 64; fi
          test "$(sha256sum "$BUNDLE_DIR/$gem_file" | awk '{print $1}')" = "$expected"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "$state" > "$RUNNER_TEMP/rubygems-release-set-state"
      - name: Configure the existing RubyGems trusted publisher
        if: steps.preflight.outputs.state == 'absent'
        id: rubygems_auth
        continue-on-error: true
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        with:
          trusted-publisher: true
      - name: Publish the exact reviewed gem once
        if: steps.rubygems_auth.outcome == 'success' && steps.preflight.outputs.state == 'absent'
        id: publish_gem
        continue-on-error: true
        env:
          PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          BUNDLE_DIR: ${{ runner.temp }}/release-set-verified/bundle
        run: |
          set -euo pipefail
          gem_file="$(node --input-type=module - "$PLAN_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'
          console.log(JSON.parse(readFileSync(process.argv[2], 'utf8')).artifacts.find(item => item.kind === 'rubygems').filename)
          NODE
          )"
          gem push "$BUNDLE_DIR/$gem_file"
      - name: Clean RubyGems credentials before observer consumers
        if: always()
        id: rubygems_cleanup
        run: |
          set -euo pipefail
          credential_seen=false
          if [ -n "${GEM_HOST_API_KEY:-}" ] || [ -n "${RUBYGEMS_API_KEY:-}" ] || [ -f "$HOME/.gem/credentials" ] || [ -f "$HOME/.config/gem/credentials" ]; then credential_seen=true; fi
          printf '%s\n' "$credential_seen" > "$RUNNER_TEMP/rubygems-credential-seen"
          rm -f "$HOME/.gem/credentials" "$HOME/.config/gem/credentials"
          unset GEM_HOST_API_KEY RUBYGEMS_API_KEY RUBYGEMS_HOST_API_KEY
      - name: Observe RubyGems bytes and isolated Ruby consumers
        if: always() && (steps.preflight.outputs.state == 'absent' || steps.preflight.outputs.state == 'match')
        id: observe_rubygems
        env:
          RELEASE_SET_PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          RELEASE_SET_PLAN_SHA256: ${{ inputs.release_set_plan_sha256 }}
          RELEASE_SET_BINDING_FILE: ${{ runner.temp }}/release-set-verified/binding/release-set-binding.json
          RELEASE_SET_ARTIFACT_DIR: ${{ runner.temp }}/release-set-verified/bundle
          RELEASE_SET_BINDING_DIR: ${{ runner.temp }}/release-set-verified/binding
          RELEASE_SET_RUN_FILE: ${{ runner.temp }}/release-set-verified/evidence/run.json
          RELEASE_SET_ARTIFACT_METADATA_FILE: ${{ runner.temp }}/release-set-verified/evidence/bundle-metadata.json
          RELEASE_SET_BINDING_METADATA_FILE: ${{ runner.temp }}/release-set-verified/evidence/binding-metadata.json
          RELEASE_SET_BUNDLE_ZIP_FILE: ${{ runner.temp }}/release-set-verified/zips/bundle.zip
          RELEASE_SET_BINDING_ZIP_FILE: ${{ runner.temp }}/release-set-verified/zips/binding.zip
          RELEASE_SET_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          RELEASE_SET_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          RELEASE_SET_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          RELEASE_SET_PREPARED_BINDING_ARTIFACT_ID: ${{ inputs.prepared_binding_artifact_id }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CHECKOUT_HEAD: ${{ inputs.expected_commit }}
          CHECKOUT_STATUS: ''
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_SET_RUBYGEMS_OBSERVER_RUN_ID: ${{ github.run_id }}
          RELEASE_SET_RUBYGEMS_OBSERVER_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_SET_RUBYGEMS_OBSERVER_WORKFLOW: .github/workflows/release.yml
          RELEASE_SET_RUBYGEMS_OBSERVER_SOURCE: ${{ inputs.expected_commit }}
          RELEASE_SET_RUBYGEMS_OUTPUT_FILE: ${{ runner.temp }}/rubygems-proof.json
          RELEASE_SET_RUBYGEMS_WORK_DIR: ${{ runner.temp }}/rubygems-observer
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_SET_RUBYGEMS_WORK_DIR"
          RELEASE_SET_RUBYGEMS_RUBY31="$RUBY31" RELEASE_SET_RUBYGEMS_RUBY34="$RUBY34" node scripts/verify-release.mjs --release-set-rubygems-observe
      - name: Record RubyGems publication outcome and cleanup status
        if: always()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/release-set-rubygems-publication
          RECEIPT_DIR: ${{ runner.temp }}/release-set-rubygems-receipt
          OBSERVER_FILE: ${{ runner.temp }}/rubygems-proof.json
          AUTH_OUTCOME: ${{ steps.rubygems_auth.outcome }}
          CLEANUP_OUTCOME: ${{ steps.rubygems_cleanup.outcome }}
          PREFLIGHT_STATE: ${{ steps.preflight.outputs.state }}
          UPLOAD_OUTCOME: ${{ steps.publish_gem.outcome }}
          OBSERVER_OUTCOME: ${{ steps.observe_rubygems.outcome }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          credential_seen="$(cat "$RUNNER_TEMP/rubygems-credential-seen" 2>/dev/null || printf false)"
          export CREDENTIAL_SEEN="$credential_seen"
          node --input-type=module - "$OUTPUT_DIR/publication.json" "$RECEIPT_DIR" "$OBSERVER_FILE" <<'NODE'
          import { copyFileSync, existsSync, mkdirSync, writeFileSync } from 'node:fs'
          const [output, receiptDirectory, observer] = process.argv.slice(2); const attempted = Boolean(process.env.UPLOAD_OUTCOME && process.env.UPLOAD_OUTCOME !== 'skipped'); const observed = process.env.OBSERVER_OUTCOME === 'success' && existsSync(observer)
          const cleanupOk = process.env.CLEANUP_OUTCOME === 'success'; writeFileSync(output, `${JSON.stringify({ schemaVersion: 1, kind: 'rubygems-public-publication-outcome', preflightState: process.env.PREFLIGHT_STATE, auth: { requested: Boolean(process.env.AUTH_OUTCOME && process.env.AUTH_OUTCOME !== 'skipped'), uploadAttempted: attempted, uploadOutcome: process.env.UPLOAD_OUTCOME || 'not-requested', credentialObserved: process.env.CREDENTIAL_SEEN === 'true' }, cleanup: { envCleared: cleanupOk, filesCleared: cleanupOk }, observer: { outcome: process.env.OBSERVER_OUTCOME || 'skipped', receiptPresent: observed }, sourceCommit: process.env.EXPECTED_COMMIT, observedRunId: process.env.GITHUB_RUN_ID, observedAttempt: process.env.GITHUB_RUN_ATTEMPT } )}\n`)
          if (observed) { mkdirSync(receiptDirectory, { recursive: true }); copyFileSync(observer, `${receiptDirectory}/rubygems-proof.json`) }
          NODE
      - name: Upload RubyGems publication outcome
        if: always()
        id: rubygems_publication_artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-set-rubygems-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-set-rubygems-publication
          if-no-files-found: error
          retention-days: 365
      - name: Upload successful RubyGems receipt
        if: steps.observe_rubygems.outcome == 'success'
        id: rubygems_receipt_artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-set-rubygems-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-set-rubygems-receipt/rubygems-proof.json
          if-no-files-found: error
          retention-days: 365
      - name: Retain RubyGems receipt artifact allocation
        if: always()
        run: printf 'release_set_rubygems_receipt_artifact_id=%s\n' '${{ steps.rubygems_receipt_artifact.outputs.artifact-id }}' >> "$GITHUB_STEP_SUMMARY"

  # Finite one-cohort recovery.  This lane is structurally isolated from both
  # the historical foundation path and schema2 normal publish.  M is the
  # immutable package/preparation source; the live controller C is checked at
  # every boundary and is never substituted into package/tag provenance.
  publication-recovery-control:
    name: Authenticate frozen M and recovery controller C
    if: ${{ inputs.recovery_mode == 'recover-0.11.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      context_artifact_id: ${{ steps.context_upload.outputs.artifact-id }}
    steps:
      - name: Check out the live controller C without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Guard C, main, M ancestry, and the four-file delta
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_COMMIT: ${{ inputs.expected_commit }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_M: ${{ env.PUBLICATION_RECOVERY_SOURCE_M }}
          RECOVERY_MODE: ${{ inputs.recovery_mode }}
          FOUNDATION_MODE: ${{ inputs.mode }}
          RELEASE_SET_MODE: ${{ inputs.release_set_mode }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$REPOSITORY_ID" = "$EXPECTED_REPOSITORY_ID"
          test "$EVENT_NAME" = workflow_dispatch
          test "$EVENT_REF" = refs/heads/main
          test "$RECOVERY_MODE" = recover-0.11.0
          test "$FOUNDATION_MODE" = publish
          test "$RELEASE_SET_MODE" = disabled
          test "$EXPECTED_VERSION" = 0.11.0
          test "$CONTROL_COMMIT" = "$EVENT_SHA"
          test "$CONTROL_COMMIT" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$CONTROL_COMMIT"
          test -z "$(git status --porcelain)"
          git cat-file -e "$SOURCE_M^{commit}"
          git merge-base --is-ancestor "$SOURCE_M" "$CONTROL_COMMIT"
          test "$(gh api "/repos/$EXPECTED_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CONTROL_COMMIT"
          expected=$'.github/workflows/release.yml\ndocs/RELEASING.md\nscripts/verify-release.mjs\nscripts/verify-release.test.mjs'
          actual="$(git diff --name-only "$SOURCE_M" "$CONTROL_COMMIT" | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          cat > "$RUNNER_TEMP/recovery-runtime.json" <<JSON
          {"mode":"recover-0.11.0","repository":"$REPOSITORY","repositoryId":"$REPOSITORY_ID","eventName":"$EVENT_NAME","eventRef":"$EVENT_REF","eventSha":"$EVENT_SHA","expectedControlCommit":"$CONTROL_COMMIT","checkoutHead":"$(git rev-parse HEAD)","checkoutStatus":"","workflowRef":"$WORKFLOW_REF","workflowSha":"$WORKFLOW_SHA","mainSha":"$CONTROL_COMMIT","sourceM":"$SOURCE_M","sourceMAncestor":true,"deltaPaths":[".github/workflows/release.yml","docs/RELEASING.md","scripts/verify-release.mjs","scripts/verify-release.test.mjs"]}
          JSON
      - name: Fetch actual C CI proof and original run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_M: ${{ env.PUBLICATION_RECOVERY_SOURCE_M }}
          PLAN: ${{ runner.temp }}/recovery/recovery-bundle/release-set-plan.json
          CONTROL_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          gh api "/repos/$EXPECTED_REPOSITORY/actions/workflows/ci.yml" > "$RUNNER_TEMP/recovery-ci-workflow.json"
          ci_workflow_id="$(jq -r '.id' "$RUNNER_TEMP/recovery-ci-workflow.json")"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/workflows/$ci_workflow_id/runs?branch=main&head_sha=$CONTROL_COMMIT&per_page=100" > "$RUNNER_TEMP/recovery-ci-runs.json"
          RELEASE_SET_CI_WORKFLOW_FILE="$RUNNER_TEMP/recovery-ci-workflow.json" RELEASE_SET_CI_RUNS_FILE="$RUNNER_TEMP/recovery-ci-runs.json" RELEASE_SET_CI_SELECTION_FILE="$RUNNER_TEMP/recovery-ci-selection.json" EXPECTED_COMMIT="$CONTROL_COMMIT" node scripts/verify-release.mjs --release-set-ci-select
          ci_run_id="$(jq -r '.id' "$RUNNER_TEMP/recovery-ci-selection.json")"
          ci_attempt="$(jq -r '.runAttempt' "$RUNNER_TEMP/recovery-ci-selection.json")"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$ci_run_id/attempts/$ci_attempt" > "$RUNNER_TEMP/recovery-ci-recheck.json"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$ci_run_id/attempts/$ci_attempt/jobs?per_page=100" > "$RUNNER_TEMP/recovery-ci-jobs.json"
          RELEASE_SET_CI_WORKFLOW_FILE="$RUNNER_TEMP/recovery-ci-workflow.json" RELEASE_SET_CI_RUNS_FILE="$RUNNER_TEMP/recovery-ci-runs.json" RELEASE_SET_CI_SELECTION_FILE="$RUNNER_TEMP/recovery-ci-selection.json" RELEASE_SET_CI_RECHECK_FILE="$RUNNER_TEMP/recovery-ci-recheck.json" RELEASE_SET_CI_JOBS_FILE="$RUNNER_TEMP/recovery-ci-jobs.json" RELEASE_SET_CI_EVIDENCE_FILE="$RUNNER_TEMP/recovery-ci-evidence.json" EXPECTED_COMMIT="$CONTROL_COMMIT" node scripts/verify-release.mjs --release-set-ci-proof
          gh api "/repos/$EXPECTED_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$SOURCE_M&per_page=100" > "$RUNNER_TEMP/recovery-source-ci-runs.json"
          RELEASE_SET_CI_WORKFLOW_FILE="$RUNNER_TEMP/recovery-ci-workflow.json" RELEASE_SET_CI_RUNS_FILE="$RUNNER_TEMP/recovery-source-ci-runs.json" RELEASE_SET_CI_SELECTION_FILE="$RUNNER_TEMP/recovery-source-ci-selection.json" EXPECTED_COMMIT="$SOURCE_M" node scripts/verify-release.mjs --release-set-ci-select
          source_ci_run_id="$(jq -r '.id' "$RUNNER_TEMP/recovery-source-ci-selection.json")"
          source_ci_attempt="$(jq -r '.runAttempt' "$RUNNER_TEMP/recovery-source-ci-selection.json")"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$source_ci_run_id/attempts/$source_ci_attempt" > "$RUNNER_TEMP/recovery-source-ci-recheck.json"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$source_ci_run_id/attempts/$source_ci_attempt/jobs?per_page=100" > "$RUNNER_TEMP/recovery-source-ci-jobs.json"
          RELEASE_SET_CI_WORKFLOW_FILE="$RUNNER_TEMP/recovery-ci-workflow.json" RELEASE_SET_CI_RUNS_FILE="$RUNNER_TEMP/recovery-source-ci-runs.json" RELEASE_SET_CI_SELECTION_FILE="$RUNNER_TEMP/recovery-source-ci-selection.json" RELEASE_SET_CI_RECHECK_FILE="$RUNNER_TEMP/recovery-source-ci-recheck.json" RELEASE_SET_CI_JOBS_FILE="$RUNNER_TEMP/recovery-source-ci-jobs.json" RELEASE_SET_CI_EVIDENCE_FILE="$RUNNER_TEMP/recovery-source-ci-evidence.json" EXPECTED_COMMIT="$SOURCE_M" node scripts/verify-release.mjs --release-set-ci-proof
          gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$PUBLICATION_RECOVERY_ORIGINAL_PUBLICATION_RUN_ID" > "$RUNNER_TEMP/recovery-publication-run.json"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$PUBLICATION_RECOVERY_ORIGINAL_PUBLICATION_RUN_ID/attempts/$PUBLICATION_RECOVERY_ORIGINAL_PUBLICATION_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/recovery-publication-jobs.json"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/jobs/$PUBLICATION_RECOVERY_ORIGINAL_NPM_JOB_ID" > "$RUNNER_TEMP/recovery-original-npm-job.json"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/jobs/$PUBLICATION_RECOVERY_ORIGINAL_PYPI_JOB_ID" > "$RUNNER_TEMP/recovery-original-pypi-job.json"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/jobs/$PUBLICATION_RECOVERY_ORIGINAL_RUBYGEMS_JOB_ID" > "$RUNNER_TEMP/recovery-original-rubygems-job.json"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$PUBLICATION_RECOVERY_PREPARED_RUN_ID" > "$RUNNER_TEMP/recovery-preparation-run.json"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/artifacts/$PUBLICATION_RECOVERY_BUNDLE_ARTIFACT_ID" > "$RUNNER_TEMP/recovery-bundle-metadata.json"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/artifacts/$PUBLICATION_RECOVERY_BINDING_ARTIFACT_ID" > "$RUNNER_TEMP/recovery-binding-metadata.json"
          node --input-type=module - "$RUNNER_TEMP/recovery-publication-jobs.json" "$RUNNER_TEMP/recovery-original-npm-job.json" "$RUNNER_TEMP/recovery-original-pypi-job.json" "$RUNNER_TEMP/recovery-original-rubygems-job.json" "$RUNNER_TEMP/recovery-publication-outcomes.json" "$RUNNER_TEMP/recovery-publication-jobs.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const jobs = JSON.parse(readFileSync(process.argv[2], 'utf8')).jobs ?? []; const npm = JSON.parse(readFileSync(process.argv[3], 'utf8')); const pypi = JSON.parse(readFileSync(process.argv[4], 'utf8')); const ruby = JSON.parse(readFileSync(process.argv[5], 'utf8'))
          const authoritative = [npm, pypi, ruby]; const byId = new Map(jobs.map(job => [String(job.id), job])); for (const job of authoritative) byId.set(String(job.id), job)
          const jobOutcomes = [...byId.values()]
          const step = (value, needle) => value?.steps?.filter(item => `${item.name ?? ''}`.toLowerCase().includes(needle))?.map(item => item.conclusion)
          if (!Array.isArray(npm.steps) || !Array.isArray(pypi.steps) || !Array.isArray(ruby.steps)) throw new Error('original publication individual job step evidence is missing')
          const npmUpload = step(npm, 'publish exact npm archive once'); const npmObserver = step(npm, 'observe npm public bytes')
          const rubyUpload = step(ruby, 'publish the exact reviewed gem once'); const pypiUpload = step(pypi, 'publish exact missing pypi files'); const pypiObserver = step(pypi, 'observe pypi files')
          if (npmUpload.length !== 1 || npmObserver.length !== 1 || rubyUpload.length !== 1 || pypiUpload.length !== 1 || pypiObserver.length !== 1) throw new Error('original publication step evidence is missing or ambiguous')
          const outcomes = { npmPublished: npmUpload[0] === 'success', rubygemsPublished: rubyUpload[0] === 'success', pypiUploadAttempted: pypiUpload[0] !== 'skipped', pypiBeforeUploadFailure: pypiUpload[0] === 'skipped' && pypiObserver[0] === 'failure', npmObserverFailure: npmObserver[0] === 'failure', npmJobConclusion: npm?.conclusion, npmUploadStepConclusion: npmUpload[0], npmObserverStepConclusion: npmObserver[0], rubygemsJobConclusion: ruby?.conclusion, rubygemsUploadStepConclusion: rubyUpload[0], pypiJobConclusion: pypi?.conclusion, pypiUploadStepConclusion: pypiUpload[0], pypiObserverStepConclusion: pypiObserver[0] }
          writeFileSync(process.argv[6], `${JSON.stringify(outcomes)}\n`)
          writeFileSync(process.argv[7], `${JSON.stringify(jobOutcomes)}\n`)
          NODE
      - name: Download the exact original preparation bundle and binding
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ env.PUBLICATION_RECOVERY_BUNDLE_ARTIFACT_ID }}
          run-id: ${{ env.PUBLICATION_RECOVERY_PREPARED_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/recovery-bundle
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ env.PUBLICATION_RECOVERY_BINDING_ARTIFACT_ID }}
          run-id: ${{ env.PUBLICATION_RECOVERY_PREPARED_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/recovery-binding
      - name: Reauthenticate original bundle ZIP bytes and consumed members
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ runner.temp }}/recovery-bundle
          BINDING: ${{ runner.temp }}/recovery-binding
          BUNDLE_META: ${{ runner.temp }}/recovery-bundle-metadata.json
          BINDING_META: ${{ runner.temp }}/recovery-binding-metadata.json
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 60 --retry 0 --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --user-agent "$RELEASE_USER_AGENT" --output "$RUNNER_TEMP/recovery-bundle.zip" "https://api.github.com/repos/$EXPECTED_REPOSITORY/actions/artifacts/$PUBLICATION_RECOVERY_BUNDLE_ARTIFACT_ID/zip"
          curl --fail --silent --show-error --location --max-time 60 --retry 0 --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --user-agent "$RELEASE_USER_AGENT" --output "$RUNNER_TEMP/recovery-binding.zip" "https://api.github.com/repos/$EXPECTED_REPOSITORY/actions/artifacts/$PUBLICATION_RECOVERY_BINDING_ARTIFACT_ID/zip"
          test "$(sha256sum "$RUNNER_TEMP/recovery-bundle.zip" | awk '{print $1}')" = 01ba51df046f11323197d013ae79f28b7eaa3949287c356036e0243eca38e0bb
          test "$(sha256sum "$RUNNER_TEMP/recovery-binding.zip" | awk '{print $1}')" = 4ea1f1b78ac8f7df2711953ac7c2415155affc8c1cd9b864554b4bb11a2566b9
          node --input-type=module - "$RUNNER_TEMP/recovery-bundle.zip" "$BUNDLE_META" "$BUNDLE" "$RUNNER_TEMP/recovery-binding.zip" "$BINDING_META" "$BINDING" <<'NODE'
          import { readFileSync } from 'node:fs'; import { verifyReleaseSetArtifactZip } from './scripts/verify-release.mjs'
          const [bundleZip, bundleMeta, bundleDir, bindingZip, bindingMeta, bindingDir] = process.argv.slice(2)
          await verifyReleaseSetArtifactZip({ zipFile: bundleZip, metadata: JSON.parse(readFileSync(bundleMeta, 'utf8')), expectedId: process.env.PUBLICATION_RECOVERY_BUNDLE_ARTIFACT_ID, consumedDirectory: bundleDir, expectedName: `release-set-bundle-${process.env.PUBLICATION_RECOVERY_SOURCE_M}` })
          await verifyReleaseSetArtifactZip({ zipFile: bindingZip, metadata: JSON.parse(readFileSync(bindingMeta, 'utf8')), expectedId: process.env.PUBLICATION_RECOVERY_BINDING_ARTIFACT_ID, consumedDirectory: bindingDir, expectedName: `release-set-binding-${process.env.PUBLICATION_RECOVERY_PREPARED_RUN_ID}-${process.env.PUBLICATION_RECOVERY_PREPARED_RUN_ATTEMPT}` })
          NODE
      - name: Authenticate the original preparation and bind immutable context
        env:
          PUBLICATION_RECOVERY_RUNTIME_FILE: ${{ runner.temp }}/recovery-runtime.json
          PUBLICATION_RECOVERY_PREPARATION_FILE: ${{ runner.temp }}/recovery-preparation.json
          PUBLICATION_RECOVERY_PUBLICATION_RUN_FILE: ${{ runner.temp }}/recovery-publication-run.json
          PUBLICATION_RECOVERY_PUBLICATION_JOBS_FILE: ${{ runner.temp }}/recovery-publication-jobs.json
          PUBLICATION_RECOVERY_PUBLICATION_OUTCOMES_FILE: ${{ runner.temp }}/recovery-publication-outcomes.json
          PUBLICATION_RECOVERY_CI_PROOF_FILE: ${{ runner.temp }}/recovery-ci-proof-flat.json
          PUBLICATION_RECOVERY_SOURCE_CI_PROOF_FILE: ${{ runner.temp }}/recovery-source-ci-proof-flat.json
          PUBLICATION_RECOVERY_CONTEXT_OUTPUT_FILE: ${{ runner.temp }}/recovery-context.json
          PUBLICATION_RECOVERY_CONTEXT_FILE: ${{ runner.temp }}/recovery-context.json
          PUBLICATION_RECOVERY_PLAN_FILE: ${{ runner.temp }}/recovery-bundle/release-set-plan.json
          PUBLICATION_RECOVERY_ARTIFACT_DIR: ${{ runner.temp }}/recovery-bundle
          PUBLICATION_RECOVERY_BINDING_FILE: ${{ runner.temp }}/recovery-binding/release-set-binding.json
          PUBLICATION_RECOVERY_BINDING_DIR: ${{ runner.temp }}/recovery-binding
          PUBLICATION_RECOVERY_BUNDLE_ZIP_FILE: ${{ runner.temp }}/recovery-bundle.zip
          PUBLICATION_RECOVERY_BINDING_ZIP_FILE: ${{ runner.temp }}/recovery-binding.zip
          PUBLICATION_RECOVERY_BUNDLE_METADATA_FILE: ${{ runner.temp }}/recovery-bundle-metadata.json
          PUBLICATION_RECOVERY_BINDING_METADATA_FILE: ${{ runner.temp }}/recovery-binding-metadata.json
          PUBLICATION_RECOVERY_BINDING_ARTIFACT_ID: ${{ env.PUBLICATION_RECOVERY_BINDING_ARTIFACT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/recovery-preparation-run.json" "$RUNNER_TEMP/recovery-bundle-metadata.json" "$RUNNER_TEMP/recovery-binding-metadata.json" "$RUNNER_TEMP/recovery-bundle/release-set-plan.json" "$RUNNER_TEMP/recovery-binding/release-set-binding.json" "$RUNNER_TEMP/recovery-preparation.json" "$RUNNER_TEMP/recovery-source-ci-evidence.json" "$RUNNER_TEMP/recovery-ci-evidence.json" "$RUNNER_TEMP/recovery-source-ci-proof-flat.json" "$RUNNER_TEMP/recovery-ci-proof-flat.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { validateReleaseSetPlan, validateReleaseSetCIEvidence, validateReleaseSetPreparationMetadata, validateReleaseSetPreparationBinding, PUBLICATION_RECOVERY_SOURCE_M, PUBLICATION_RECOVERY_PLAN_SHA256, PUBLICATION_RECOVERY_PREPARED_RUN_ID, PUBLICATION_RECOVERY_PREPARED_RUN_ATTEMPT, PUBLICATION_RECOVERY_BUNDLE_ARTIFACT_ID, PUBLICATION_RECOVERY_BINDING_ARTIFACT_ID } from './scripts/verify-release.mjs'
          const [runFile, artifactFile, bindingArtifactFile, planFile, bindingFile, outputFile, sourceCiFile, ciRawFile, sourceCiFlatFile, ciFlatFile] = process.argv.slice(2)
          const plan = validateReleaseSetPlan(JSON.parse(readFileSync(planFile, 'utf8')))
          if (plan.sourceCommit !== PUBLICATION_RECOVERY_SOURCE_M || JSON.stringify(plan) === '{}') throw new Error('recovery plan source is not M')
          const sourceCi = validateReleaseSetCIEvidence(JSON.parse(readFileSync(sourceCiFile, 'utf8')), PUBLICATION_RECOVERY_SOURCE_M)
          const controlCi = validateReleaseSetCIEvidence(JSON.parse(readFileSync(ciRawFile, 'utf8')), process.env.GITHUB_SHA)
          if (plan.ciProof.runId !== sourceCi.runId || plan.ciProof.runAttempt !== sourceCi.runAttempt || plan.ciProof.jobId !== sourceCi.jobId) throw new Error('recovery plan/source-CI proof mismatch')
          writeFileSync(sourceCiFlatFile, `${JSON.stringify(sourceCi)}\n`)
          writeFileSync(ciFlatFile, `${JSON.stringify(controlCi)}\n`)
          validateReleaseSetPreparationMetadata({ plan, run: JSON.parse(readFileSync(runFile, 'utf8')), artifact: JSON.parse(readFileSync(artifactFile, 'utf8')), bindingArtifact: JSON.parse(readFileSync(bindingArtifactFile, 'utf8')), expected: { runId: PUBLICATION_RECOVERY_PREPARED_RUN_ID, runAttempt: PUBLICATION_RECOVERY_PREPARED_RUN_ATTEMPT, artifactId: PUBLICATION_RECOVERY_BUNDLE_ARTIFACT_ID, bindingArtifactId: PUBLICATION_RECOVERY_BINDING_ARTIFACT_ID, sourceCommit: PUBLICATION_RECOVERY_SOURCE_M } })
          validateReleaseSetPreparationBinding(JSON.parse(readFileSync(bindingFile, 'utf8')), { plan, expected: { runId: PUBLICATION_RECOVERY_PREPARED_RUN_ID, runAttempt: PUBLICATION_RECOVERY_PREPARED_RUN_ATTEMPT, artifactId: PUBLICATION_RECOVERY_BUNDLE_ARTIFACT_ID } })
          writeFileSync(outputFile, `${JSON.stringify({ sourceCommit: PUBLICATION_RECOVERY_SOURCE_M, runId: PUBLICATION_RECOVERY_PREPARED_RUN_ID, runAttempt: PUBLICATION_RECOVERY_PREPARED_RUN_ATTEMPT, artifactId: PUBLICATION_RECOVERY_BUNDLE_ARTIFACT_ID, bindingArtifactId: PUBLICATION_RECOVERY_BINDING_ARTIFACT_ID, planSha256: PUBLICATION_RECOVERY_PLAN_SHA256 })}\n`)
          NODE
          node scripts/verify-release.mjs --publication-recovery-context
          node scripts/verify-release.mjs --publication-recovery-context-verify
          node scripts/verify-release.mjs --publication-recovery-bundle
      - name: Upload immutable recovery context and original bundle evidence
        id: context_upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: publication-recovery-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/recovery-context.json
            ${{ runner.temp }}/recovery-preparation.json
            ${{ runner.temp }}/recovery-ci-evidence.json
            ${{ runner.temp }}/recovery-source-ci-evidence.json
            ${{ runner.temp }}/recovery-bundle
            ${{ runner.temp }}/recovery-binding
          if-no-files-found: error
          retention-days: 365

  publication-recovery-readonly:
    name: Prove npm RubyGems and Rust read-only against M
    needs: publication-recovery-control
    if: ${{ needs.publication-recovery-control.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      npm_receipt_artifact_id: ${{ steps.npm_receipt.outputs.artifact-id }}
      rubygems_receipt_artifact_id: ${{ steps.rubygems_receipt.outputs.artifact-id }}
      rust_receipt_artifact_id: ${{ steps.rust_receipt.outputs.artifact-id }}
    steps:
      - name: Check out C without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable recovery context
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.publication-recovery-control.outputs.context_artifact_id }}
          path: ${{ runner.temp }}/recovery
      - name: Install isolated patched recovery tooling
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
      - name: Resolve exact isolated Python verifier and retain evidence
        env:
          VENV: ${{ runner.temp }}/recovery-venv
          PROOF: ${{ runner.temp }}/recovery-tooling-proof.json
        run: |
          set -euo pipefail
          python -m venv --clear "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check --no-input build==1.6.0 pypi-attestations==0.0.30 sigstore==4.5.1 cryptography==50.0.2
          "$VENV/bin/python" -m pip check
          "$VENV/bin/python" - <<'PY' > "$PROOF"
          import importlib.metadata, importlib.util, json, pathlib, site, sys
          from cryptography import x509
          from pypi_attestations import Distribution, GitHubPublisher, Provenance
          import sigstore
          assert pathlib.Path(sys.prefix).resolve() != pathlib.Path(sys.base_prefix).resolve()
          assert site.ENABLE_USER_SITE is False
          assert all(pathlib.Path(path).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()) for path in site.getsitepackages())
          assert importlib.util.find_spec('OpenSSL') is None
          assert importlib.util.find_spec('pyOpenSSL') is None
          try: importlib.metadata.version('pyOpenSSL'); raise AssertionError('pyOpenSSL distribution is installed')
          except importlib.metadata.PackageNotFoundError: pass
          values = {name: importlib.metadata.version(name) for name in ('build', 'pypi-attestations', 'sigstore', 'cryptography')}
          values.update({"python": sys.version.split()[0], "prefix": sys.prefix, "base_prefix": sys.base_prefix, "origins": {name: str(pathlib.Path(importlib.import_module(name.replace('-', '_')).__file__).resolve()) for name in ('sigstore', 'pypi_attestations', 'cryptography')}})
          print(json.dumps(values, sort_keys=True))
          PY
          test "$(jq -r .python "$PROOF")" = 3.12.15
          test "$(jq -r .build "$PROOF")" = 1.6.0
          test "$(jq -r '.["pypi-attestations"]' "$PROOF")" = 0.0.30
          test "$(jq -r .sigstore "$PROOF")" = 4.5.1
          test "$(jq -r .cryptography "$PROOF")" = 50.0.2
      - name: Install pinned Node and npm observer tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
