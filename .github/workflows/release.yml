          validatePublicationRecoveryReceipt(JSON.parse(readFileSync(rubyFile, 'utf8')), { kind: 'rubygems', context, expectedSha256: PUBLICATION_RECOVERY_RUBYGEMS_SHA256 })
          validatePublicationRecoveryReceipt(JSON.parse(readFileSync(rustFile, 'utf8')), { kind: 'rust', context, expectedSha256: RUST_011_REUSE_SHA256 })
          const pypiReceipt = JSON.parse(readFileSync(pypiFile, 'utf8')); const pypiSources = Object.fromEntries(Object.entries(pypiReceipt.publishers ?? {}).map(([filename, publisher]) => [filename, publisher.sourceCommit])); validatePublicationRecoveryReceipt(pypiReceipt, { kind: 'pypi', context, pypiPublisherSources: pypiSources })
