          export PYPI_STATE="$pypi_state"
          node --input-type=module - "$PUBLISHER_FILE" "$RUNNER_TEMP/recovery-pypi-publisher-sources.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const context = JSON.parse(readFileSync(process.env.CONTEXT, 'utf8'))
          const plan = JSON.parse(readFileSync(process.env.PLAN, 'utf8'))
          const preflight = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/recovery-pypi-input.json', 'utf8')); const existing = Object.fromEntries((preflight.pypi.existing ?? []).map(item => [item.filename, item]))
          const current = { repository: 'elsoul/erpc-sdk', repositoryId: '1429568627', sourceCommit: context.controlCommit, workflowPath: '.github/workflows/release.yml', ref: 'refs/heads/main', event: 'workflow_dispatch', environment: 'pypi', publisherRunId: process.env.GITHUB_RUN_ID, publisherAttempt: process.env.GITHUB_RUN_ATTEMPT }
          const result = {}; const sources = {}; const projectPublisher = publisher => Object.fromEntries(['repository', 'repositoryId', 'sourceCommit', 'workflowPath', 'ref', 'event', 'environment', 'publisherRunId', 'publisherAttempt'].map(key => [key, publisher[key]]))
          for (const item of plan.artifacts.filter(item => item.kind.startsWith('pypi'))) { result[item.filename] = existing[item.filename]?.publisher === undefined ? current : projectPublisher(existing[item.filename].publisher); sources[item.filename] = result[item.filename].sourceCommit }
          writeFileSync(process.argv[2], `${JSON.stringify(result)}\n`); writeFileSync(process.argv[3], `${JSON.stringify(sources)}\n`)
          NODE
          export PUBLICATION_RECOVERY_CONTEXT_FILE="$CONTEXT" PUBLICATION_RECOVERY_PLAN_FILE="$PLAN" PUBLICATION_RECOVERY_PUBLISHERS_FILE="$PUBLISHER_FILE" PUBLICATION_RECOVERY_PUBLISHER_SOURCES_FILE="$RUNNER_TEMP/recovery-pypi-publisher-sources.json" PUBLICATION_RECOVERY_OBSERVER_RUN_ID="$GITHUB_RUN_ID" PUBLICATION_RECOVERY_OBSERVER_ATTEMPT="$GITHUB_RUN_ATTEMPT" PUBLICATION_RECOVERY_WORK_DIR="$WORK" PUBLICATION_RECOVERY_OUTPUT_FILE="$OUTPUT" PUBLICATION_RECOVERY_PYTHON="$VENV/bin/python"
          if [ "$PYPI_STATE" = match ]; then
            node scripts/verify-release.mjs --publication-recovery-pypi-existing-observe
          else
            node scripts/verify-release.mjs --publication-recovery-pypi-observe
          fi
          node --input-type=module - "$OUTPUT" "$CONTEXT" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [output, contextFile] = process.argv.slice(2); const receipt = JSON.parse(readFileSync(output, 'utf8')); const context = JSON.parse(readFileSync(contextFile, 'utf8'))
          const existing = process.env.PYPI_STATE === 'match'; receipt.auth = existing ? { requested: false, uploadAttempted: false, uploadOutcome: 'not-requested' } : { requested: process.env.PYPI_UPLOAD_OUTCOME !== 'skipped', uploadAttempted: process.env.PYPI_UPLOAD_OUTCOME !== 'skipped', uploadOutcome: process.env.PYPI_UPLOAD_OUTCOME ?? 'not-requested' }
          receipt.recoveryContextSha256 = context.contextSha256
