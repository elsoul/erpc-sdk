          import { readFileSync, writeFileSync } from 'node:fs'
          const [output, contextFile] = process.argv.slice(2); const receipt = JSON.parse(readFileSync(output, 'utf8')); const context = JSON.parse(readFileSync(contextFile, 'utf8')); receipt.recoveryContextSha256 = context.contextSha256; writeFileSync(output, `${JSON.stringify(receipt)}\n`)
          NODE
      - name: Build immutable tag proof and recovery manifest
        env:
          CONTEXT: ${{ runner.temp }}/recovery/recovery-context.json
          PLAN: ${{ runner.temp }}/recovery/recovery-bundle/release-set-plan.json
          BUNDLE: ${{ runner.temp }}/recovery/recovery-bundle
          NPM: ${{ runner.temp }}/recovery-readonly/npm-proof.json
          RUBY: ${{ runner.temp }}/recovery-readonly/rubygems-proof.json
          RUST: ${{ runner.temp }}/recovery-readonly/rust-proof.json
          PYPI: ${{ runner.temp }}/recovery-pypi/pypi-proof.json
          GO: ${{ runner.temp }}/go-proof.json
          OUT: ${{ runner.temp }}/recovery-assets
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          cp "$NPM" "$OUT/npm-proof.json"; cp "$RUBY" "$OUT/rubygems-proof.json"; cp "$RUST" "$OUT/rust-proof.json"; cp "$PYPI" "$OUT/pypi-proof.json"; cp "$GO" "$OUT/go-proof.json"
          node --input-type=module - "$CONTEXT" "$OUT/tag-proof.json" <<'NODE'
