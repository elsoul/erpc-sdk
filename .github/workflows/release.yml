          node --input-type=module - "$PLAN_FILE" "$BUNDLE_DIR" "$PROOF_DIR" "$ASSET_DIR" "$MANIFEST_FILE" "$DESCRIPTOR_FILE" "$RUNNER_TEMP/release-set-finalizer/manifest.meta.json" <<'NODE'
