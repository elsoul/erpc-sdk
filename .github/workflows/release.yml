          node-version: 24
          package-manager-cache: false
      - name: Install and verify exact npm observer client
        run: npm install --global npm@11.19.1 && test "$(npm --version)" = 11.19.1
      - name: Install Ruby observer runtimes
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
      - name: Capture Ruby 3.1 observer path
        run: echo "RECOVERY_RUBY31=$(command -v ruby)" >> "$GITHUB_ENV"
      - name: Install Ruby 3.4 observer runtime
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: false
      - name: Capture Ruby 3.4 observer path
        run: echo "RECOVERY_RUBY34=$(command -v ruby)" >> "$GITHUB_ENV"
      - name: Prove npm and RubyGems public bytes without credentials
        env:
          CONTEXT: ${{ runner.temp }}/recovery/recovery-context.json
          PLAN: ${{ runner.temp }}/recovery/recovery-bundle/release-set-plan.json
          PREP: ${{ runner.temp }}/recovery/recovery-preparation.json
          VENV: ${{ runner.temp }}/recovery-venv
          SOURCE_M: ${{ env.PUBLICATION_RECOVERY_SOURCE_M }}
          PUBLISH_RUN: ${{ env.PUBLICATION_RECOVERY_ORIGINAL_PUBLICATION_RUN_ID }}
          PUBLISH_ATTEMPT: ${{ env.PUBLICATION_RECOVERY_ORIGINAL_PUBLICATION_RUN_ATTEMPT }}
        run: |
          set -euo pipefail
          unset NPM_TOKEN NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG NPM_CONFIG_GLOBALCONFIG GEM_HOST_API_KEY RUBYGEMS_API_KEY PYPI_TOKEN TWINE_PASSWORD TWINE_USERNAME || true
          : > "$RUNNER_TEMP/empty-npmrc"
          : > "$RUNNER_TEMP/empty-global-npmrc"
          mkdir -p "$RUNNER_TEMP/recovery-npm" "$RUNNER_TEMP/recovery-rubygems" "$RUNNER_TEMP/recovery-rust"
          printf '%s\n' '{"repository":"elsoul/erpc-sdk","repositoryId":"1429568627","sourceCommit":"'"$SOURCE_M"'","workflowPath":".github/workflows/release.yml","ref":"refs/heads/main","event":"workflow_dispatch","environment":"npm","publisherRunId":"'"$PUBLISH_RUN"'","publisherAttempt":"'"$PUBLISH_ATTEMPT"'"}' > "$RUNNER_TEMP/recovery-npm-publisher.json"
          recovery_node="$(command -v node)"; recovery_npm="$(command -v npm)"
          export PUBLICATION_RECOVERY_CONTEXT_FILE="$CONTEXT" PUBLICATION_RECOVERY_PLAN_FILE="$PLAN" PUBLICATION_RECOVERY_PUBLISHER_FILE="$RUNNER_TEMP/recovery-npm-publisher.json" PUBLICATION_RECOVERY_OBSERVER_RUN_ID="$GITHUB_RUN_ID" PUBLICATION_RECOVERY_OBSERVER_ATTEMPT="$GITHUB_RUN_ATTEMPT" PUBLICATION_RECOVERY_WORK_DIR="$RUNNER_TEMP/recovery-npm" PUBLICATION_RECOVERY_OUTPUT_FILE="$RUNNER_TEMP/npm-proof.json" PUBLICATION_RECOVERY_NODE="$recovery_node" PUBLICATION_RECOVERY_NPM_CLI="$recovery_npm" PUBLICATION_RECOVERY_PYTHON="$VENV/bin/python"
          node scripts/verify-release.mjs --publication-recovery-npm-observe
          export PUBLICATION_RECOVERY_WORK_DIR="$RUNNER_TEMP/recovery-rubygems" PUBLICATION_RECOVERY_OUTPUT_FILE="$RUNNER_TEMP/rubygems-proof.json" PUBLICATION_RECOVERY_RUBY31="$RECOVERY_RUBY31" PUBLICATION_RECOVERY_RUBY34="$RECOVERY_RUBY34"
          node scripts/verify-release.mjs --publication-recovery-rubygems-observe
          export PUBLICATION_RECOVERY_WORK_DIR="$RUNNER_TEMP/recovery-rust" PUBLICATION_RECOVERY_OUTPUT_FILE="$RUNNER_TEMP/rust-proof.json"
          node scripts/verify-release.mjs --publication-recovery-rust-observe
          node --input-type=module - "$CONTEXT" "$RUNNER_TEMP/npm-proof.json" "$RUNNER_TEMP/rubygems-proof.json" "$RUNNER_TEMP/rust-proof.json" <<'NODE'
          import { readFileSync } from 'node:fs'
          import { validatePublicationRecoveryContext, validatePublicationRecoveryReceipt, PUBLICATION_RECOVERY_NPM_SHA256, PUBLICATION_RECOVERY_RUBYGEMS_SHA256, RUST_011_REUSE_SHA256 } from './scripts/verify-release.mjs'
          const [contextFile, npmFile, rubyFile, rustFile] = process.argv.slice(2); const context = JSON.parse(readFileSync(contextFile, 'utf8'))
          validatePublicationRecoveryContext(context, { requireCiProof: true })
          validatePublicationRecoveryReceipt(JSON.parse(readFileSync(npmFile, 'utf8')), { kind: 'npm', context, expectedSha256: PUBLICATION_RECOVERY_NPM_SHA256 })
          validatePublicationRecoveryReceipt(JSON.parse(readFileSync(rubyFile, 'utf8')), { kind: 'rubygems', context, expectedSha256: PUBLICATION_RECOVERY_RUBYGEMS_SHA256 })
          validatePublicationRecoveryReceipt(JSON.parse(readFileSync(rustFile, 'utf8')), { kind: 'rust', context, expectedSha256: RUST_011_REUSE_SHA256 })
          NODE
      - name: Upload read-only recovery proofs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: publication-recovery-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-proof.json
            ${{ runner.temp }}/rubygems-proof.json
            ${{ runner.temp }}/rust-proof.json
            ${{ runner.temp }}/recovery-tooling-proof.json
          if-no-files-found: error
          retention-days: 365
      - name: Upload authenticated npm receipt artifact
        id: npm_receipt
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-set-npm-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-proof.json
