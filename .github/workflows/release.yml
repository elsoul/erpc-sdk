name: Release SDK packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install TypeScript dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify tag and package identities
        run: node scripts/verify-release.mjs "${{ github.ref_name }}"
      - name: Run complete release validation
        run: corepack pnpm release:check

  npm:
    name: Publish @elsoul/erpc-sdk
    needs: verify
    environment: npm
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install supported npm CLI
        run: npm install --global npm@11.19.1
      - name: Check npm publication status
        id: registry
        run: node scripts/check-registry-version.mjs npm
      - name: Enable pnpm
        if: steps.registry.outputs.published != 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        if: steps.registry.outputs.published != 'true'
        run: corepack pnpm install --frozen-lockfile
      - name: Build package
        if: steps.registry.outputs.published != 'true'
        run: corepack pnpm --filter @elsoul/erpc-sdk release:check
      - name: Publish with npm Trusted Publishing
        if: steps.registry.outputs.published != 'true'
        working-directory: packages/typescript
        run: npm publish --access public --provenance

  crates:
    name: Publish erpc-sdk crate
    needs: verify
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check crates.io publication status
        id: registry
        run: node scripts/check-registry-version.mjs crates
      - name: Authenticate with crates.io Trusted Publishing
        if: steps.registry.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        if: steps.registry.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --package erpc-sdk

  github-release:
    name: Create GitHub Release
    needs:
      - npm
      - crates
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create release from the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release view "$TAG" >/dev/null 2>&1 ||
          gh release create "$TAG" --verify-tag --generate-notes
          --title "ERPC SDK $TAG"
