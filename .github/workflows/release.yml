          NODE
          exec {receipt_read_fd}<<<"$GH_TOKEN"
          export RELEASE_SET_RECEIPT_READ_TOKEN_FD="$receipt_read_fd"
          mkdir -p "$RUNNER_TEMP/release-set-package-receipt-work"
          RELEASE_SET_PLAN_FILE="$PLAN_FILE" RELEASE_SET_BINDING_FILE="$BINDING_FILE" RELEASE_SET_RUN_FILE="$RUNNER_TEMP/release-set-verified/evidence/run.json" RELEASE_SET_ARTIFACT_METADATA_FILE="$RUNNER_TEMP/release-set-verified/evidence/bundle-metadata.json" RELEASE_SET_BINDING_METADATA_FILE="$RUNNER_TEMP/release-set-verified/evidence/binding-metadata.json" RELEASE_SET_ARTIFACT_DIR="$RUNNER_TEMP/release-set-verified/bundle" RELEASE_SET_BINDING_DIR="$RUNNER_TEMP/release-set-verified/binding" RELEASE_SET_BUNDLE_ZIP_FILE="$RUNNER_TEMP/release-set-verified/zips/bundle.zip" RELEASE_SET_BINDING_ZIP_FILE="$RUNNER_TEMP/release-set-verified/zips/binding.zip" RELEASE_SET_RECEIPT_ARTIFACTS_FILE="$RUNNER_TEMP/release-set-package-receipt-artifacts.json" RELEASE_SET_RECEIPT_NAMES='npm-proof.json,pypi-proof.json,rubygems-proof.json' RELEASE_SET_RECEIPTS_OBSERVATION_FILE="$RUNNER_TEMP/release-set-package-receipt-observation.json" RELEASE_SET_RECEIPT_WORK_DIR="$RUNNER_TEMP/release-set-package-receipt-work" RELEASE_SET_RECEIPT_OBSERVER_RUN_ID="$GITHUB_RUN_ID" RELEASE_SET_RECEIPT_OBSERVER_ATTEMPT="$GITHUB_RUN_ATTEMPT" RELEASE_SET_RECEIPT_OBSERVER_WORKFLOW='.github/workflows/release.yml' RELEASE_SET_RECEIPT_OBSERVER_SOURCE="$EXPECTED_COMMIT" node scripts/verify-release.mjs --release-set-receipts-observe
      - name: Observe exact immutable Rust reuse
        env:
          RELEASE_SET_PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          RELEASE_SET_PLAN_SHA256: ${{ inputs.release_set_plan_sha256 }}
          RELEASE_SET_BINDING_FILE: ${{ runner.temp }}/release-set-verified/binding/release-set-binding.json
          RELEASE_SET_ARTIFACT_DIR: ${{ runner.temp }}/release-set-verified/bundle
          RELEASE_SET_BINDING_DIR: ${{ runner.temp }}/release-set-verified/binding
          RELEASE_SET_RUN_FILE: ${{ runner.temp }}/release-set-verified/evidence/run.json
          RELEASE_SET_ARTIFACT_METADATA_FILE: ${{ runner.temp }}/release-set-verified/evidence/bundle-metadata.json
          RELEASE_SET_BINDING_METADATA_FILE: ${{ runner.temp }}/release-set-verified/evidence/binding-metadata.json
          RELEASE_SET_BUNDLE_ZIP_FILE: ${{ runner.temp }}/release-set-verified/zips/bundle.zip
          RELEASE_SET_BINDING_ZIP_FILE: ${{ runner.temp }}/release-set-verified/zips/binding.zip
          RELEASE_SET_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          RELEASE_SET_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          RELEASE_SET_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          RELEASE_SET_PREPARED_BINDING_ARTIFACT_ID: ${{ inputs.prepared_binding_artifact_id }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CHECKOUT_HEAD: ${{ inputs.expected_commit }}
          CHECKOUT_STATUS: ''
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_SET_RUST_OBSERVER_RUN_ID: ${{ github.run_id }}
          RELEASE_SET_RUST_OBSERVER_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_SET_RUST_OBSERVER_WORKFLOW: .github/workflows/release.yml
          RELEASE_SET_RUST_OBSERVER_SOURCE: ${{ inputs.expected_commit }}
          RELEASE_SET_RUST_OUTPUT_FILE: ${{ runner.temp }}/rust-proof.json
          RELEASE_SET_RUST_WORK_DIR: ${{ runner.temp }}/rust-observer
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_SET_RUST_WORK_DIR"
          node scripts/verify-release.mjs --release-set-rust-observe
          cp "$RELEASE_SET_RUST_OUTPUT_FILE" "$RUNNER_TEMP/release-set-receipts/rust-proof.json"
      - name: Preflight and create only exact release and Go refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_SET_PLAN_SHA256: ${{ inputs.release_set_plan_sha256 }}
          PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          BODY_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-body.md
          RECEIPTS_DIR: ${{ runner.temp }}/release-set-receipts
          RELEASE_USER_AGENT: erpc-sdk-release-verification (https://github.com/elsoul/erpc-sdk)
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          mkdir -p "$RUNNER_TEMP/release-set-finalizer/tag-state"
          release_values="$(node --input-type=module - "$PLAN_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'
          const plan = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          console.log(plan.tags.release); console.log(plan.tags.go); console.log(plan.githubRelease.title)
          NODE
          )"
          release_tag="$(printf '%s\n' "$release_values" | sed -n '1p')"
          go_tag="$(printf '%s\n' "$release_values" | sed -n '2p')"
          release_title="$(printf '%s\n' "$release_values" | sed -n '3p')"
          read_ref() {
            local tag="$1" output="$2" status curl_status
            set +e
            status="$(curl --silent --show-error --max-time 30 --retry 0 --user-agent "$RELEASE_USER_AGENT" --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --output "$output" --write-out '%{http_code}' "$api/git/ref/tags/$tag")"
            curl_status=$?
            set -e
            test "$curl_status" -eq 0
            if [ "$status" = 404 ]; then printf '%s\n' absent > "$output.state"
            elif [ "$status" = 200 ]; then
              node --input-type=module - "$output" "refs/tags/$tag" "$EXPECTED_COMMIT" <<'NODE'
          import { readFileSync } from 'node:fs'
          const [file, expectedRef, source] = process.argv.slice(2); const payload = JSON.parse(readFileSync(file, 'utf8'))
          if (payload.ref !== expectedRef || payload.object?.type !== 'commit' || payload.object?.sha !== source) throw new Error('existing tag is not bound to the reviewed source')
          NODE
              printf '%s\n' present > "$output.state"
            else echo "tag read failed with HTTP $status" >&2; exit 1; fi
          }
          read_ref "$release_tag" "$RUNNER_TEMP/release-set-finalizer/tag-state/release.json"
          read_ref "$go_tag" "$RUNNER_TEMP/release-set-finalizer/tag-state/go.json"
          release_json="$RUNNER_TEMP/release-set-finalizer/release-preflight.json"
          set +e
          release_status="$(curl --silent --show-error --max-time 30 --retry 0 --user-agent "$RELEASE_USER_AGENT" --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --output "$release_json" --write-out '%{http_code}' "$api/releases/tags/$release_tag")"
          release_curl_status=$?
          set -e
          test "$release_curl_status" -eq 0
          release_collection="$RUNNER_TEMP/release-set-finalizer/release-collection-preflight.json"
          gh api --paginate --slurp "$api/releases?per_page=100" > "$release_collection"
          node --input-type=module - "$release_collection" "$BODY_FILE" "$release_tag" "$release_title" "$EXPECTED_COMMIT" <<'NODE'
          import { readFileSync } from 'node:fs'
          const [file, bodyFile, tag, title, source] = process.argv.slice(2); const matches = JSON.parse(readFileSync(file, 'utf8')).flat().filter(Boolean).filter(item => item.tag_name === tag)
          if (matches.length > 1) throw new Error('matching Release collection is ambiguous')
          if (matches.length === 1 && (matches[0].name !== title || matches[0].body !== readFileSync(bodyFile, 'utf8') || (matches[0].target_commitish !== source && matches[0].target_commitish !== tag) || matches[0].prerelease === true)) throw new Error('matching Release collection conflicts with the reviewed plan')
          NODE
          if [ "$release_status" = 200 ]; then
