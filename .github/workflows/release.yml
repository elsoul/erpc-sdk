          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_ARTIFACTS: '["${{ steps.locate.outputs.wheel_file }}","${{ steps.locate.outputs.sdist_file }}"]'
          BUNDLE_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          STAGE_DIR: ${{ runner.temp }}/pypi-stage
        run: |
          set -euo pipefail
          mkdir -p "$STAGE_DIR"
          set +e
          STATUS="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RESPONSE_FILE" --write-out '%{http_code}' "https://pypi.org/pypi/erpc-sdk/$EXPECTED_VERSION/json")"
