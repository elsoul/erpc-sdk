name: Release SDK packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Verify the Go module tag points to the release commit
        env:
          GO_TAG: packages/go/${{ github.ref_name }}
        run: test "$(git rev-list -n 1 "$GO_TAG")" = "$GITHUB_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install the minimum supported Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
          rustup default 1.85.0
      - name: Install the minimum supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install the minimum supported Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22.x'
          cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install TypeScript dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install Python package and development tools
        run: python -m pip install --disable-pip-version-check -e './packages/python[dev]'
      - name: Download Go dependencies
        working-directory: packages/go
        run: go mod download
      - name: Verify tag and package identities
        run: node scripts/verify-release.mjs "${{ github.ref_name }}"
      - name: Run complete release validation
        run: corepack pnpm release:check

  npm:
    name: Publish @elsoul/erpc-sdk
    needs: verify
    environment: npm
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install supported npm CLI
        run: npm install --global npm@11.19.1
      - name: Check npm publication status
        id: registry
        run: node scripts/check-registry-version.mjs npm
      - name: Enable pnpm
        if: steps.registry.outputs.published != 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        if: steps.registry.outputs.published != 'true'
        run: corepack pnpm install --frozen-lockfile
      - name: Build package
        if: steps.registry.outputs.published != 'true'
        run: corepack pnpm --filter @elsoul/erpc-sdk release:check
      - name: Publish with npm Trusted Publishing
        if: steps.registry.outputs.published != 'true'
        working-directory: packages/typescript
        run: npm publish --access public --provenance

  crates:
    name: Publish erpc-sdk crate
    needs: verify
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install the minimum supported Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Check crates.io publication status
        id: registry
        run: node scripts/check-registry-version.mjs crates
      - name: Authenticate with crates.io Trusted Publishing
        if: steps.registry.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        if: steps.registry.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --package erpc-sdk

  python-distribution:
    name: Build and inspect Python distribution
    needs: verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Check PyPI publication status
        id: registry
        run: node scripts/check-registry-version.mjs pypi
      - name: Set up Python
        if: steps.registry.outputs.published != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Python packaging tools
        if: steps.registry.outputs.published != 'true'
        run: python -m pip install build==1.6.0 twine==7.0.0
      - name: Build wheel and source distribution
        if: steps.registry.outputs.published != 'true'
        run: python -m build packages/python --outdir dist
      - name: Inspect Python distributions
        if: steps.registry.outputs.published != 'true'
        run: python -m twine check dist/*
      - name: Store Python distributions
        if: steps.registry.outputs.published != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish erpc-sdk Python distribution
    needs: python-distribution
    environment:
      name: pypi
      url: https://pypi.org/project/erpc-sdk/
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Python distributions
        if: needs.python-distribution.outputs.published != 'true'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        if: needs.python-distribution.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release
    needs:
      - npm
      - crates
      - pypi
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create release from the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release view "$TAG" >/dev/null 2>&1 ||
          gh release create "$TAG" --verify-tag --generate-notes
          --title "ERPC SDK $TAG"
