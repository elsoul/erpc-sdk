                      statement=json.loads(attestation.envelope.statement.decode()); subject=next((s for s in statement.get('subject',[]) if s.get('name')==filename and s.get('digest',{}).get('sha256')==descriptor['sha256']),None)
                      if statement.get('predicateType')!='https://docs.pypi.org/attestations/publish/v1' or subject is None: continue
                      attestation.verify(GitHubPublisher(repository='elsoul/erpc-sdk', workflow='release.yml', environment='pypi'), Distribution(name=filename, digest=descriptor['sha256'])); claims=attestation.certificate_claims; match=re.fullmatch(r'https://github\.com/elsoul/erpc-sdk/actions/runs/([1-9][0-9]*)/attempts/([1-9][0-9]*)', claims.get('1.3.6.1.4.1.57264.1.21','')); source=claims.get('1.3.6.1.4.1.57264.1.13');
                      if not match or source != plan['sourceCommit']: raise SystemExit('PyPI barrier publisher context mismatch')
                      found.append({'repository':'elsoul/erpc-sdk','repositoryId':'1429568627','sourceCommit':source,'workflowPath':'.github/workflows/release.yml','ref':'refs/heads/main','event':'workflow_dispatch','environment':'pypi','publisherRunId':match.group(1),'publisherAttempt':match.group(2)})
              if len(found)!=1: raise SystemExit(f'PyPI barrier publisher context is not unique for {filename}')
              contexts[filename]=found[0]
          json.dump(contexts, open(output,'w')); open(output,'a').write('\n')
          PY
            node --input-type=module - "$BARRIER_DIR/pypi-publishers.json" "$BARRIER_DIR/pypi-run-requests.tsv" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'; const publishers=JSON.parse(readFileSync(process.argv[2],'utf8')); const seen=new Set(); const rows=[]; for (const p of Object.values(publishers)) { const key=`${p.publisherRunId}/${p.publisherAttempt}`; if(!seen.has(key)){seen.add(key); rows.push(key)} } writeFileSync(process.argv[3], `${rows.join('\n')}\n`)
          NODE
            while IFS=/ read -r run_id attempt; do [ -n "$run_id" ] || continue; gh api "/repos/$REPOSITORY/actions/runs/$run_id/attempts/$attempt" > "$BARRIER_DIR/$run_id-$attempt.json"; done < "$BARRIER_DIR/pypi-run-requests.tsv"
            while IFS=/ read -r run_id attempt; do [ -n "$run_id" ] || continue; node --input-type=module - "$BARRIER_DIR/$run_id-$attempt.json" "$EXPECTED_COMMIT" "$run_id" "$attempt" <<'NODE'
          import { readFileSync } from 'node:fs'; const [file, source, requestedId, requestedAttempt]=process.argv.slice(2); const run=JSON.parse(readFileSync(file,'utf8')); const current=run.id===Number(process.env.GITHUB_RUN_ID)&&run.run_attempt===Number(process.env.GITHUB_RUN_ATTEMPT); if(String(run.id)!==String(requestedId)||String(run.run_attempt)!==String(requestedAttempt)||run.head_sha!==source||run.head_branch!=='main'||run.event!=='workflow_dispatch'||run.path!=='.github/workflows/release.yml'||String(run.repository?.id??run.repository_id)!=='1429568627'||(!current&&(run.status!=='completed'||!['success','failure','cancelled','timed_out','action_required','neutral','skipped'].includes(run.conclusion)))) throw new Error('PyPI barrier publisher run context is not terminal/source-bound')
          NODE
            done < "$BARRIER_DIR/pypi-run-requests.tsv"
            RELEASE_SET_PYPI_PUBLISHERS_FILE="$BARRIER_DIR/pypi-publishers.json" RELEASE_SET_PYPI_OBSERVER_RUN_ID="$GITHUB_RUN_ID" RELEASE_SET_PYPI_OBSERVER_ATTEMPT="$GITHUB_RUN_ATTEMPT" RELEASE_SET_PYPI_OBSERVER_WORKFLOW='.github/workflows/release.yml' RELEASE_SET_PYPI_OBSERVER_SOURCE="$EXPECTED_COMMIT" RELEASE_SET_PYPI_OUTPUT_FILE="$BARRIER_DIR/pypi-proof.json" RELEASE_SET_PYPI_WORK_DIR="$BARRIER_DIR/pypi-work" RELEASE_SET_PYPI_PREFLIGHT_ONLY='true' RELEASE_SET_PYPI_PYTHON="$(command -v python)" node scripts/verify-release.mjs --release-set-pypi-observe
          fi
          if [ "$rubygems_state" = match ]; then
            RELEASE_SET_RUBYGEMS_OBSERVER_RUN_ID="$GITHUB_RUN_ID" RELEASE_SET_RUBYGEMS_OBSERVER_ATTEMPT="$GITHUB_RUN_ATTEMPT" RELEASE_SET_RUBYGEMS_OBSERVER_WORKFLOW='.github/workflows/release.yml' RELEASE_SET_RUBYGEMS_OBSERVER_SOURCE="$EXPECTED_COMMIT" RELEASE_SET_RUBYGEMS_OUTPUT_FILE="$BARRIER_DIR/rubygems-proof.json" RELEASE_SET_RUBYGEMS_WORK_DIR="$BARRIER_DIR/rubygems-work" RELEASE_SET_RUBYGEMS_RUBY31="$BARRIER_RUBY31" RELEASE_SET_RUBYGEMS_RUBY34="$BARRIER_RUBY34" node scripts/verify-release.mjs --release-set-rubygems-observe
          fi
          printf '%s\n' "npm=$npm_state" "pypi=$pypi_state" "rubygems=$rubygems_state" > "$BARRIER_DIR/barrier.txt"
      - name: Build authenticated protected-publisher handoff
        env:
