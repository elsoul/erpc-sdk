              if len(matches) != 1: raise SystemExit(f'PyPI existing attestation is not unique for {filename}')
              invocation = matches[0].get('1.3.6.1.4.1.57264.1.21')
              match = re.fullmatch(r'https://github\.com/elsoul/erpc-sdk/actions/runs/([1-9][0-9]*)/attempts/([1-9][0-9]*)', invocation or '')
              if match is None: raise SystemExit(f'PyPI existing publisher invocation is invalid for {filename}')
              publisher_source = matches[0].get('1.3.6.1.4.1.57264.1.13')
              result[filename] = {'filename': filename, 'sha256': digest, 'yanked': item.get('yanked'), 'attestationVerified': True, 'publisherSourceCommit': publisher_source, 'publisher': {'repository': 'elsoul/erpc-sdk', 'repositoryId': '1429568627', 'sourceCommit': publisher_source, 'workflowPath': '.github/workflows/release.yml', 'ref': 'refs/heads/main', 'event': 'workflow_dispatch', 'environment': 'pypi', 'publisherRunId': match.group(1), 'publisherAttempt': match.group(2), 'invocation': invocation}}
          json.dump(result, open(output, 'w', encoding='utf-8')); open(output, 'a', encoding='utf-8').write('\n')
          PY
          fi
          node --input-type=module - "$status" "$RESPONSE" "$PLAN" "$BUNDLE" "$STAGE" "$INPUT" <<'NODE'
          import { copyFileSync, readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { createHash } from 'node:crypto'
          const [status, responseFile, planFile, bundle, stage, output] = process.argv.slice(2)
          const plan = JSON.parse(readFileSync(planFile, 'utf8'))
          const expected = Object.fromEntries(plan.artifacts.filter(item => item.kind.startsWith('pypi')).map(item => [item.filename, item.sha256]))
          const missing = []; const existing = []; const verifiedExisting = status === '200' ? JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/pypi-existing-proof.json', 'utf8')) : {}
          let payload = {}
          if (status === '200') {
            payload = JSON.parse(readFileSync(responseFile, 'utf8'))
            if (payload.info?.name !== 'erpc-sdk' || payload.info?.version !== '0.11.0' || !Array.isArray(payload.urls)) throw new Error('PyPI metadata identity conflict')
            for (const [filename, digest] of Object.entries(expected)) {
              const item = payload.urls.find(candidate => candidate.filename === filename)
              if (item === undefined) { missing.push(filename); continue }
              if (item.yanked !== false || item.digests?.sha256 !== digest || typeof item.url !== 'string' || !item.url.startsWith('https://files.pythonhosted.org/')) throw new Error(`PyPI conflict for ${filename}`)
              const verified = verifiedExisting[filename]
              if (verified === undefined) throw new Error(`PyPI existing proof is missing for ${filename}`)
              existing.push(verified)
            }
          } else if (status === '404') {
            missing.push(...Object.keys(expected))
          } else throw new Error(`PyPI preflight stopped in HTTP ${status}`)
          for (const filename of missing) {
            copyFileSync(join(bundle, filename), join(stage, filename))
            const digest = createHash('sha256').update(readFileSync(join(stage, filename))).digest('hex')
            if (digest !== expected[filename]) throw new Error(`staged PyPI digest mismatch for ${filename}`)
          }
          const state = status === '404' ? 'absent' : missing.length === 0 ? 'match' : 'partial'
          const readonly = name => JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, `recovery-readonly/${name}`), 'utf8'))
          writeFileSync(output, `${JSON.stringify({ npm: readonly('npm-proof.json'), rubygems: readonly('rubygems-proof.json'), rust: readonly('rust-proof.json'), pypi: { state, status: Number(status), absenceGate: status === '404', missing, existing } })}\n`)
          console.log(`state=${state}`)
          console.log(`missing=${missing.length > 0}`)
          NODE
          state="$(jq -r .pypi.state "$INPUT")"
          missing="$(jq -r '.pypi.missing | length' "$INPUT")"
          export PUBLICATION_RECOVERY_CONTEXT_FILE="$RUNNER_TEMP/recovery/recovery-context.json" PUBLICATION_RECOVERY_PREFLIGHT_INPUT_FILE="$INPUT" PUBLICATION_RECOVERY_PREFLIGHT_OUTPUT_FILE="$RUNNER_TEMP/recovery-pypi-preflight-checked.json"
          node scripts/verify-release.mjs --publication-recovery-preflight
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "missing=$([ "$missing" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Recheck live main C immediately before any PyPI credential request
        if: steps.preflight.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: ${{ runner.temp }}/recovery/recovery-context.json
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$EXPECTED_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$(jq -r .controlCommit "$CONTEXT")"
          test "$(git rev-parse HEAD)" = "$(jq -r .controlCommit "$CONTEXT")"
      - name: Upload missing PyPI bytes exactly once with Trusted Publishing
        if: steps.preflight.outputs.missing == 'true'
        id: pypi_upload
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
