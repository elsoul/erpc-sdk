      - name: Upload authenticated Rust receipt artifact
        id: rust_receipt
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-set-rust-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-proof.json
          if-no-files-found: error
