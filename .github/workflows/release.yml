          node --input-type=module - "$PLAN_FILE" "$BODY_FILE" "$payload" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [planFile, bodyFile, output] = process.argv.slice(2)
          const plan = JSON.parse(readFileSync(planFile, 'utf8'))
          writeFileSync(output, JSON.stringify({ tag_name: plan.tags.release, target_commitish: plan.sourceCommit, name: plan.githubRelease.title, body: readFileSync(bodyFile, 'utf8'), draft: true, prerelease: false, make_latest: 'false' }))
