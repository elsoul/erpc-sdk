            CURL_STATUS=$?
            set -e
            test "$CURL_STATUS" -eq 0
            if [ "$STATUS" = 200 ]; then break; fi
            if [ "$STATUS" != 404 ] || [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 5
          done
          FOUNDATION_REGISTRY=rubygems REGISTRY_STATUS="$STATUS" REGISTRY_RESPONSE_FILE="$RESPONSE_FILE" EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_SHA256="${{ steps.locate.outputs.sha256 }}" node scripts/verify-release.mjs --foundation-registry
          curl --fail --silent --show-error --location --max-time 60 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RUNNER_TEMP/gem-final.gem" "https://rubygems.org/downloads/${{ steps.locate.outputs.filename }}"
          test "$(sha256sum "$RUNNER_TEMP/gem-final.gem" | awk '{print $1}')" = "${{ steps.locate.outputs.sha256 }}"
          gem install --local "$RUNNER_TEMP/gem-final.gem" --install-dir "$RUNNER_TEMP/gem-check" --no-document
          printf '%s\n' '{"registry":"rubygems","verified":true,"credential":"OIDC trusted publisher; local credential cleanup/expiry only","attestation":"not asserted"}' > "$RUNNER_TEMP/rubygems-proof.json"
