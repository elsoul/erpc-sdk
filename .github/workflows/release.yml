  pypi:
    name: Publish exact PyPI distributions
    needs: publication-validation
    if: ${{ inputs.recovery_mode == 'disabled' && inputs.mode == 'publish' && inputs.release_set_mode == 'disabled' && needs.publication-validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out exact source without credentials
