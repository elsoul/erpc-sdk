          path: ${{ runner.temp }}/sdk-foundation-binding
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: foundation-proof-*
          run-id: ${{ github.run_id }}
