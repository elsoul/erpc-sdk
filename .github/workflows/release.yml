          for name in missing:
              shutil.copyfile(f'{bundle}/{name}', f'{stage}/{name}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'state={state}', file=output)
              print(f'missing={str(bool(missing)).lower()}', file=output)
          PY
      - name: Publish missing PyPI files with Trusted Publishing
        if: steps.preflight.outputs.missing == 'true'
        id: publish_pypi
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/pypi-stage
          attestations: true
      - name: Verify complete PyPI file set and downloads
        if: always() && (steps.preflight.outputs.state == 'absent' || steps.preflight.outputs.state == 'partial' || steps.preflight.outputs.state == 'match')
        env:
          RESPONSE_FILE: ${{ runner.temp }}/pypi-version-final.json
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          WHEEL_FILE: ${{ steps.locate.outputs.wheel_file }}
          WHEEL_SHA256: ${{ steps.locate.outputs.wheel_sha256 }}
          SDIST_FILE: ${{ steps.locate.outputs.sdist_file }}
          SDIST_SHA256: ${{ steps.locate.outputs.sdist_sha256 }}
          EXPECTED_ARTIFACTS: '["${{ steps.locate.outputs.wheel_file }}","${{ steps.locate.outputs.sdist_file }}"]'
          EXPECTED_SHA256S: '{"${{ steps.locate.outputs.wheel_file }}":"${{ steps.locate.outputs.wheel_sha256 }}","${{ steps.locate.outputs.sdist_file }}":"${{ steps.locate.outputs.sdist_sha256 }}"}'
          FOUNDATION_DOWNLOADS_FILE: ${{ runner.temp }}/pypi-downloads.tsv
          PYPI_STATE: ${{ steps.preflight.outputs.state }}
          PYPI_UPLOAD_OUTCOME: ${{ steps.publish_pypi.outcome }}
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            set +e
            STATUS="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RESPONSE_FILE" --write-out '%{http_code}' "https://pypi.org/pypi/erpc-sdk/$EXPECTED_VERSION/json")"
            CURL_STATUS=$?
            set -e
            test "$CURL_STATUS" -eq 0
            if [ "$STATUS" = 200 ]; then break; fi
            if [ "$STATUS" != 404 ] || [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 5
          done
          test "$STATUS" = 200
          REGISTRY_RESPONSE_FILE="$RESPONSE_FILE" EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_ARTIFACTS="$EXPECTED_ARTIFACTS" EXPECTED_SHA256S="$EXPECTED_SHA256S" FOUNDATION_DOWNLOADS_FILE="$FOUNDATION_DOWNLOADS_FILE" node scripts/verify-release.mjs --foundation-pypi-proof
          while IFS=$'\t' read -r name url digest; do
            curl --fail --silent --show-error --location --max-time 60 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RUNNER_TEMP/$name" "$url"
            test "$(sha256sum "$RUNNER_TEMP/$name" | awk '{print $1}')" = "$digest"
            attestation_url="https://pypi.org/integrity/erpc-sdk/$EXPECTED_VERSION/$name/provenance"
            attestation_file="$RUNNER_TEMP/$name.provenance.json"
            curl --fail --silent --show-error --location --max-time 60 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$attestation_file" "$attestation_url"
          done < "$FOUNDATION_DOWNLOADS_FILE"
          python - "$FOUNDATION_DOWNLOADS_FILE" "$RUNNER_TEMP" <<'PY'
          import base64, json, os, subprocess, sys
          from pypi_attestations import Distribution, GitHubPublisher, Provenance
          downloads_file, runner_temp = sys.argv[1:]
          for line in open(downloads_file, encoding='utf-8'):
              name, url, digest = line.rstrip('\n').split('\t')
              provenance_file = f'{runner_temp}/{name}.provenance.json'
              local_file = f'{runner_temp}/{name}'
              subprocess.run([sys.executable, '-m', 'pypi_attestations', 'verify', 'pypi', '--repository', 'https://github.com/elsoul/erpc-sdk', '--provenance-file', provenance_file, local_file], check=True)
              document = Provenance.model_validate_json(open(provenance_file, encoding='utf-8').read())
              publisher = document.attestation_bundles[0].publisher
              if publisher.kind != 'GitHub' or publisher.repository != 'elsoul/erpc-sdk' or publisher.workflow != 'release.yml' or publisher.environment != 'pypi':
                  raise SystemExit(f'PyPI publisher binding is invalid for {name}')
              matching = []
              for bundle in document.attestation_bundles:
                  for attestation in bundle.attestations:
                      statement = attestation.statement
                      subject = statement.get('subject', [{}])[0]
                      if statement.get('predicateType') == 'https://docs.pypi.org/attestations/publish/v1' and subject.get('name') == name and subject.get('digest', {}).get('sha256') == digest:
                          matching.append((attestation, statement))
              if len(matching) != 1:
                  raise SystemExit(f'PyPI attestation subject is not unique for {name}')
              attestation, statement = matching[0]
              attestation.verify(GitHubPublisher(repository='elsoul/erpc-sdk', workflow='release.yml', environment='pypi'), Distribution(name=name, digest=digest))
              claims = attestation.certificate_claims
              expected_workflow = 'https://github.com/elsoul/erpc-sdk/.github/workflows/release.yml@refs/heads/main'
              expected_claims = {
                  '1.3.6.1.4.1.57264.1.9': expected_workflow,
                  '1.3.6.1.4.1.57264.1.10': os.environ['FOUNDATION_SOURCE_SHA'],
                  '1.3.6.1.4.1.57264.1.12': 'https://github.com/elsoul/erpc-sdk',
                  '1.3.6.1.4.1.57264.1.13': os.environ['FOUNDATION_SOURCE_SHA'],
                  '1.3.6.1.4.1.57264.1.14': 'refs/heads/main',
                  '1.3.6.1.4.1.57264.1.15': os.environ['EXPECTED_REPOSITORY_ID'],
                  '1.3.6.1.4.1.57264.1.18': expected_workflow,
                  '1.3.6.1.4.1.57264.1.19': os.environ['FOUNDATION_SOURCE_SHA'],
                  '1.3.6.1.4.1.57264.1.20': 'workflow_dispatch',
              }
              if any(claims.get(key) != value for key, value in expected_claims.items()):
                  raise SystemExit(f'PyPI certificate claims do not bind the approved source/workflow for {name}')
              with open(f'{runner_temp}/{name}.claims.json', 'w', encoding='utf-8') as output:
                  json.dump({'statement': statement, 'claims': claims}, output)
                  output.write('\n')
          PY
          node --input-type=module - "$RESPONSE_FILE" "$RUNNER_TEMP/pypi-proof.json" <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [responseFile, outputFile] = process.argv.slice(2)
          const payload = JSON.parse(readFileSync(responseFile, 'utf8'))
          const expected = JSON.parse(process.env.EXPECTED_ARTIFACTS)
          const expectedSha = JSON.parse(process.env.EXPECTED_SHA256S)
          const files = expected.map(filename => {
            const file = payload.urls.find(candidate => candidate.filename === filename)
            const claimsRecord = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/${filename}.claims.json`, 'utf8'))
            const statement = claimsRecord.statement
            if (!file || file.yanked !== false || file.digests?.sha256 !== expectedSha[filename] || !statement || statement.predicateType !== 'https://docs.pypi.org/attestations/publish/v1' || statement.subject?.[0]?.name !== filename || statement.subject?.[0]?.digest?.sha256 !== expectedSha[filename]) throw new Error(`PyPI observed file or attestation is invalid for ${filename}`)
            const observedSha256 = createHash('sha256').update(readFileSync(`${process.env.RUNNER_TEMP}/${filename}`)).digest('hex')
            if (observedSha256 !== expectedSha[filename]) throw new Error(`PyPI downloaded digest mismatch for ${filename}`)
            return { filename, url: file.url, sha256: file.digests.sha256, yanked: file.yanked, packagetype: file.packagetype, attestations: [statement], certificateClaims: claimsRecord.claims, attestationUrl: `https://pypi.org/integrity/erpc-sdk/${process.env.EXPECTED_VERSION}/${filename}/provenance`, observedSha256 }
          })
          const state = process.env.PYPI_STATE === 'absent' ? 'published' : process.env.PYPI_STATE === 'partial' ? 'partial-resume' : 'reused'
          writeFileSync(outputFile, `${JSON.stringify({ schemaVersion: 1, registry: 'pypi.org', repository: process.env.EXPECTED_REPOSITORY, identity: payload.info.name, version: payload.info.version, state, files, sourceCommit: process.env.FOUNDATION_SOURCE_SHA, planSha256: process.env.FOUNDATION_PLAN_SHA256, preparedRunId: process.env.FOUNDATION_PREPARED_RUN_ID, preparedRunAttempt: process.env.FOUNDATION_PREPARED_RUN_ATTEMPT, preparedArtifactId: process.env.FOUNDATION_PREPARED_ARTIFACT_ID, observerRunId: process.env.GITHUB_RUN_ID, observerAttempt: process.env.GITHUB_RUN_ATTEMPT, observedAt: new Date().toISOString(), auth: { requested: state !== 'reused', uploadAttempted: state !== 'reused', uploadOutcome: process.env.PYPI_UPLOAD_OUTCOME || 'not-requested', attestationsVerified: true } })}\n`)
          NODE
      - name: Upload PyPI proof
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-proof-pypi-${{ github.run_id }}
          path: ${{ runner.temp }}/pypi-proof.json
          if-no-files-found: ignore
          retention-days: 30

  rubygems:
    name: Publish exact Ruby gem
    needs: publication-validation
    if: ${{ inputs.recovery_mode == 'disabled' && inputs.mode == 'publish' && inputs.release_set_mode == 'disabled' && needs.publication-validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: rubygems
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download approved bundle and binding
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-bundle
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_binding_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-binding
      - name: Verify approved bundle before authentication
        env:
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_ARTIFACT_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          FOUNDATION_BINDING_FILE: ${{ runner.temp }}/sdk-foundation-binding/foundation-binding.json
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: node scripts/verify-release.mjs --foundation-verify
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
      - name: Locate approved gem
        id: locate
        env:
          PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
        run: |
          set -euo pipefail
          ruby -rjson -e 'p=JSON.parse(File.read(ARGV[0])); a=p.fetch("artifacts").find{|x|x["kind"]=="rubygems"}; puts "filename=#{a.fetch("filename")}"; puts "sha256=#{a.fetch("sha256")}"' "$PLAN_FILE" >> "$GITHUB_OUTPUT"
      - name: Inspect RubyGems version before authentication
        id: preflight
        env:
          RESPONSE_FILE: ${{ runner.temp }}/rubygems-version.json
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          GEM_SHA256: ${{ steps.locate.outputs.sha256 }}
        run: |
          set -euo pipefail
          set +e
          STATUS="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RESPONSE_FILE" --write-out '%{http_code}' "https://rubygems.org/api/v2/rubygems/erpc-sdk/versions/$EXPECTED_VERSION.json")"
          CURL_STATUS=$?
          set -e
          test "$CURL_STATUS" -eq 0
          FOUNDATION_REGISTRY=rubygems REGISTRY_STATUS="$STATUS" REGISTRY_RESPONSE_FILE="$RESPONSE_FILE" EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_SHA256="$GEM_SHA256" node scripts/verify-release.mjs --foundation-registry > "$RUNNER_TEMP/rubygems-state"
          echo "state=$(cat "$RUNNER_TEMP/rubygems-state")" >> "$GITHUB_OUTPUT"
      - name: Download matching gem without authentication
        if: steps.preflight.outputs.state == 'match'
        env:
          GEM_FILE: ${{ steps.locate.outputs.filename }}
          GEM_SHA256: ${{ steps.locate.outputs.sha256 }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 60 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RUNNER_TEMP/gem-final.gem" "https://rubygems.org/downloads/$GEM_FILE"
          test "$(sha256sum "$RUNNER_TEMP/gem-final.gem" | awk '{print $1}')" = "$GEM_SHA256"
      - name: Configure RubyGems Trusted Publishing credentials
        if: steps.preflight.outputs.state == 'absent'
        id: rubygems_auth
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        with:
          trusted-publisher: true
      - name: Push exact gem once
        if: steps.preflight.outputs.state == 'absent'
        id: publish_gem
        continue-on-error: true
        env:
          GEM_FILE: ${{ steps.locate.outputs.filename }}
        run: gem push "$RUNNER_TEMP/sdk-foundation-bundle/$GEM_FILE"
      - name: Verify RubyGems publication and record observed receipt
        if: always() && (steps.preflight.outputs.state == 'absent' || steps.preflight.outputs.state == 'match')
        env:
          RESPONSE_FILE: ${{ runner.temp }}/rubygems-final.json
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          GEM_FILE: ${{ steps.locate.outputs.filename }}
          GEM_SHA256: ${{ steps.locate.outputs.sha256 }}
          CREDENTIAL_OBSERVED_FILE: ${{ runner.temp }}/rubygems-credential-observed.json
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            set +e
            STATUS="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RESPONSE_FILE" --write-out '%{http_code}' "https://rubygems.org/api/v2/rubygems/erpc-sdk/versions/$EXPECTED_VERSION.json")"
            CURL_STATUS=$?
            set -e
            test "$CURL_STATUS" -eq 0
            if [ "$STATUS" = 200 ]; then break; fi
            if [ "$STATUS" != 404 ] || [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 5
          done
          FOUNDATION_REGISTRY=rubygems REGISTRY_STATUS="$STATUS" REGISTRY_RESPONSE_FILE="$RESPONSE_FILE" EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_SHA256="$GEM_SHA256" node scripts/verify-release.mjs --foundation-registry
          curl --fail --silent --show-error --location --max-time 60 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RUNNER_TEMP/gem-final.gem" "https://rubygems.org/downloads/$GEM_FILE"
          test "$(sha256sum "$RUNNER_TEMP/gem-final.gem" | awk '{print $1}')" = "$GEM_SHA256"
          credential_observed=false
          if [ -n "${GEM_HOST_API_KEY:-}" ] || [ -n "${BUNDLE_GEM__PUSH_KEY:-}" ] || [ -n "${RUBYGEMS_API_KEY:-}" ]; then credential_observed=true; fi
          printf '{"credentialObserved":%s}\n' "$credential_observed" > "$CREDENTIAL_OBSERVED_FILE"
      - name: Clean RubyGems local credential material
        if: always()
        run: |
          rm -f "$HOME/.gem/credentials" "$HOME/.config/gem/credentials"
          for key in GEM_HOST_API_KEY BUNDLE_GEM__PUSH_KEY RUBYGEMS_API_KEY; do
            unset "$key"
            printf '%s=\n' "$key" >> "$GITHUB_ENV"
          done
      - name: Run Ruby consumer after credential cleanup and write receipt
        if: always() && (steps.preflight.outputs.state == 'absent' || steps.preflight.outputs.state == 'match')
        env:
          GEM_FILE: ${{ steps.locate.outputs.filename }}
          GEM_SHA256: ${{ steps.locate.outputs.sha256 }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          RUBYGEMS_STATE: ${{ steps.preflight.outputs.state }}
          RUBYGEMS_AUTH_OUTCOME: ${{ steps.rubygems_auth.outcome }}
          RUBYGEMS_UPLOAD_OUTCOME: ${{ steps.publish_gem.outcome }}
          CREDENTIAL_OBSERVED_FILE: ${{ runner.temp }}/rubygems-credential-observed.json
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: |
          set -euo pipefail
          test -z "${GEM_HOST_API_KEY:-}"
          test -z "${BUNDLE_GEM__PUSH_KEY:-}"
          test -z "${RUBYGEMS_API_KEY:-}"
          env -u GEM_HOST_API_KEY -u BUNDLE_GEM__PUSH_KEY -u RUBYGEMS_API_KEY gem install --local "$RUNNER_TEMP/gem-final.gem" --install-dir "$RUNNER_TEMP/gem-check" --no-document
          node --input-type=module - "$CREDENTIAL_OBSERVED_FILE" "$RUNNER_TEMP/rubygems-proof.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [observedFile, outputFile] = process.argv.slice(2)
          const observed = JSON.parse(readFileSync(observedFile, 'utf8'))
          const state = process.env.RUBYGEMS_STATE === 'absent' ? 'published' : 'reused'
          writeFileSync(outputFile, JSON.stringify({ schemaVersion: 1, registry: 'rubygems.org', repository: process.env.EXPECTED_REPOSITORY, identity: 'erpc-sdk', version: process.env.EXPECTED_VERSION, state, artifact: process.env.GEM_FILE, sha256: process.env.GEM_SHA256, sourceCommit: process.env.FOUNDATION_SOURCE_SHA, planSha256: process.env.FOUNDATION_PLAN_SHA256, preparedRunId: process.env.FOUNDATION_PREPARED_RUN_ID, preparedRunAttempt: process.env.FOUNDATION_PREPARED_RUN_ATTEMPT, preparedArtifactId: process.env.FOUNDATION_PREPARED_ARTIFACT_ID, observerRunId: process.env.GITHUB_RUN_ID, observerAttempt: process.env.GITHUB_RUN_ATTEMPT, observedAt: new Date().toISOString(), auth: { requested: state === 'published', uploadAttempted: state === 'published', credentialObserved: observed.credentialObserved, configureOutcome: process.env.RUBYGEMS_AUTH_OUTCOME || 'not-requested', uploadOutcome: process.env.RUBYGEMS_UPLOAD_OUTCOME || 'not-requested' }, credentialCleanup: { envCleared: true, filesCleared: true }, consumer: { installed: true } }) + '\n')
          NODE
      - name: Upload RubyGems proof
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-proof-rubygems-${{ github.run_id }}
          path: ${{ runner.temp }}/rubygems-proof.json
          if-no-files-found: ignore
          retention-days: 30

  rust-reuse:
    name: Verify existing Rust receipt read-only
    needs: publication-validation
    if: ${{ inputs.recovery_mode == 'disabled' && inputs.mode == 'publish' && inputs.release_set_mode == 'disabled' && needs.publication-validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify Rust registry/download receipt without OIDC
        env:
          RELEASE_USER_AGENT: erpc-sdk-release-verification (https://github.com/elsoul/erpc-sdk)
          EXPECTED_SHA256: f2ad81528b35470b8f193dc45ad9f95e2d5ba0749b916ab9422cb07639088dd7
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/rust.json"
          set +e
          status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$response" --write-out '%{http_code}' https://crates.io/api/v1/crates/erpc-sdk/0.10.0)"
          curl_status=$?
          set -e
          test "$curl_status" -eq 0
          FOUNDATION_REGISTRY=rust REGISTRY_STATUS="$status" REGISTRY_RESPONSE_FILE="$response" node scripts/verify-release.mjs --foundation-registry
          curl --fail --silent --show-error --location --max-time 60 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RUNNER_TEMP/erpc-sdk-0.10.0.crate" https://crates.io/api/v1/crates/erpc-sdk/0.10.0/download
          test "$(sha256sum "$RUNNER_TEMP/erpc-sdk-0.10.0.crate" | awk '{print $1}')" = "$EXPECTED_SHA256"
          RUST_REGISTRY_STATUS="$status" node --input-type=module - "$response" "$RUNNER_TEMP/erpc-sdk-0.10.0.crate" "$RUNNER_TEMP/rust-proof.json" <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [metadataFile, archiveFile, outputFile] = process.argv.slice(2)
          const metadata = JSON.parse(readFileSync(metadataFile, 'utf8'))
          const version = metadata.version
          const observedSha256 = createHash('sha256').update(readFileSync(archiveFile)).digest('hex')
          if (version?.crate !== 'erpc-sdk' || version.num !== '0.10.0' || version.yanked !== false || version.checksum !== process.env.EXPECTED_SHA256 || observedSha256 !== process.env.EXPECTED_SHA256) throw new Error('Rust observed receipt does not match the approved artifact')
          writeFileSync(outputFile, `${JSON.stringify({ schemaVersion: 1, registry: 'crates.io', repository: process.env.EXPECTED_REPOSITORY, identity: version.crate, version: version.num, sourceCommit: 'f05abe4276991612c4b5e404fdc768baace32e61', foundationSourceCommit: process.env.FOUNDATION_SOURCE_SHA, sha256: version.checksum, registryStatus: Number(process.env.RUST_REGISTRY_STATUS), yanked: version.yanked, downloadStatus: 200, preparedRunId: process.env.FOUNDATION_PREPARED_RUN_ID, preparedRunAttempt: process.env.FOUNDATION_PREPARED_RUN_ATTEMPT, preparedArtifactId: process.env.FOUNDATION_PREPARED_ARTIFACT_ID, observerRunId: process.env.GITHUB_RUN_ID, observerAttempt: process.env.GITHUB_RUN_ATTEMPT, planSha256: process.env.FOUNDATION_PLAN_SHA256, observedAt: new Date().toISOString(), auth: { requested: false, uploadAttempted: false } })}\n`)
          NODE
      - name: Upload Rust reuse proof
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-proof-rust-${{ github.run_id }}
          path: ${{ runner.temp }}/rust-proof.json
          if-no-files-found: error
          retention-days: 30

  tags:
    name: Create approved non-Rust tags
    needs:
      - publication-validation
      - npm
      - pypi
      - rubygems
      - rust-reuse
    if: ${{ inputs.recovery_mode == 'disabled' && inputs.mode == 'publish' && inputs.release_set_mode == 'disabled' && needs.publication-validation.result == 'success' && needs.npm.result == 'success' && needs.pypi.result == 'success' && needs.rubygems.result == 'success' && needs.rust-reuse.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download approved bundle and binding before tag writes
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-bundle
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_binding_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-binding
      - name: Verify approved bundle before tag writes
        env:
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_ARTIFACT_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          FOUNDATION_BINDING_FILE: ${{ runner.temp }}/sdk-foundation-binding/foundation-binding.json
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: node scripts/verify-release.mjs --foundation-verify
      - name: Create or verify only the two approved refs
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/tag-states"
          mkdir -p "$state_dir"
          for tag in non-rust-v0.9.1 packages/go/v0.9.1; do
            ref="tags/$tag"
            set +e
            existing_status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --output "$RUNNER_TEMP/tag-ref.json" --write-out '%{http_code}' "https://api.github.com/repos/$REPOSITORY/git/ref/$ref")"
            curl_status=$?
            set -e
            test "$curl_status" -eq 0
            if [ "$existing_status" = 200 ]; then
              jq -r '.object.sha' "$RUNNER_TEMP/tag-ref.json" > "$state_dir/$(printf '%s' "$tag" | tr '/' '_')"
            elif [ "$existing_status" = 404 ]; then
              printf '%s\n' absent > "$state_dir/$(printf '%s' "$tag" | tr '/' '_')"
            else
              echo "Git ref read failed with HTTP $existing_status" >&2
              exit 1
            fi
          done
          for tag in non-rust-v0.9.1 packages/go/v0.9.1; do
            state="$(cat "$state_dir/$(printf '%s' "$tag" | tr '/' '_')")"
            if [ "$state" != absent ]; then test "$state" = "$EXPECTED_COMMIT"; fi
          done
          for tag in non-rust-v0.9.1 packages/go/v0.9.1; do
            state="$(cat "$state_dir/$(printf '%s' "$tag" | tr '/' '_')")"
            if [ "$state" = absent ]; then gh api --method POST "/repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$EXPECTED_COMMIT" >/dev/null; fi
          done
          for ref in tags/non-rust-v0.9.1 tags/packages/go/v0.9.1; do
            final_file="$state_dir/$(printf '%s' "$ref" | tr '/' '_')-final.json"
            status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --output "$final_file" --write-out '%{http_code}' "https://api.github.com/repos/$REPOSITORY/git/ref/$ref")"
            test "$status" = 200
            test "$(jq -r '.object.sha' "$final_file")" = "$EXPECTED_COMMIT"
          done
          node --input-type=module - "$state_dir" "$RUNNER_TEMP/tag-proof.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [stateDir, outputFile] = process.argv.slice(2)
          const readRef = name => ({ ref: `refs/tags/${name}`, sha: JSON.parse(readFileSync(`${stateDir}/tags_${name.replaceAll('/', '_')}-final.json`, 'utf8')).object.sha })
          writeFileSync(outputFile, `${JSON.stringify({ schemaVersion: 1, registry: 'github.com', repository: process.env.REPOSITORY, sourceCommit: process.env.EXPECTED_COMMIT, version: '0.9.1', planSha256: process.env.FOUNDATION_PLAN_SHA256, preparedRunId: process.env.FOUNDATION_PREPARED_RUN_ID, preparedRunAttempt: process.env.FOUNDATION_PREPARED_RUN_ATTEMPT, preparedArtifactId: process.env.FOUNDATION_PREPARED_ARTIFACT_ID, observerRunId: process.env.GITHUB_RUN_ID, observerAttempt: process.env.GITHUB_RUN_ATTEMPT, tags: { release: readRef('non-rust-v0.9.1'), go: readRef('packages/go/v0.9.1') }, auth: { requested: true, writeObserved: true, mechanism: 'github-token' }, observedAt: new Date().toISOString() })}\n`)
          NODE
      - name: Upload tag proof
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-proof-tags-${{ github.run_id }}
          path: ${{ runner.temp }}/tag-proof.json
          if-no-files-found: error
          retention-days: 30

  go-proof:
    name: Verify public Go module and inventory
    needs: tags
    if: ${{ inputs.recovery_mode == 'disabled' && inputs.mode == 'publish' && inputs.release_set_mode == 'disabled' && needs.tags.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out approved source and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download and verify the approved bundle before Go proof
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-bundle
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.prepared_binding_artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-binding
      - name: Revalidate approved plan and sidecars for Go proof
        env:
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_ARTIFACT_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          FOUNDATION_BINDING_FILE: ${{ runner.temp }}/sdk-foundation-binding/foundation-binding.json
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: node scripts/verify-release.mjs --foundation-verify
      - name: Verify Go proxy, checksum, origin, and exact module members
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          MODULE: github.com/elsoul/erpc-sdk/packages/go
          VERSION: v0.9.1
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          FOUNDATION_SOURCE_SHA: ${{ inputs.expected_commit }}
          FOUNDATION_PLAN_SHA256: ${{ inputs.approval_plan_sha256 }}
          FOUNDATION_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/tags/packages/go/v0.9.1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_COMMIT"
          mkdir -p "$RUNNER_TEMP/go-consumer"
          printf 'module example.invalid/consumer\n\ngo 1.22\n\nrequire %s %s\n' "$MODULE" "$VERSION" > "$RUNNER_TEMP/go-consumer/go.mod"
          for attempt in 1 2 3 4 5; do
            set +e
            (cd "$RUNNER_TEMP/go-consumer" && GOMODCACHE="$RUNNER_TEMP/go-mod-cache" GOPROXY="$GOPROXY" GOSUMDB="$GOSUMDB" go mod download -json "$MODULE@$VERSION") > "$RUNNER_TEMP/go-download.json"
            download_status=$?
            set -e
            if [ "$download_status" -eq 0 ] && python - "$RUNNER_TEMP/go-download.json" <<'PY'
          import json, sys
          receipt = json.load(open(sys.argv[1], encoding='utf-8'))
          raise SystemExit(1 if receipt.get('Error') else 0)
          PY
            then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 5
          done
          mkdir -p "$RUNNER_TEMP/go-direct-consumer"
          printf 'module example.invalid/direct-consumer\n\ngo 1.22\n\nrequire %s %s\n' "$MODULE" "$VERSION" > "$RUNNER_TEMP/go-direct-consumer/go.mod"
          (cd "$RUNNER_TEMP/go-direct-consumer" && GOMODCACHE="$RUNNER_TEMP/go-direct-mod-cache" GOPROXY=direct GOSUMDB="$GOSUMDB" go mod download -json "$MODULE@$VERSION") > "$RUNNER_TEMP/go-direct-download.json"
          python - "$RUNNER_TEMP/go-download.json" "$RUNNER_TEMP/go-direct-download.json" "$RUNNER_TEMP/sdk-foundation-bundle/go-inventory.json" "$EXPECTED_COMMIT" <<'PY'
          import base64, hashlib, json, os, re, sys, zipfile
          result = json.load(open(sys.argv[1], encoding='utf-8'))
          direct = json.load(open(sys.argv[2], encoding='utf-8'))
          module = os.environ['MODULE']
          version = os.environ['VERSION']
          required = {'Path', 'Version', 'Info', 'GoMod', 'Zip', 'Dir', 'Sum', 'GoModSum', 'Origin'}
          if not isinstance(result, dict) or result.get('Error') or not required.issubset(result):
              raise SystemExit('Go tool receipt is incomplete or reports an error')
          for key in ('Path', 'Version', 'Info', 'GoMod', 'Zip', 'Dir', 'Sum', 'GoModSum'):
              if not isinstance(result.get(key), str) or not result[key]:
                  raise SystemExit(f'Go tool receipt field {key} is not a nonempty string')
          for key in ('Info', 'GoMod', 'Zip', 'Dir'):
              if not os.path.isabs(result[key]):
                  raise SystemExit(f'Go tool receipt field {key} is not an absolute path')
          if result.get('Reuse') is True:
              raise SystemExit('Go proof must come from a fresh consumer download')
          origin = result.get('Origin')
          if not isinstance(origin, dict) or set(origin) != {'VCS', 'URL', 'Hash', 'Ref', 'Subdir'}:
              raise SystemExit('Go proxy origin shape is incomplete or has unexpected fields')
          if result.get('Path') != module or result.get('Version') != version:
              raise SystemExit('Go proxy module identity/version mismatch')
          if origin.get('VCS') != 'git' or origin.get('URL') != 'https://github.com/elsoul/erpc-sdk' or origin.get('Hash') != sys.argv[4] or origin.get('Ref') != 'refs/tags/packages/go/v0.9.1' or origin.get('Subdir') != 'packages/go':
              raise SystemExit('Go proxy origin does not bind the approved tag and commit')
          direct_origin = direct.get('Origin')
          if direct.get('Error') or direct.get('Path') != module or direct.get('Version') != version or not isinstance(direct_origin, dict) or set(direct_origin) != {'VCS', 'URL', 'Hash', 'Ref', 'Subdir'}:
              raise SystemExit('Go direct origin receipt is incomplete')
          if direct_origin.get('VCS') != 'git' or direct_origin.get('URL') != 'https://github.com/elsoul/erpc-sdk' or direct_origin.get('Hash') != sys.argv[4] or direct_origin.get('Ref') != 'refs/tags/packages/go/v0.9.1' or direct_origin.get('Subdir') != 'packages/go':
              raise SystemExit('Go direct origin does not bind the approved tag and commit')
          if not re.fullmatch(r'h1:[A-Za-z0-9+/]{43}=?', result['Sum']) or not re.fullmatch(r'h1:[A-Za-z0-9+/]{43}=?', result['GoModSum']):
              raise SystemExit('Go proxy did not provide checksum receipts')
          for checksum in (result['Sum'], result['GoModSum']):
              try:
                  base64.b64decode(checksum[3:], validate=True)
              except Exception as error:
                  raise SystemExit('Go proxy checksum receipt is not valid base64') from error
          inventory = json.load(open(sys.argv[3], encoding='utf-8'))
          expected = {entry['path']: entry['sha256'] for entry in inventory['files']}
          if len(expected) != len(inventory['files']) or set(expected) != set(inventory['files'][index]['path'] for index in range(len(inventory['files']))):
              raise SystemExit('Go inventory contains duplicate paths')
          prefix = f'{module}@{version}/'
          with zipfile.ZipFile(result['Zip']) as archive:
              names = []
              for member in archive.infolist():
                  if member.is_dir(): continue
                  if '\\' in member.filename or member.filename.startswith('/') or '..' in member.filename.split('/') or not member.filename.startswith(prefix): raise SystemExit('unexpected Go zip prefix or unsafe member')
                  name = member.filename[len(prefix):]
                  if not name or name in names or '..' in name.split('/'):
                      raise SystemExit('unsafe or duplicate Go zip member')
                  names.append(name)
                  if name not in expected or hashlib.sha256(archive.read(member)).hexdigest() != expected[name]:
                      raise SystemExit(f'Go inventory mismatch for {name}')
              if set(names) != set(expected): raise SystemExit('Go zip member set mismatch')
              gomod = archive.read(prefix + 'go.mod').decode('utf-8') if prefix + 'go.mod' in archive.namelist() else ''
              if not re.search(rf'^module {re.escape(module)}$', gomod, re.MULTILINE): raise SystemExit('Go module file does not identify the approved module')
          with open('go-proof.json', 'w', encoding='utf-8') as output:
              json.dump({'schemaVersion': 1, 'registry': 'proxy.golang.org', 'repository': os.environ['EXPECTED_REPOSITORY'], 'module': result['Path'], 'version': result['Version'], 'sum': result['Sum'], 'goModSum': result['GoModSum'], 'originHash': origin['Hash'], 'originSubdir': origin['Subdir'], 'directOriginHash': direct_origin['Hash'], 'directOriginSubdir': direct_origin['Subdir'], 'zipSha256': hashlib.sha256(open(result['Zip'], 'rb').read()).hexdigest(), 'sourceCommit': os.environ['FOUNDATION_SOURCE_SHA'], 'planSha256': os.environ['FOUNDATION_PLAN_SHA256'], 'preparedRunId': os.environ['FOUNDATION_PREPARED_RUN_ID'], 'preparedRunAttempt': os.environ['FOUNDATION_PREPARED_RUN_ATTEMPT'], 'preparedArtifactId': os.environ['FOUNDATION_PREPARED_ARTIFACT_ID'], 'observerRunId': os.environ['GITHUB_RUN_ID'], 'observerAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'auth': {'requested': False, 'uploadAttempted': False}, 'observedAt': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat()}, output)
              output.write('\n')
          PY
          cat > "$RUNNER_TEMP/go-consumer/main.go" <<'GO'
          package main

          import _ "github.com/elsoul/erpc-sdk/packages/go"

          func main() {}
          GO
          (cd "$RUNNER_TEMP/go-consumer" && GOMODCACHE="$RUNNER_TEMP/go-mod-cache" GOPROXY="$GOPROXY" GOSUMDB="$GOSUMDB" go run .)
      - name: Upload Go proof
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-proof-go-${{ github.run_id }}
          path: go-proof.json
          if-no-files-found: error
          retention-days: 30

  proof-aggregate:
    name: Aggregate observed publication and source proofs
    needs:
      - publication-validation
      - npm
      - pypi
      - rubygems
      - rust-reuse
      - tags
      - go-proof
    if: ${{ inputs.recovery_mode == 'disabled' && inputs.mode == 'publish' && inputs.release_set_mode == 'disabled' && needs.publication-validation.result == 'success' && needs.npm.result == 'success' && needs.pypi.result == 'success' && needs.rubygems.result == 'success' && needs.rust-reuse.result == 'success' && needs.tags.result == 'success' && needs.go-proof.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
