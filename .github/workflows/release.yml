          for pair in npm:$NPM_ID pypi:$PYPI_ID rubygems:$RUBY_ID rust:$RUST_ID; do name="${pair%%:*}"; id="${pair#*:}"; test -n "$id"; gh api "/repos/$EXPECTED_REPOSITORY/actions/artifacts/$id" > "$RUNNER_TEMP/recovery-pretag-meta/$name.json"; done
          node --input-type=module - "$RUNNER_TEMP/recovery-pretag-meta" "$RUNNER_TEMP/recovery-pretag-receipts.json" "$RUNNER_TEMP/recovery-pretag-publishers.json" "$RUNNER_TEMP/recovery-observer-sources.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'; const [directory, output, publisherOutput, observerOutput] = process.argv.slice(2); const source = process.env.PUBLICATION_RECOVERY_SOURCE_M; const control = process.env.GITHUB_SHA; const producer = { repository: 'elsoul/erpc-sdk', repositoryId: '1429568627', workflowPath: '.github/workflows/release.yml', sourceCommit: control, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, ref: 'refs/heads/main', event: 'workflow_dispatch' }; const original = { repository: 'elsoul/erpc-sdk', repositoryId: '1429568627', workflowPath: '.github/workflows/release.yml', sourceCommit: source, runId: process.env.PUBLICATION_RECOVERY_ORIGINAL_PUBLICATION_RUN_ID, runAttempt: process.env.PUBLICATION_RECOVERY_ORIGINAL_PUBLICATION_RUN_ATTEMPT, ref: 'refs/heads/main', event: 'workflow_dispatch' }; const names = { npm: 'npm-proof.json', pypi: 'pypi-proof.json', rubygems: 'rubygems-proof.json', rust: 'rust-proof.json' }; const result = {}; for (const [key, filename] of Object.entries(names)) { const metadata = JSON.parse(readFileSync(`${directory}/${key}.json`, 'utf8')); result[filename] = { artifactId: String(metadata.id), artifactName: metadata.name, sha256: metadata.digest.slice('sha256:'.length), sizeInBytes: metadata.size_in_bytes, producer: key === 'rubygems' ? original : producer } } const pypi = JSON.parse(readFileSync(process.env.PYPI_PROOF, 'utf8')); const sources = Object.fromEntries(Object.entries(pypi.publishers ?? {}).map(([filename, publisher]) => [filename, publisher.sourceCommit])); writeFileSync(output, `${JSON.stringify(result)}\n`); writeFileSync(publisherOutput, `${JSON.stringify(sources)}\n`); writeFileSync(observerOutput, `${JSON.stringify({'rubygems-proof.json': source})}\n`)
          NODE
          exec {RECOVERY_READ_FD}<<<"$GH_TOKEN"
          export PUBLICATION_RECOVERY_CONTEXT_FILE="$CONTEXT" PUBLICATION_RECOVERY_PLAN_FILE="$PLAN" PUBLICATION_RECOVERY_RECEIPT_ARTIFACTS_FILE="$RUNNER_TEMP/recovery-pretag-receipts.json" PUBLICATION_RECOVERY_RECEIPT_FILENAMES='npm-proof.json,pypi-proof.json,rubygems-proof.json,rust-proof.json' PUBLICATION_RECOVERY_PUBLISHER_SOURCES_FILE="$RUNNER_TEMP/recovery-pretag-publishers.json" PUBLICATION_RECOVERY_OBSERVER_SOURCES_FILE="$RUNNER_TEMP/recovery-observer-sources.json" PUBLICATION_RECOVERY_READ_TOKEN_FD="$RECOVERY_READ_FD" PUBLICATION_RECOVERY_RECEIPT_WORK_DIR="$RUNNER_TEMP/recovery-pretag-work" PUBLICATION_RECOVERY_RECEIPT_OBSERVATION_FILE="$RUNNER_TEMP/recovery-pretag-observation.json" PUBLICATION_RECOVERY_OBSERVER_RUN_ID="$GITHUB_RUN_ID" PUBLICATION_RECOVERY_OBSERVER_ATTEMPT="$GITHUB_RUN_ATTEMPT"
