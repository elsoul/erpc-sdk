          PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          PREPARED_BINDING_ARTIFACT_ID: ${{ inputs.prepared_binding_artifact_id }}
          PLAN_FILE: ${{ runner.temp }}/release-set-verified/bundle/release-set-plan.json
          BINDING_FILE: ${{ runner.temp }}/release-set-verified/binding/release-set-binding.json
