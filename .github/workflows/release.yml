          RELEASE_SET_RUN_FILE="$RUNNER_TEMP/release-set-verified/evidence/run.json" \
          RELEASE_SET_ARTIFACT_METADATA_FILE="$RUNNER_TEMP/release-set-verified/evidence/bundle-metadata.json" \
          RELEASE_SET_BINDING_METADATA_FILE="$RUNNER_TEMP/release-set-verified/evidence/binding-metadata.json" \
          RELEASE_SET_ARTIFACT_DIR="$RUNNER_TEMP/release-set-verified/bundle" \
          RELEASE_SET_BINDING_DIR="$RUNNER_TEMP/release-set-verified/binding" \
          RELEASE_SET_BUNDLE_ZIP_FILE="$RUNNER_TEMP/release-set-verified/zips/bundle.zip" \
          RELEASE_SET_BINDING_ZIP_FILE="$RUNNER_TEMP/release-set-verified/zips/binding.zip" \
