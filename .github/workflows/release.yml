          const expectedNames = { 'npm-proof.json': 'release-set-npm-proof-' + runId + '-' + runAttempt, 'pypi-proof.json': 'release-set-pypi-proof-' + runId + '-' + runAttempt, 'rubygems-proof.json': 'release-set-rubygems-proof-' + runId + '-' + runAttempt, 'rust-proof.json': 'release-set-rust-proof-' + runId + '-' + runAttempt, 'tag-proof.json': 'release-set-tag-proof-' + runId + '-' + runAttempt, 'go-proof.json': 'release-set-go-proof-' + runId + '-' + runAttempt }
          const requestedIds = { 'npm-proof.json': process.env.NPM_RECEIPT_ID, 'pypi-proof.json': process.env.PYPI_RECEIPT_ID, 'rubygems-proof.json': process.env.RUBYGEMS_RECEIPT_ID, 'rust-proof.json': process.env.RUST_RECEIPT_ID, 'tag-proof.json': process.env.TAG_RECEIPT_ID, 'go-proof.json': process.env.GO_RECEIPT_ID }
