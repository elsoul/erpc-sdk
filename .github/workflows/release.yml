          import { readFileSync } from 'node:fs'; const [file, expectedRef, source] = process.argv.slice(2); const payload = JSON.parse(readFileSync(file, 'utf8')); if (payload.ref !== expectedRef || payload.object?.type !== 'commit' || payload.object?.sha !== source) throw new Error('tag reread is not bound to the reviewed source')
