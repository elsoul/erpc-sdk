  rust-reuse:
    name: Verify existing Rust receipt read-only
    needs: publication-validation
    if: ${{ inputs.mode == 'publish' && needs.publication-validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify Rust registry/download receipt without OIDC
        env:
          RELEASE_USER_AGENT: erpc-sdk-release-verification (https://github.com/elsoul/erpc-sdk)
          EXPECTED_SHA256: f2ad81528b35470b8f193dc45ad9f95e2d5ba0749b916ab9422cb07639088dd7
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/rust.json"
          set +e
          status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$response" --write-out '%{http_code}' https://crates.io/api/v1/crates/erpc-sdk/0.10.0)"
          curl_status=$?
          set -e
          test "$curl_status" -eq 0
