name: Weekly release preparation

run-name: >-
  ${{ ((github.event_name == 'workflow_run') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'reconcile')) &&
  format('erpc-release-ci-{0}-{1}-{2}-{3}',
  github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id,
  github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.ci_run_attempt,
  github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_head_sha,
  ((github.event_name == 'workflow_run' && vars.ERPC_ENABLE_AUTOMATIC_RELEASE == 'true') || (github.event_name == 'workflow_dispatch' && inputs.apply == true)) && 'apply' || 'verify') || 'Weekly release preparation' }}

on:
  schedule:
    - cron: '47 3 * * 4'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - codex/release-preparation
  workflow_dispatch:
    inputs:
      mode:
        description: Select weekly preparation or exact CI reconciliation
        required: false
        default: prepare
        type: choice
        options:
          - prepare
          - reconcile
      version:
        description: Optional stable version for an explicitly approved manual preparation
        required: false
        type: string
      release_date:
        description: Optional YYYY-MM-DD release date
        required: false
        type: string
      pr_number:
        description: Exact managed release PR number for reconciliation
        required: false
        type: number
      ci_run_id:
        description: Exact successful CI workflow run ID for reconciliation
        required: false
        type: number
      ci_run_attempt:
        description: Exact attempt for the CI workflow run
        required: false
        type: number
      expected_head_sha:
        description: Exact managed release PR head tested by CI
        required: false
        type: string
      base_sha:
        description: Frozen main commit used by the managed release PR and CI
        required: false
        type: string
      apply:
        description: Request the exact-head release reconciliation mutation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: erpc-catalog-mutation
  cancel-in-progress: false

jobs:
  reader:
    name: Inspect release preparation inputs
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      observer_exit_code: ${{ steps.classify.outputs.observer_exit_code }}
      prep_exit_code: ${{ steps.classify.outputs.prep_exit_code }}
      prep_status: ${{ steps.classify.outputs.prep_status }}
      prepare_allowed: ${{ steps.classify.outputs.prepare_allowed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Create bounded preparation directory
        env:
          OUTPUT_DIR: ${{ runner.temp }}/release-preparation
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ inputs.release_date }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          printf '%s\n' 70 > "$OUTPUT_DIR/observer-exit-code"
          printf '%s\n' 70 > "$OUTPUT_DIR/prep-exit-code"
          : > "$OUTPUT_DIR/observer.stdout"
          : > "$OUTPUT_DIR/observer.stderr"
          : > "$OUTPUT_DIR/prep.stdout"
          : > "$OUTPUT_DIR/prep.stderr"
          node --input-type=module - "$OUTPUT_DIR" "$RELEASE_VERSION" "$RELEASE_DATE" <<'NODE'
          import { writeFileSync } from 'node:fs'
          const [outputDir, version, releaseDate] = process.argv.slice(2)
          writeFileSync(`${outputDir}/release-inputs.json`, `${JSON.stringify({ version: version || null, releaseDate: releaseDate || null }, null, 2)}\n`)
          NODE
      - name: Observe configured sources for the preparation review
        id: observe
        continue-on-error: true
        env:
          ERPC_OBSERVER_SOURCE_SHA: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/release-preparation/observation
        run: |
          set +e
          mkdir -p "$OUTPUT_DIR"
          node registry/observe-token-catalog.mjs --output-dir "$OUTPUT_DIR" \
            > "$OUTPUT_DIR/observer.stdout" \
            2> "$OUTPUT_DIR/observer.stderr"
          observer_status=$?
          printf '%s\n' "$observer_status" > "$RUNNER_TEMP/release-preparation/observer-exit-code"
          exit "$observer_status"
      - name: Inspect the approved release plan
        id: inspect-release
        continue-on-error: true
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ inputs.release_date }}
          OUTPUT_DIR: ${{ runner.temp }}/release-preparation
        run: |
          set +e
          prep_args=(inspect --expected-head "$EXPECTED_SOURCE_SHA" --format=json)
          if [ -n "$RELEASE_VERSION" ]; then prep_args+=(--version "$RELEASE_VERSION"); fi
          if [ -n "$RELEASE_DATE" ]; then prep_args+=(--release-date "$RELEASE_DATE"); fi
          node registry/release-prep.mjs "${prep_args[@]}" \
            > "$OUTPUT_DIR/release-report.json" \
            2> "$OUTPUT_DIR/prep.stderr"
          prep_status=$?
          printf '%s\n' "$prep_status" > "$OUTPUT_DIR/prep-exit-code"
          exit "$prep_status"
      - name: Bound diagnostics and assemble the same-run observation envelope
        if: always()
        continue-on-error: true
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/release-preparation
        run: |
          set +e
          for output_file in "$OUTPUT_DIR/observation/observer.stdout" "$OUTPUT_DIR/observation/observer.stderr" "$OUTPUT_DIR/prep.stdout" "$OUTPUT_DIR/prep.stderr"; do
            if [ -f "$output_file" ] && [ "$(wc -c < "$output_file")" -gt 65536 ]; then
              head -c 65536 "$output_file" > "$output_file.truncated"
              mv "$output_file.truncated" "$output_file"
            fi
          done
          if [ -f "$OUTPUT_DIR/release-report.json" ] && [ "$(wc -c < "$OUTPUT_DIR/release-report.json")" -gt 262144 ]; then
            head -c 262144 "$OUTPUT_DIR/release-report.json" > "$OUTPUT_DIR/release-report.json.truncated"
            mv "$OUTPUT_DIR/release-report.json.truncated" "$OUTPUT_DIR/release-report.json"
          fi
          if [ -f "$OUTPUT_DIR/observation/receipts.json" ] && [ -f "$OUTPUT_DIR/observation/findings.json" ] && [ -f "$OUTPUT_DIR/observation/review-candidate.json" ]; then
            node --input-type=module - "$OUTPUT_DIR" "$EXPECTED_SOURCE_SHA" <<'NODE'
            import { readFileSync, writeFileSync } from 'node:fs'
            import { join } from 'node:path'

            const [outputDir, expectedSourceSha] = process.argv.slice(2)
            const observationDir = join(outputDir, 'observation')
            const readJson = (dir, name) => JSON.parse(readFileSync(join(dir, name), 'utf8'))
            const receipts = readJson(observationDir, 'receipts.json')
            const findings = readJson(observationDir, 'findings.json')
            const reviewCandidate = readJson(observationDir, 'review-candidate.json')
            const sha = /^[0-9a-f]{40}$/u
            const digest = /^[0-9a-f]{64}$/u
            if (!sha.test(expectedSourceSha) || receipts.sourceSha !== expectedSourceSha) throw new Error('observation source SHA is not bound to the event SHA')
            if (!digest.test(receipts.catalogDigest) || !digest.test(receipts.configDigest)) throw new Error('observation digests are invalid')
            if (findings.catalogDigest !== receipts.catalogDigest || findings.configDigest !== receipts.configDigest) throw new Error('findings are not bound to receipts')
            if (reviewCandidate.sourceSha !== expectedSourceSha || reviewCandidate.catalogDigest !== receipts.catalogDigest || reviewCandidate.configDigest !== receipts.configDigest) throw new Error('review candidate is not bound to receipts')
            const envelope = {
              receipts,
              findings,
              reviewCandidate,
            }
            writeFileSync(join(outputDir, 'observation-envelope.json'), `${JSON.stringify(envelope, null, 2)}\n`)
            NODE
          fi
          exit 0
      - name: Upload bounded preparation diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: weekly-release-preparation
          path: ${{ runner.temp }}/release-preparation
          if-no-files-found: error
          retention-days: 14
      - name: Classify preparation result
        id: classify
        if: always()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/release-preparation
        run: |
          set -euo pipefail
          observer_status="$(tr -d '\r\n' < "$OUTPUT_DIR/observer-exit-code")"
          prep_exit_code="$(tr -d '\r\n' < "$OUTPUT_DIR/prep-exit-code")"
          prep_status="INVALID_INPUT"
          prepare_allowed="false"
          if [ -s "$OUTPUT_DIR/release-report.json" ]; then
            classification_file="$OUTPUT_DIR/release-classification"
            if ! node --input-type=module - "$OUTPUT_DIR/release-report.json" <<'NODE' > "$classification_file"
            import { readFileSync } from 'node:fs'
            const report = JSON.parse(readFileSync(process.argv[2], 'utf8'))
            if (typeof report.prepareAllowed !== 'boolean') throw new Error('release report prepareAllowed must be a boolean')
            console.log(`status=${report.status ?? 'INVALID_INPUT'}`)
            console.log(`prepare_allowed=${report.prepareAllowed ? 'true' : 'false'}`)
            NODE
            then
              echo "release report preparation decision is missing or invalid" >&2
              exit 64
            fi
            while IFS='=' read -r key value; do
              case "$key" in
                status) prep_status="$value" ;;
                prepare_allowed) prepare_allowed="$value" ;;
              esac
            done < "$classification_file"
          fi
          echo "observer_exit_code=$observer_status" >> "$GITHUB_OUTPUT"
          echo "prep_exit_code=$prep_exit_code" >> "$GITHUB_OUTPUT"
          echo "prep_status=$prep_status" >> "$GITHUB_OUTPUT"
          case "$prepare_allowed" in
            true|false) ;;
            *)
              echo "release report preparation decision is missing or invalid" >&2
              exit 64
              ;;
          esac
          echo "prepare_allowed=$prepare_allowed" >> "$GITHUB_OUTPUT"
          if [ "$observer_status" != 0 ] && [ "$observer_status" != 2 ] && [ "$observer_status" != 3 ]; then exit "$observer_status"; fi
          if [ "$prep_exit_code" != 0 ]; then exit "$prep_exit_code"; fi

  writer:
    name: Prepare and write the release PR
    needs: reader
    if: >-
      needs.reader.result == 'success' &&
      needs.reader.outputs.prepare_allowed == 'true' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Download same-run preparation evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: weekly-release-preparation
          path: ${{ runner.temp }}/release-preparation
      - name: Verify writer checkout and same-run bindings
        id: binding
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/release-preparation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          node --input-type=module - "$OUTPUT_DIR/observation-envelope.json" "$OUTPUT_DIR/release-report.json" "$EXPECTED_SOURCE_SHA" <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs'
          const [observationFile, releaseFile, expectedSourceSha] = process.argv.slice(2)
          const observation = JSON.parse(readFileSync(observationFile, 'utf8'))
          const release = JSON.parse(readFileSync(releaseFile, 'utf8'))
          if (!observation.receipts || observation.receipts.sourceSha !== expectedSourceSha) throw new Error('observation source binding is invalid')
          const observationReceipts = observation.receipts
          if (release.expectedHead !== expectedSourceSha) throw new Error('release report source binding is invalid')
          if (!/^[0-9a-f]{64}$/u.test(observationReceipts.catalogDigest)) throw new Error('catalog digest is invalid')
          if (!/^[0-9a-f]{64}$/u.test(observationReceipts.configDigest)) throw new Error('config digest is invalid')
          console.log(`source_sha=${observationReceipts.sourceSha}`)
          console.log(`catalog_digest=${observationReceipts.catalogDigest}`)
          console.log(`config_digest=${observationReceipts.configDigest}`)
          NODE
      - name: Prepare the allowlisted version and changelog files
        id: prepare
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.binding.outputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ inputs.release_date }}
          OUTPUT_DIR: ${{ runner.temp }}/release-preparation
        run: |
          set -euo pipefail
          prep_args=(prepare --expected-head "$EXPECTED_SOURCE_SHA" --format=json)
          if [ -n "$RELEASE_VERSION" ]; then prep_args+=(--version "$RELEASE_VERSION"); fi
          if [ -n "$RELEASE_DATE" ]; then prep_args+=(--release-date "$RELEASE_DATE"); fi
          node registry/release-prep.mjs "${prep_args[@]}" \
            > "$OUTPUT_DIR/prepared-release-report.json"
      - name: Validate and write the reviewable release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVATION_FILE: ${{ runner.temp }}/release-preparation/observation-envelope.json
          RELEASE_FILE: ${{ runner.temp }}/release-preparation/prepared-release-report.json
          SOURCE_SHA: ${{ steps.binding.outputs.source_sha }}
          CATALOG_DIGEST: ${{ steps.binding.outputs.catalog_digest }}
          CONFIG_DIGEST: ${{ steps.binding.outputs.config_digest }}
        run: |
          set -euo pipefail
          writer_args=(
            --observation "$OBSERVATION_FILE"
            --release "$RELEASE_FILE"
            --base-sha "$SOURCE_SHA"
            --source-sha "$SOURCE_SHA"
            --catalog-digest "$CATALOG_DIGEST"
            --write
            --format=json
          )
          if [ -n "$CONFIG_DIGEST" ]; then
            writer_args+=(--config-digest "$CONFIG_DIGEST")
          fi
          node registry/maintenance-pr.mjs "${writer_args[@]}"

  reconciliation-binding:
    name: Verify exact release CI reconciliation binding
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'codex/release-preparation' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'reconcile')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify immutable trusted-main checkout
        env:
          EXPECTED_CONTROLLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER_SHA"
          test "$(git rev-parse --abbrev-ref HEAD)" = HEAD
          test -z "$(git status --porcelain)"
      - name: Download exact CI source binding for reconciliation
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ci-source-binding-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_head_sha }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.ci_run_attempt }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-reconciliation-binding
      - name: Fetch exact reconciliation CI and PR records
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}
          RUN_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.ci_run_attempt }}
          EXPECTED_HEAD: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_head_sha }}
          PR_NUMBER: ${{ github.event_name == 'workflow_run' && '' || inputs.pr_number }}
          BASE_SHA: ${{ github.event_name == 'workflow_run' && '' || inputs.base_sha }}
          OUTPUT_DIR: ${{ runner.temp }}/release-reconciliation-binding
        run: |
          set -euo pipefail
          gh api "/repos/$REPOSITORY/actions/runs/$RUN_ID" --header 'X-GitHub-Api-Version: 2026-03-10' > "$OUTPUT_DIR/ci-run.json"
          gh api "/repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --header 'X-GitHub-Api-Version: 2026-03-10' > "$OUTPUT_DIR/ci-jobs.json"
          gh pr list --repo "$REPOSITORY" --head codex/release-preparation --base main --state open --limit 20 --json number,headRefOid,baseRefOid,headRepository,isCrossRepository,body,state,mergedAt > "$OUTPUT_DIR/release-prs.json"
          node --input-type=module - "$OUTPUT_DIR/source-binding.json" "$OUTPUT_DIR/ci-provenance.json" "$OUTPUT_DIR/ci-run.json" "$OUTPUT_DIR/ci-jobs.json" "$OUTPUT_DIR/release-prs.json" "$REPOSITORY" "$RUN_ID" "$RUN_ATTEMPT" "$EXPECTED_HEAD" "$PR_NUMBER" "$BASE_SHA" "$OUTPUT_DIR/reconciliation-binding.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const [bindingFile, provenanceFile, runFile, jobsFile, prsFile, repository, runIdText, attemptText, expectedHead, prNumberText, inputBase, outputFile] = process.argv.slice(2)
          const binding = JSON.parse(readFileSync(bindingFile, 'utf8'))
          const provenance = JSON.parse(readFileSync(provenanceFile, 'utf8'))
          const run = JSON.parse(readFileSync(runFile, 'utf8'))
          const jobs = JSON.parse(readFileSync(jobsFile, 'utf8'))?.jobs ?? []
          const prs = JSON.parse(readFileSync(prsFile, 'utf8'))
          const runId = Number(runIdText)
          const runAttempt = Number(attemptText)
          const inputPrNumber = prNumberText === '' ? null : Number(prNumberText)
          const expectedBase = inputBase === '' ? binding.baseSha : inputBase
          const sha = /^[0-9a-f]{40}$/u
          const repositoryName = (value) => value?.nameWithOwner ?? value?.fullName ?? value?.full_name ?? null
          if (!Number.isSafeInteger(runId) || runId < 1 || !Number.isSafeInteger(runAttempt) || runAttempt < 1 || !sha.test(expectedHead) || !sha.test(expectedBase) || expectedHead === expectedBase) throw new Error('release reconciliation tuple is invalid')
          if (inputPrNumber !== null && (!Number.isSafeInteger(inputPrNumber) || inputPrNumber < 1)) throw new Error('release reconciliation PR number is invalid')
          if (binding.kind !== 'erpc-sdk-ci-source-binding' || binding.testedHeadSha !== expectedHead || binding.headSha !== expectedHead || binding.baseSha !== expectedBase || binding.workflowPath !== '.github/workflows/ci.yml' || binding.event !== 'workflow_dispatch' || binding.ref !== 'refs/heads/codex/release-preparation' || Number(binding.runId) !== runId || Number(binding.runAttempt) !== runAttempt) throw new Error('downloaded CI source binding is not exact')
          if (provenance.kind !== 'erpc-sdk-ci-provenance' || provenance.headSha !== expectedHead || provenance.testedHeadSha !== expectedHead || provenance.sourceSha !== expectedHead || provenance.baseSha !== expectedBase || provenance.workflowPath !== '.github/workflows/ci.yml' || provenance.event !== 'workflow_dispatch' || provenance.ref !== 'refs/heads/codex/release-preparation' || Number(provenance.runId) !== runId || Number(provenance.runAttempt) !== runAttempt) throw new Error('downloaded CI provenance is not exact')
          if (String(run.id) !== String(runId) || Number(run.run_attempt) !== runAttempt || run.status !== 'completed' || run.conclusion !== 'success' || run.event !== 'workflow_dispatch' || run.path !== '.github/workflows/ci.yml' || run.head_sha !== expectedHead || run.head_branch !== 'codex/release-preparation' || repositoryName(run.repository) !== repository || repositoryName(run.head_repository) !== repository) throw new Error('release CI API run is not the exact successful same-repository run')
          if (!jobs.some((job) => job.name === 'required-ci' && job.status === 'completed' && job.conclusion === 'success')) throw new Error('release CI run lacks a successful required-ci job')
          if (!Array.isArray(prs)) throw new Error('managed release PR query did not return an array')
          const matches = prs.filter((pr) => (inputPrNumber === null || Number(pr.number) === inputPrNumber) && pr.headRefOid === expectedHead && pr.baseRefOid === expectedBase && repositoryName(pr.headRepository) === repository && pr.isCrossRepository !== true && String(pr.state).toLowerCase() === 'open' && pr.mergedAt === null)
          if (matches.length !== 1) throw new Error('exactly one open same-repository release PR must bind this CI head/base')
          const pr = matches[0]
          if (!String(pr.body ?? '').includes('Branch: `codex/release-preparation`') || !String(pr.body ?? '').includes('Release preparation:')) throw new Error('managed release PR metadata is missing or stale')
          const result = {
            schemaVersion: 1,
            kind: 'erpc-sdk-release-reconciliation-binding',
            repository,
            branch: 'codex/release-preparation',
            workflowPath: '.github/workflows/ci.yml',
            prNumber: Number(pr.number),
            runId,
            runAttempt,
            expectedHead,
            baseSha: expectedBase,
            sourceBinding: binding,
            provenance,
            ciRun: { id: run.id, runAttempt: Number(run.run_attempt), status: run.status, conclusion: run.conclusion, event: run.event, path: run.path, headSha: run.head_sha, headBranch: run.head_branch, repository: repositoryName(run.repository) },
            requiredJobs: jobs.filter((job) => job.name === 'required-ci').map((job) => ({ name: job.name, status: job.status, conclusion: job.conclusion })),
            pullRequest: { number: Number(pr.number), headSha: pr.headRefOid, baseSha: pr.baseRefOid, headRepository: repositoryName(pr.headRepository), state: pr.state, mergedAt: pr.mergedAt },
          }
          writeFileSync(outputFile, `${JSON.stringify(result, null, 2)}\n`, { flag: 'w' })
          NODE
      - name: Upload exact read-only reconciliation binding
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-reconciliation-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-reconciliation-binding/source-binding.json
            ${{ runner.temp }}/release-reconciliation-binding/ci-provenance.json
            ${{ runner.temp }}/release-reconciliation-binding/reconciliation-binding.json
          if-no-files-found: warn
          retention-days: 14

  automatic-release-controller:
    name: Merge eligible data patch, tag atomically, and dispatch release
    needs:
      - reconciliation-binding
    if: >-
      always() &&
      vars.ERPC_ENABLE_AUTOMATIC_RELEASE == 'true' &&
      ((github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'codex/release-preparation' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.repository.full_name == github.repository &&
      needs.reconciliation-binding.result == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'reconcile' &&
      inputs.apply == true &&
      needs.reconciliation-binding.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify immutable trusted-main controller checkout
        env:
          EXPECTED_CONTROLLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER_SHA"
          test "$(git rev-parse --abbrev-ref HEAD)" = HEAD
          test -z "$(git status --porcelain)"
      - name: Download exact release-preparation CI source binding
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ci-source-binding-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_head_sha }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.ci_run_attempt }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-ci-binding
      - name: Resolve exact managed release PR and CI provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}
          RUN_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.ci_run_attempt }}
          EXPECTED_HEAD: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_head_sha }}
          INPUT_PR_NUMBER: ${{ github.event_name == 'workflow_run' && '' || inputs.pr_number }}
          INPUT_BASE_SHA: ${{ github.event_name == 'workflow_run' && '' || inputs.base_sha }}
          BINDING_DIR: ${{ runner.temp }}/release-ci-binding
          OUTPUT_FILE: ${{ runner.temp }}/release-binding.json
        run: |
          set -euo pipefail
          gh api "/repos/$REPOSITORY/actions/runs/$RUN_ID" --header 'X-GitHub-Api-Version: 2026-03-10' > "$RUNNER_TEMP/release-ci-run.json"
          gh api "/repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --header 'X-GitHub-Api-Version: 2026-03-10' > "$RUNNER_TEMP/release-ci-jobs.json"
          gh pr list --repo "$REPOSITORY" --head codex/release-preparation --base main --state open --limit 20 --json number,headRefOid,baseRefOid,headRepository,isCrossRepository,body,state,mergedAt > "$RUNNER_TEMP/release-prs.json"
          node --input-type=module - "$BINDING_DIR/source-binding.json" "$BINDING_DIR/ci-provenance.json" "$RUNNER_TEMP/release-ci-run.json" "$RUNNER_TEMP/release-ci-jobs.json" "$RUNNER_TEMP/release-prs.json" "$REPOSITORY" "$EVENT_NAME" "$RUN_ID" "$RUN_ATTEMPT" "$EXPECTED_HEAD" "$INPUT_PR_NUMBER" "$INPUT_BASE_SHA" "$OUTPUT_FILE" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const [bindingFile, provenanceFile, runFile, jobsFile, prsFile, repository, eventName, runIdText, attemptText, expectedHead, prNumberText, inputBase, outputFile] = process.argv.slice(2)
          const binding = JSON.parse(readFileSync(bindingFile, 'utf8'))
          const provenance = JSON.parse(readFileSync(provenanceFile, 'utf8'))
          const run = JSON.parse(readFileSync(runFile, 'utf8'))
          const jobs = JSON.parse(readFileSync(jobsFile, 'utf8'))?.jobs ?? []
          const prs = JSON.parse(readFileSync(prsFile, 'utf8'))
          const runId = Number(runIdText)
          const runAttempt = Number(attemptText)
          const inputPrNumber = prNumberText === '' ? null : Number(prNumberText)
          const expectedBase = inputBase === '' ? binding.baseSha : inputBase
          const sha = /^[0-9a-f]{40}$/u
          const releasePaths = [
            'packages/typescript/package.json',
            'packages/rust/Cargo.toml',
            'packages/python/pyproject.toml',
            'packages/python/src/erpc_sdk/__init__.py',
            'packages/ruby/lib/erpc_sdk/version.rb',
            'Cargo.lock',
            'CHANGELOG.md',
          ].sort()
          const repoName = (value) => value?.nameWithOwner ?? value?.fullName ?? value?.full_name ?? null
          if ((eventName !== 'workflow_run' && eventName !== 'workflow_dispatch') || !sha.test(expectedHead) || !sha.test(expectedBase) || expectedHead === expectedBase || !Number.isSafeInteger(runId) || runId < 1 || !Number.isSafeInteger(runAttempt) || runAttempt < 1) throw new Error('release CI binding inputs are invalid')
          if (inputPrNumber !== null && (!Number.isSafeInteger(inputPrNumber) || inputPrNumber < 1)) throw new Error('release reconciliation PR number is invalid')
          if (binding.kind !== 'erpc-sdk-ci-source-binding' || binding.testedHeadSha !== expectedHead || binding.headSha !== expectedHead || binding.baseSha !== expectedBase || binding.workflowPath !== '.github/workflows/ci.yml' || binding.event !== 'workflow_dispatch' || binding.ref !== 'refs/heads/codex/release-preparation' || Number(binding.runId) !== runId || Number(binding.runAttempt) !== runAttempt) throw new Error('release CI source binding is not exact')
          if (provenance.kind !== 'erpc-sdk-ci-provenance' || provenance.headSha !== expectedHead || provenance.testedHeadSha !== expectedHead || provenance.sourceSha !== expectedHead || provenance.baseSha !== expectedBase || provenance.workflowPath !== '.github/workflows/ci.yml' || provenance.event !== 'workflow_dispatch' || provenance.ref !== 'refs/heads/codex/release-preparation' || Number(provenance.runId) !== runId || Number(provenance.runAttempt) !== runAttempt) throw new Error('release CI provenance is not exact')
          if (String(run.id) !== String(runId) || Number(run.run_attempt) !== runAttempt || run.status !== 'completed' || run.conclusion !== 'success' || run.event !== 'workflow_dispatch' || run.path !== '.github/workflows/ci.yml' || run.head_sha !== expectedHead || run.head_branch !== 'codex/release-preparation' || repoName(run.repository) !== repository || repoName(run.head_repository) !== repository) throw new Error('release CI API run is not the exact successful same-repository run')
          if (!jobs.some((job) => job.name === 'required-ci' && job.status === 'completed' && job.conclusion === 'success')) throw new Error('release CI run lacks a successful required-ci job')
          if (!Array.isArray(prs)) throw new Error('managed release PR query did not return an array')
          const matches = prs.filter((pr) => (inputPrNumber === null || Number(pr.number) === inputPrNumber) && pr.headRefOid === expectedHead && pr.baseRefOid === expectedBase && repoName(pr.headRepository) === repository && pr.isCrossRepository !== true && String(pr.state).toLowerCase() === 'open' && pr.mergedAt === null)
          if (matches.length !== 1) throw new Error('exactly one open same-repository release PR must bind this CI head')
          const pr = matches[0]
          if (!String(pr.body ?? '').includes('Branch: `codex/release-preparation`') || !String(pr.body ?? '').includes('Release preparation:')) throw new Error('managed release PR metadata is missing or stale')
          writeFileSync(outputFile, `${JSON.stringify({ schemaVersion: 1, kind: 'erpc-sdk-release-controller-binding', repository, branch: 'codex/release-preparation', workflowPath: '.github/workflows/ci.yml', prNumber: Number(pr.number), runId, runAttempt, expectedHead, baseSha: expectedBase, releasePaths }, null, 2)}\n`, { flag: 'w' })
          NODE
      - name: Verify the exact seven-file release candidate against the published paired baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BINDING_FILE: ${{ runner.temp }}/release-binding.json
          RELEASE_REPORT: ${{ runner.temp }}/release-prep-report.json
          HEAD_WORKTREE: ${{ runner.temp }}/release-head
        run: |
          set -euo pipefail
          node --input-type=module - "$BINDING_FILE" "$RELEASE_REPORT" "$HEAD_WORKTREE" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { spawnSync } from 'node:child_process'
          const [bindingFile, reportFile, worktree] = process.argv.slice(2)
          const binding = JSON.parse(readFileSync(bindingFile, 'utf8'))
          const run = (command, args, cwd = process.cwd()) => {
            const result = spawnSync(command, args, { cwd, encoding: 'utf8', stdio: 'pipe' })
            if (result.error || result.status !== 0) {
              const status = result.error ? 'spawn-error' : `exit-${result.status ?? 'unknown'}`
              throw new Error(`release-candidate command failed (${status})`)
            }
            return result.stdout.trim()
          }
          const expected = binding.releasePaths
          run('git', ['fetch', '--no-tags', 'origin', 'refs/heads/codex/release-preparation:refs/remotes/origin/codex/release-preparation'])
          if (run('git', ['rev-parse', 'refs/remotes/origin/codex/release-preparation']) !== binding.expectedHead) throw new Error('release branch moved after the exact CI run; refusing stale release preparation')
          const changed = run('git', ['diff', '--name-only', `${binding.baseSha}...${binding.expectedHead}`, '--']).split(/\r?\n/u).filter(Boolean).sort()
          if (changed.join('\0') !== expected.join('\0')) throw new Error('release PR changed paths are not exactly the seven version/changelog files')
          run('git', ['worktree', 'add', '--detach', worktree, binding.expectedHead])
          try {
            const report = JSON.parse(run(process.execPath, ['registry/release-prep.mjs', 'inspect', '--root', worktree, '--expected-head', binding.expectedHead, '--format=json']))
            if (!report.latestActualPairedTag?.paired || !report.releasedBaseline?.peelCommit || report.status !== 'PREPARED_UNPUBLISHED' || typeof report.selectedVersion !== 'string') throw new Error('release candidate is not an unpublished candidate from a verified paired baseline')
            const [major, minor, patch] = report.releasedBaseline.version.split('.').map(Number)
            const expectedVersion = `${major}.${minor}.${patch + 1}`
            if (report.selectedVersion !== expectedVersion) throw new Error('release candidate is not the next patch version after the published paired baseline')
            const read = (path) => readFileSync(`${worktree}/${path}`, 'utf8')
            const versions = [
              JSON.parse(read('packages/typescript/package.json')).version,
              read('packages/rust/Cargo.toml').match(/^\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/mu)?.[1],
              read('packages/python/pyproject.toml').match(/^\[project\][\s\S]*?^version\s*=\s*"([^"]+)"/mu)?.[1],
              read('packages/python/src/erpc_sdk/__init__.py').match(/^__version__\s*=\s*"([^"]+)"$/mu)?.[1],
              read('packages/ruby/lib/erpc_sdk/version.rb').match(/^\s*VERSION\s*=\s*"([^"]+)"$/mu)?.[1],
            ]
            if (versions.some((version) => version !== report.selectedVersion)) throw new Error('release version files are not anchored to the selected next patch version')
            const lockBlocks = read('Cargo.lock').split(/^\[\[package\]\]\s*$/mu).slice(1).filter((block) => /^name\s*=\s*"erpc-sdk"\s*$/mu.test(block) && !/^source\s*=/mu.test(block))
            if (lockBlocks.length !== 1 || lockBlocks[0].match(/^version\s*=\s*"([^"]+)"$/mu)?.[1] !== report.selectedVersion) throw new Error('Cargo.lock has no unique anchored source-less erpc-sdk version')
            const escaped = report.selectedVersion.replace(/[.*+?^${}()|[\]\\]/gu, '\\$&')
            if (!new RegExp(`^##\\s+${escaped}\\s+[—-]\\s+\\d{4}-\\d{2}-\\d{2}\\s*$`, 'mu').test(read('CHANGELOG.md'))) throw new Error('CHANGELOG.md lacks the anchored selected release section')
            writeFileSync(reportFile, `${JSON.stringify({ ...report, controller: { baseSha: binding.baseSha, expectedHead: binding.expectedHead, prNumber: binding.prNumber, runId: binding.runId, runAttempt: binding.runAttempt, releasePaths: expected } }, null, 2)}\n`, { flag: 'w' })
          } finally {
            const removed = spawnSync('git', ['worktree', 'remove', '--force', worktree], { encoding: 'utf8', stdio: 'pipe' })
            if (removed.error || removed.status !== 0) throw new Error(`release candidate worktree cleanup failed: ${removed.stderr?.trim() || removed.error?.message || removed.status}`)
          }
          NODE
      - name: Resolve the exact successful publication evidence for the baseline pair
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_REPORT: ${{ runner.temp }}/release-prep-report.json
        run: |
          set -euo pipefail
          gh api "/repos/$REPOSITORY/actions/workflows/release.yml/runs?per_page=100" --header 'X-GitHub-Api-Version: 2026-03-10' > "$RUNNER_TEMP/release-workflow-runs.json"
          node --input-type=module - "$RELEASE_REPORT" "$RUNNER_TEMP/release-workflow-runs.json" "$REPOSITORY" <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs'
          import { spawnSync } from 'node:child_process'

          const [reportFile, runsFile, repository] = process.argv.slice(2)
          const report = JSON.parse(readFileSync(reportFile, 'utf8'))
          const runs = JSON.parse(readFileSync(runsFile, 'utf8'))?.workflow_runs ?? []
          const rootTag = report.latestActualPairedTag?.rootTag ?? (report.releasedBaseline?.version ? `v${report.releasedBaseline.version}` : null)
          const rootPeel = report.latestActualPairedTag?.rootPeel ?? report.releasedBaseline?.peelCommit
          if (!rootTag || !/^[0-9a-f]{40}$/u.test(rootPeel ?? '')) throw new Error('release report has no verified published paired baseline')
          const candidates = runs.filter((run) => run.status === 'completed' && run.conclusion === 'success' && ['push', 'workflow_dispatch'].includes(run.event) && run.head_sha === rootPeel && (run.repository?.full_name ?? run.repository?.fullName) === repository && Number.isSafeInteger(Number(run.run_attempt)) && Number(run.run_attempt) > 0).sort((left, right) => Number(right.id) - Number(left.id))
          for (const run of candidates) {
            const details = spawnSync('gh', ['api', `/repos/${repository}/actions/runs/${Number(run.id)}`, '--header', 'X-GitHub-Api-Version: 2026-03-10'], { encoding: 'utf8', stdio: 'pipe' })
            if (details.error || details.status !== 0) throw new Error(`baseline release run lookup failed: ${details.stderr?.trim() || details.error?.message || details.status}`)
            const detail = JSON.parse(details.stdout)
            if (detail.path !== '.github/workflows/release.yml' || detail.status !== 'completed' || detail.conclusion !== 'success' || (detail.repository?.full_name ?? detail.repository?.fullName) !== repository) continue
            const artifactName = `release-publication-evidence-${rootTag}-${Number(run.id)}-${Number(run.run_attempt)}`
            const artifacts = spawnSync('gh', ['api', `/repos/${repository}/actions/runs/${Number(run.id)}/artifacts?per_page=100`, '--header', 'X-GitHub-Api-Version: 2026-03-10'], { encoding: 'utf8', stdio: 'pipe' })
            if (artifacts.error || artifacts.status !== 0) throw new Error(`baseline release artifact lookup failed: ${artifacts.stderr?.trim() || artifacts.error?.message || artifacts.status}`)
            const list = JSON.parse(artifacts.stdout)?.artifacts ?? []
            const exact = list.find((entry) => entry?.name === artifactName && entry?.expired !== true && Number(entry?.workflow_run?.id ?? entry?.workflowRun?.id ?? entry?.workflow_run_id) === Number(run.id))
            if (exact) {
              console.log(`root_tag=${rootTag}`)
              console.log(`root_peel=${rootPeel}`)
              console.log(`run_id=${run.id}`)
              console.log(`run_attempt=${run.run_attempt}`)
              console.log(`artifact_name=${artifactName}`)
              process.exit(0)
            }
          }
          throw new Error(`no exact publication evidence artifact exists for ${rootTag} at ${rootPeel}`)
          NODE
      - name: Download exact published baseline evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published-baseline
      - name: Apply the trusted public compatibility and patch-release gate
        env:
          BINDING_FILE: ${{ runner.temp }}/release-binding.json
          RELEASE_REPORT: ${{ runner.temp }}/release-prep-report.json
          EVIDENCE_FILE: ${{ runner.temp }}/published-baseline/release-evidence.json
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_FILE"
          node --input-type=module - "$BINDING_FILE" "$RELEASE_REPORT" "$EVIDENCE_FILE" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { verifyPublicCompatibility } from './registry/verify-public-compatibility.mjs'

          const [bindingFile, reportFile, evidenceFile] = process.argv.slice(2)
          const binding = JSON.parse(readFileSync(bindingFile, 'utf8'))
          const report = JSON.parse(readFileSync(reportFile, 'utf8'))
          const evidence = JSON.parse(readFileSync(evidenceFile, 'utf8'))
          const releasedTag = report.latestActualPairedTag?.rootTag ?? `v${report.releasedBaseline?.version}`
          if (evidence.kind !== 'erpc-sdk-release-publication-evidence' || evidence.verified !== true || evidence.rootTag !== releasedTag || evidence.goTag !== `packages/go/${releasedTag}` || evidence.peelCommit !== report.releasedBaseline?.peelCommit) throw new Error('published baseline evidence is not the exact paired tag publication record')
          const compatibility = verifyPublicCompatibility({ root: process.cwd(), baseSha: binding.baseSha, headSha: binding.expectedHead, releasedTag, releaseEvidence: evidence })
          if (!compatibility.autoPatchReleaseEligible || !compatibility.releaseCheck?.eligible || compatibility.publishedUnexpectedPaths?.length !== 0) throw new Error(`automatic data patch release eligibility failed: ${compatibility.reasons?.join('; ') || compatibility.status}`)
          if (compatibility.releaseCheck.headVersion !== report.selectedVersion) throw new Error('compatibility gate and release-prep selected different versions')
          writeFileSync(reportFile, `${JSON.stringify({ ...report, compatibility }, null, 2)}\n`, { flag: 'w' })
          NODE
      - name: Exact-head merge, atomic paired tags, and explicit root-tag release dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BINDING_FILE: ${{ runner.temp }}/release-binding.json
          RELEASE_REPORT: ${{ runner.temp }}/release-prep-report.json
          RESULT_FILE: ${{ runner.temp }}/automatic-release-result.json
        run: |
          set -euo pipefail
          node --input-type=module - "$BINDING_FILE" "$RELEASE_REPORT" "$REPOSITORY" "$RESULT_FILE" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { spawnSync } from 'node:child_process'
          import { createGhAdapter } from './registry/maintenance-pr.mjs'
          import { verifyMergedCandidate } from './registry/data-promotion.mjs'

          const [bindingFile, reportFile, repository, resultFile] = process.argv.slice(2)
          const binding = JSON.parse(readFileSync(bindingFile, 'utf8'))
          const report = JSON.parse(readFileSync(reportFile, 'utf8'))
          const runCommand = (command, args, options = {}) => {
            const result = spawnSync(command, args, { encoding: 'utf8', stdio: 'pipe', ...options })
            if (result.error || result.status !== 0) {
              const status = result.error ? 'spawn-error' : `exit-${result.status ?? 'unknown'}`
              throw new Error(`release-controller command failed (${status})`)
            }
            return result.stdout.trim()
          }
          const adapter = createGhAdapter({ repo: repository })
          const pull = await adapter.getPullRequest(binding.prNumber)
          const prHead = pull.head?.sha ?? pull.headSha ?? pull.head_sha
          const prBase = pull.base?.sha ?? pull.baseSha ?? pull.base_sha
          const prHeadRef = pull.head?.ref ?? pull.headRef ?? pull.head_ref
          const prBaseRef = pull.base?.ref ?? pull.baseRef ?? pull.base_ref
          const prHeadRepo = pull.head?.repo?.full_name ?? pull.head?.repo?.fullName ?? pull.headRepo
          const prBaseRepo = pull.base?.repo?.full_name ?? pull.base?.repo?.fullName ?? pull.baseRepo
          if (prHead !== binding.expectedHead || prBase !== binding.baseSha || prHeadRef !== binding.branch || prBaseRef !== 'main' || prHeadRepo !== repository || prBaseRepo !== repository || String(pull.state).toLowerCase() !== 'open' || pull.merged === true) throw new Error('release PR changed or is no longer an exact open same-repository candidate')
          const changedPaths = (await adapter.getChangedPaths(binding.branch, { baseSha: binding.baseSha, headSha: binding.expectedHead })).sort()
          if (changedPaths.join('\0') !== binding.releasePaths.join('\0')) throw new Error('release PR changed paths no longer match the exact seven-file allowlist')
          const run = await adapter.getWorkflowRun(binding.runId, binding.runAttempt)
          run.baseSha = binding.baseSha
          run.workflowPath = binding.workflowPath
          const policy = await adapter.getMergePolicy({ base: 'main', actor: process.env.GITHUB_ACTOR })
          if (!(policy?.protected && policy?.strict && policy?.upToDate && policy?.actorAllowed && policy.requiredChecks?.includes('required-ci'))) throw new Error('protected main required-ci policy does not apply to the release merge actor')
          const headCommit = await adapter.getCommit(binding.expectedHead)
          const expectedTree = headCommit?.tree?.sha ?? headCommit?.treeSha ?? headCommit?.commit?.tree?.sha
          if (!/^[0-9a-f]{40}$/u.test(expectedTree ?? '')) throw new Error('release PR head tree SHA is unavailable')
          const currentBefore = await adapter.getMainSha()
          if (currentBefore !== binding.baseSha) throw new Error('main moved before release merge')
          const merged = await adapter.mergePullRequest({ number: binding.prNumber, expectedHead: binding.expectedHead, expectedBase: binding.baseSha })
          const mergeSha = merged?.sha ?? merged?.mergeSha ?? merged?.merge_commit_sha
          const verified = await verifyMergedCandidate({ mergeSha, expectedBase: binding.baseSha, expectedHead: binding.expectedHead, expectedTree, adapter })
          const currentAfter = await adapter.getMainSha()
          if (currentAfter !== mergeSha) throw new Error('main did not advance to the verified release merge commit')
          const version = report.selectedVersion
          const rootTag = `v${version}`
          const goTag = `packages/go/${rootTag}`
          const tagAbsent = (tag) => {
            const local = spawnSync('git', ['rev-parse', '--verify', `refs/tags/${tag}`], { encoding: 'utf8', stdio: 'pipe' })
            if (local.status === 0) return false
            if (local.status !== 128) throw new Error(`could not inspect local tag ${tag}`)
            const result = spawnSync('git', ['ls-remote', '--exit-code', '--tags', 'origin', `refs/tags/${tag}`], { encoding: 'utf8', stdio: 'pipe' })
            if (result.status === 0) return false
            if (result.status !== 2) throw new Error(`could not inspect remote tag ${tag}`)
            return true
          }
          if (!tagAbsent(rootTag) || !tagAbsent(goTag)) throw new Error('release tag pair already exists; refusing to move or replace tags')
          runCommand('git', ['fetch', '--no-tags', 'origin', 'main'])
          if (runCommand('git', ['rev-parse', 'origin/main']) !== mergeSha) throw new Error('origin/main does not equal the verified release merge')
          runCommand('git', ['-c', 'user.name=ERPC SDK Release Controller', '-c', 'user.email=release-controller@example.invalid', 'tag', '-a', rootTag, '-m', `ERPC SDK ${rootTag}`, mergeSha])
          runCommand('git', ['-c', 'user.name=ERPC SDK Release Controller', '-c', 'user.email=release-controller@example.invalid', 'tag', '-a', goTag, '-m', `ERPC Go SDK ${version}`, mergeSha])
          runCommand('git', ['remote', 'set-url', 'origin', `https://github.com/${repository}.git`])
          runCommand('git', ['-c', `http.extraheader=Authorization: Bearer ${process.env.GH_TOKEN}`, 'push', '--atomic', 'origin', `refs/tags/${rootTag}`, `refs/tags/${goTag}`])
          const dispatch = spawnSync('gh', ['workflow', 'run', 'release.yml', '--repo', repository, '--ref', rootTag, '-f', `root_tag=${rootTag}`, '-f', `go_tag=${goTag}`, '-f', `expected_commit=${mergeSha}`, '-f', 'publish=true', '-f', `ci_run_id=${binding.runId}`, '-f', `ci_run_attempt=${binding.runAttempt}`, '-f', `ci_head_sha=${binding.expectedHead}`, '-f', `ci_base_sha=${binding.baseSha}`], { encoding: 'utf8', stdio: 'pipe' })
          if (dispatch.error || dispatch.status !== 0) throw new Error(`release workflow dispatch failed: ${dispatch.stderr?.trim() || dispatch.error?.message || dispatch.status}`)
          writeFileSync(resultFile, `${JSON.stringify({ status: 'MERGED_TAGGED_DISPATCHED', version, rootTag, goTag, mergeSha, expectedTree: verified.treeSha, ciRunId: binding.runId, ciRunAttempt: binding.runAttempt, dispatchStdout: dispatch.stdout.trim() }, null, 2)}\n`, { flag: 'w' })
          NODE
      - name: Upload automatic release controller evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: automatic-release-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-binding.json
            ${{ runner.temp }}/release-prep-report.json
            ${{ runner.temp }}/automatic-release-result.json
          if-no-files-found: warn
          retention-days: 30
