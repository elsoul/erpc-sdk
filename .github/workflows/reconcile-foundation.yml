name: Reconcile SDK foundation publication

on:
  workflow_dispatch:
    inputs:
      expected_control_commit:
        description: Exact 40-character SHA of the reviewed reconciliation control commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-foundation-release
  cancel-in-progress: false

env:
  RELEASE_USER_AGENT: erpc-sdk-release-verification (https://github.com/elsoul/erpc-sdk)
  EXPECTED_REPOSITORY: elsoul/erpc-sdk
  EXPECTED_REPOSITORY_ID: '1429568627'
  SOURCE_M: 4677d67d14c8fbb17ada3ba824d1623180c6b4d9
  PREPARED_RUN_ID: '39862319930'
  PREPARED_RUN_ATTEMPT: '1'
  PREPARED_ARTIFACT_ID: '12461868771'
  PREPARED_BINDING_ARTIFACT_ID: '12463070497'
  PUBLISH_RUN_ID: '39871872971'
  PUBLISH_RUN_ATTEMPT: '1'
  M_CI_RUN_ID: '39861696063'
  PLAN_SHA256: 779aa1c48dc9ba2178fcfe021e102a12df85e4098c66120b1a3d2e8d7ca1911c
  EXPECTED_VERSION: 0.9.1
  FOUNDATION_TAG: non-rust-v0.9.1
  FOUNDATION_GO_TAG: packages/go/v0.9.1
  FOUNDATION_RELEASE_TITLE: 'SDK release state: non-Rust 0.9.1 / Rust 0.10.0'
  RUST_SOURCE: f05abe4276991612c4b5e404fdc768baace32e61
  RUST_SHA256: f2ad81528b35470b8f193dc45ad9f95e2d5ba0749b916ab9422cb07639088dd7

jobs:
  control:
    name: Guard reviewed control C and exact M projection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      control_commit: ${{ steps.guard.outputs.control_commit }}
    steps:
      - name: Check out the control commit without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Guard repository, event, control C, source M, and exact projection
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_COMMIT: ${{ inputs.expected_control_commit }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$REPOSITORY_ID" = "$EXPECTED_REPOSITORY_ID"
          test "$EVENT_NAME" = workflow_dispatch
          test "$EVENT_REF" = refs/heads/main
          test "$WORKFLOW_REF" = "$EXPECTED_REPOSITORY/.github/workflows/reconcile-foundation.yml@refs/heads/main"
          printf '%s' "$CONTROL_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          test "$CONTROL_COMMIT" = "$EVENT_SHA"
          test "$CONTROL_COMMIT" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$CONTROL_COMMIT"
          test -z "$(git status --porcelain)"
          git cat-file -e "$SOURCE_M^{commit}"
          git merge-base --is-ancestor "$SOURCE_M" "$CONTROL_COMMIT"
          expected_paths=$'.github/workflows/reconcile-foundation.yml\ndocs/RELEASING.md\nscripts/verify-release.test.mjs'
          actual_paths="$(git diff --name-only "$SOURCE_M" "$CONTROL_COMMIT" | sort)"
          test "$actual_paths" = "$(printf '%s\n' "$expected_paths" | sort)"
          git diff --quiet "$SOURCE_M" "$CONTROL_COMMIT" -- .github/workflows/release.yml scripts/verify-release.mjs
          for path in packages Cargo.lock registry; do
            test -z "$(git diff --name-only "$SOURCE_M" "$CONTROL_COMMIT" -- "$path")"
          done
          main_sha="$(gh api "/repos/$EXPECTED_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$CONTROL_COMMIT"
          printf 'control_commit=%s\n' "$CONTROL_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Require exact successful CI for C and retain exact M CI proof
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_COMMIT: ${{ steps.guard.outputs.control_commit }}
          FOUNDATION_CI_WORKFLOW_FILE: ${{ runner.temp }}/ci-workflow.json
          FOUNDATION_CI_RUNS_FILE: ${{ runner.temp }}/ci-runs.json
          FOUNDATION_CI_SELECTION_FILE: ${{ runner.temp }}/ci-selection.json
          FOUNDATION_CI_RECHECK_FILE: ${{ runner.temp }}/ci-recheck.json
          FOUNDATION_CI_JOBS_FILE: ${{ runner.temp }}/ci-jobs.json
          FOUNDATION_CI_EVIDENCE_FILE: ${{ runner.temp }}/ci-evidence.json
        run: |
          set -euo pipefail
          prove_ci() {
            local commit="$1" prefix="$2"
            local workflow_file="$RUNNER_TEMP/${prefix}-workflow.json"
            local runs_file="$RUNNER_TEMP/${prefix}-runs.json"
            local selection_file="$RUNNER_TEMP/${prefix}-selection.json"
            local recheck_file="$RUNNER_TEMP/${prefix}-recheck.json"
            local jobs_file="$RUNNER_TEMP/${prefix}-jobs.json"
            local evidence_file="$RUNNER_TEMP/${prefix}-evidence.json"
            gh api "/repos/$EXPECTED_REPOSITORY/actions/workflows/ci.yml" > "$workflow_file"
            workflow_id="$(jq -r '.id' "$workflow_file")"
            test "$workflow_id" != null
            gh api "/repos/$EXPECTED_REPOSITORY/actions/workflows/$workflow_id/runs?branch=main&head_sha=$commit&per_page=100" > "$runs_file"
            FOUNDATION_SOURCE_SHA="$commit" FOUNDATION_CI_WORKFLOW_FILE="$workflow_file" FOUNDATION_CI_RUNS_FILE="$runs_file" FOUNDATION_CI_SELECTION_FILE="$selection_file" node scripts/verify-release.mjs --foundation-ci-select
            run_id="$(jq -r '.id' "$selection_file")"
            run_attempt="$(jq -r '.runAttempt' "$selection_file")"
            if [ "$commit" = "$SOURCE_M" ]; then test "$run_id" = "$M_CI_RUN_ID"; fi
            gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$run_id/attempts/$run_attempt/jobs?per_page=100" > "$jobs_file"
            gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$run_id" > "$recheck_file"
            FOUNDATION_SOURCE_SHA="$commit" FOUNDATION_CI_WORKFLOW_FILE="$workflow_file" FOUNDATION_CI_RUNS_FILE="$runs_file" FOUNDATION_CI_SELECTION_FILE="$selection_file" FOUNDATION_CI_RECHECK_FILE="$recheck_file" FOUNDATION_CI_JOBS_FILE="$jobs_file" FOUNDATION_CI_EVIDENCE_FILE="$evidence_file" node scripts/verify-release.mjs --foundation-ci-proof
          }
          prove_ci "$CONTROL_COMMIT" control-ci
          prove_ci "$SOURCE_M" source-m-ci

      - name: Recheck main remains C at the read-before-write boundary
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_COMMIT: ${{ steps.guard.outputs.control_commit }}
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$EXPECTED_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CONTROL_COMMIT"

  source-proof:
    name: Revalidate original preparation, publication failure, and M bundle
    needs: control
    if: ${{ needs.control.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      context_artifact_id: ${{ steps.context_upload.outputs.artifact-id }}
    steps:
      - name: Check out control C with no persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create a distinct read-only M verification checkout
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/source-m" "$SOURCE_M"
          test "$(git -C "$RUNNER_TEMP/source-m" rev-parse HEAD)" = "$SOURCE_M"
          test -z "$(git -C "$RUNNER_TEMP/source-m" status --porcelain)"

      - name: Download only the immutable approved preparation bundle and binding
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: 12461868771
          run-id: 39862319930
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-bundle
      - name: Download only the immutable preparation binding
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: 12463070497
          run-id: 39862319930
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-binding

      - name: Read and bind original publication run and job outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN: ${{ runner.temp }}/publication-run.json
          PUBLISH_JOBS: ${{ runner.temp }}/publication-jobs.json
          PREP_RUN: ${{ runner.temp }}/preparation-run.json
          PREP_ARTIFACT: ${{ runner.temp }}/preparation-artifact.json
          PREP_BINDING_ARTIFACT: ${{ runner.temp }}/preparation-binding-artifact.json
        run: |
          set -euo pipefail
          gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$PUBLISH_RUN_ID" > "$PUBLISH_RUN"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$PUBLISH_RUN_ID/attempts/$PUBLISH_RUN_ATTEMPT/jobs?per_page=100" > "$PUBLISH_JOBS"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$PREPARED_RUN_ID" > "$PREP_RUN"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/artifacts/$PREPARED_ARTIFACT_ID" > "$PREP_ARTIFACT"
          gh api "/repos/$EXPECTED_REPOSITORY/actions/artifacts/$PREPARED_BINDING_ARTIFACT_ID" > "$PREP_BINDING_ARTIFACT"
          node --input-type=module - "$PUBLISH_RUN" "$PUBLISH_JOBS" "$PREP_RUN" <<'NODE'
          import { readFileSync } from 'node:fs'
          const [publishFile, jobsFile, preparationFile] = process.argv.slice(2)
          const publish = JSON.parse(readFileSync(publishFile, 'utf8'))
          const jobs = JSON.parse(readFileSync(jobsFile, 'utf8'))
          const preparation = JSON.parse(readFileSync(preparationFile, 'utf8'))
          const fail = message => { throw new Error(message) }
          if (publish.id !== 39871872971 || publish.run_attempt !== 1 || publish.repository?.full_name !== 'elsoul/erpc-sdk' || String(publish.repository?.id) !== '1429568627' || publish.path !== '.github/workflows/release.yml' || publish.event !== 'workflow_dispatch' || publish.head_branch !== 'main' || publish.head_sha !== process.env.SOURCE_M || publish.status !== 'completed' || publish.conclusion !== 'failure') fail('original publication run is not the recorded completed failure')
          if (preparation.id !== 39862319930 || preparation.run_attempt !== 1 || preparation.repository?.full_name !== 'elsoul/erpc-sdk' || String(preparation.repository?.id) !== '1429568627' || preparation.path !== '.github/workflows/release.yml' || preparation.head_branch !== 'main' || preparation.head_sha !== process.env.SOURCE_M || preparation.status !== 'completed' || preparation.conclusion !== 'success') fail('original preparation run binding is invalid')
          if (!Array.isArray(jobs.jobs) || jobs.total_count !== jobs.jobs.length) fail('original publication job enumeration is incomplete')
          for (const job of jobs.jobs) if (job.run_id !== 39871872971 || job.run_attempt !== 1) fail('original publication job identity is invalid')
          console.log(`recorded-original-jobs=${jobs.jobs.length}`)
          NODE

      - name: Verify the original preparation metadata and exact M bundle using unchanged verifier
        env:
          FOUNDATION_SOURCE_SHA: ${{ env.SOURCE_M }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PLAN_SHA256: ${{ env.PLAN_SHA256 }}
          FOUNDATION_ARTIFACT_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          FOUNDATION_BINDING_FILE: ${{ runner.temp }}/sdk-foundation-binding/foundation-binding.json
          FOUNDATION_PREPARED_RUN_ID: ${{ env.PREPARED_RUN_ID }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ env.PREPARED_RUN_ATTEMPT }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ env.PREPARED_ARTIFACT_ID }}
          FOUNDATION_PREPARED_BINDING_ARTIFACT_ID: ${{ env.PREPARED_BINDING_ARTIFACT_ID }}
          FOUNDATION_PREPARATION_RUN_FILE: ${{ runner.temp }}/preparation-run.json
          FOUNDATION_PREPARATION_ARTIFACT_FILE: ${{ runner.temp }}/preparation-artifact.json
          FOUNDATION_PREPARATION_BINDING_ARTIFACT_FILE: ${{ runner.temp }}/preparation-binding-artifact.json
        run: |
          set -euo pipefail
          FOUNDATION_SOURCE_SHA="$SOURCE_M" FOUNDATION_PREPARED_RUN_ID="$PREPARED_RUN_ID" FOUNDATION_PREPARED_RUN_ATTEMPT="$PREPARED_RUN_ATTEMPT" FOUNDATION_PREPARED_ARTIFACT_ID="$PREPARED_ARTIFACT_ID" FOUNDATION_PREPARED_BINDING_ARTIFACT_ID="$PREPARED_BINDING_ARTIFACT_ID" FOUNDATION_PREPARATION_RUN_FILE="$FOUNDATION_PREPARATION_RUN_FILE" FOUNDATION_PREPARATION_ARTIFACT_FILE="$FOUNDATION_PREPARATION_ARTIFACT_FILE" FOUNDATION_PREPARATION_BINDING_ARTIFACT_FILE="$FOUNDATION_PREPARATION_BINDING_ARTIFACT_FILE" node "$RUNNER_TEMP/source-m/scripts/verify-release.mjs" --foundation-preparation
          node "$RUNNER_TEMP/source-m/scripts/verify-release.mjs" --foundation-verify
          test "$(cat "$FOUNDATION_PLAN_FILE" | sha256sum | awk '{print $1}')" != ''

      - name: Bind immutable recovery context outside the public asset set
        id: context
        env:
          CONTROL_COMMIT: ${{ needs.control.outputs.control_commit }}
          PUBLISH_RUN_FILE: ${{ runner.temp }}/publication-run.json
          PUBLISH_JOBS_FILE: ${{ runner.temp }}/publication-jobs.json
          CONTEXT_FILE: ${{ runner.temp }}/recovery-context.json
        run: |
          set -euo pipefail
          node --input-type=module - "$PUBLISH_RUN_FILE" "$PUBLISH_JOBS_FILE" "$CONTEXT_FILE" <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [publishFile, jobsFile, outputFile] = process.argv.slice(2)
          const publish = JSON.parse(readFileSync(publishFile, 'utf8'))
          const jobs = JSON.parse(readFileSync(jobsFile, 'utf8'))
          const payload = {
            schemaVersion: 1,
            kind: 'erpc-sdk-foundation-recovery-context',
            repository: process.env.EXPECTED_REPOSITORY,
            repositoryId: process.env.EXPECTED_REPOSITORY_ID,
            controlCommit: process.env.CONTROL_COMMIT,
            controlWorkflow: '.github/workflows/reconcile-foundation.yml',
            controlWorkflowRef: process.env.GITHUB_WORKFLOW_REF,
            observerRunId: process.env.GITHUB_RUN_ID,
            observerAttempt: process.env.GITHUB_RUN_ATTEMPT,
            sourceCommit: process.env.SOURCE_M,
            originalPreparation: { runId: process.env.PREPARED_RUN_ID, runAttempt: process.env.PREPARED_RUN_ATTEMPT, artifactId: process.env.PREPARED_ARTIFACT_ID, bindingArtifactId: process.env.PREPARED_BINDING_ARTIFACT_ID },
            planSha256: process.env.PLAN_SHA256,
            originalPublication: { runId: '39871872971', runAttempt: '1', status: publish.status, conclusion: publish.conclusion, workflow: publish.path, sourceCommit: publish.head_sha, jobOutcomes: jobs.jobs.map(job => ({ id: job.id, name: job.name, status: job.status, conclusion: job.conclusion, runId: job.run_id, runAttempt: job.run_attempt })) },
            registryWrites: { npm: false, pypi: false, rubygems: false, oidcRequested: false, uploadAttempted: false },
          }
          const contextSha256 = createHash('sha256').update(JSON.stringify(payload)).digest('hex')
          writeFileSync(outputFile, `${JSON.stringify({ ...payload, contextSha256 })}\n`)
          NODE
      - name: Upload immutable recovery context artifact
        id: context_upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foundation-recovery-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-context.json
          if-no-files-found: error
          retention-days: 365

  npm-observer:
    name: Verify reused npm archive and provenance
    needs: source-proof
    if: ${{ needs.source-proof.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out C without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the exact approved bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: 12461868771
          run-id: 39862319930
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-bundle
      - name: Download the exact preparation binding
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: 12463070497
          run-id: 39862319930
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/sdk-foundation-binding
      - name: Verify bundle before public observation
        env:
          FOUNDATION_SOURCE_SHA: ${{ env.SOURCE_M }}
          FOUNDATION_PLAN_FILE: ${{ runner.temp }}/sdk-foundation-bundle/foundation-plan.json
          FOUNDATION_PLAN_SHA256: ${{ env.PLAN_SHA256 }}
          FOUNDATION_ARTIFACT_DIR: ${{ runner.temp }}/sdk-foundation-bundle
          FOUNDATION_BINDING_FILE: ${{ runner.temp }}/sdk-foundation-binding/foundation-binding.json
          FOUNDATION_PREPARED_RUN_ID: ${{ env.PREPARED_RUN_ID }}
          FOUNDATION_PREPARED_RUN_ATTEMPT: ${{ env.PREPARED_RUN_ATTEMPT }}
          FOUNDATION_PREPARED_ARTIFACT_ID: ${{ env.PREPARED_ARTIFACT_ID }}
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs --foundation-verify

      - name: Download exact npm metadata with 404-only bounded observation
        env:
          RESPONSE_FILE: ${{ runner.temp }}/npm-version.json
          FULL_RESPONSE_FILE: ${{ runner.temp }}/npm-packument.json
        run: |
          set -euo pipefail
          exact_url='https://registry.npmjs.org/%40elsoul%2Ferpc-sdk/0.9.1'
          full_url='https://registry.npmjs.org/%40elsoul%2Ferpc-sdk'
          deadline=$((SECONDS + 600))
          exact_status=''
          while :; do
            set +e
            exact_status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$RESPONSE_FILE" --write-out '%{http_code}' "$exact_url")"
            curl_status=$?
            set -e
            printf '%s\t%s\t%s\t%s\n' npm "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$exact_status" "$(sha256sum "$RESPONSE_FILE" | awk '{print $1}')" >> "$RUNNER_TEMP/recovery-observations.tsv"
            test "$curl_status" -eq 0
            test "$SECONDS" -le "$deadline"
            if [ "$exact_status" = 200 ]; then
              set +e
              full_status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$FULL_RESPONSE_FILE" --write-out '%{http_code}' "$full_url")"
              full_curl_status=$?
              set -e
              printf '%s\t%s\t%s\t%s\n' npm-full "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$full_status" "$(sha256sum "$FULL_RESPONSE_FILE" | awk '{print $1}')" >> "$RUNNER_TEMP/recovery-observations.tsv"
              test "$full_curl_status" -eq 0
              test "$SECONDS" -le "$deadline"
              test "$full_status" = 200
              NPM_FULL_RESPONSE_FILE="$FULL_RESPONSE_FILE" NPM_EXACT_RESPONSE_FILE="$RESPONSE_FILE" EXPECTED_VERSION="$EXPECTED_VERSION" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const exact = JSON.parse(readFileSync(process.env.NPM_EXACT_RESPONSE_FILE, 'utf8'))
          const full = JSON.parse(readFileSync(process.env.NPM_FULL_RESPONSE_FILE, 'utf8'))
          const selected = full.versions?.[process.env.EXPECTED_VERSION]
          if (!selected || selected.name !== exact.name || selected.version !== exact.version || selected.dist?.tarball !== exact.dist?.tarball || selected.dist?.integrity !== exact.dist?.integrity) throw new Error('npm exact and full packument fields disagree')
          NODE
              exact_status=200
              break
            fi
            if [ "$exact_status" != 404 ] || [ "$SECONDS" -ge "$deadline" ]; then echo "npm exact endpoint stopped in HTTP $exact_status" >&2; exit 1; fi
            set +e
            full_status="$(curl --silent --show-error --max-time 20 --retry 0 --user-agent "$RELEASE_USER_AGENT" --output "$FULL_RESPONSE_FILE" --write-out '%{http_code}' "$full_url")"
            full_curl_status=$?
            set -e
            printf '%s\t%s\t%s\t%s\n' npm-full "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$full_status" "$(sha256sum "$FULL_RESPONSE_FILE" | awk '{print $1}')" >> "$RUNNER_TEMP/recovery-observations.tsv"
            test "$full_curl_status" -eq 0
            test "$SECONDS" -le "$deadline"
            if [ "$full_status" = 200 ]; then
              NPM_FULL_RESPONSE_FILE="$FULL_RESPONSE_FILE" NPM_EXACT_RESPONSE_FILE="$RESPONSE_FILE" EXPECTED_VERSION="$EXPECTED_VERSION" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const full = JSON.parse(readFileSync(process.env.NPM_FULL_RESPONSE_FILE, 'utf8'))
          const selected = full.versions?.[process.env.EXPECTED_VERSION]
          const expected = `https://registry.npmjs.org/@elsoul/erpc-sdk/-/erpc-sdk-${process.env.EXPECTED_VERSION}.tgz`
          if (full.name !== '@elsoul/erpc-sdk' || !selected || selected.name !== full.name || selected.version !== process.env.EXPECTED_VERSION || selected.dist?.tarball !== expected || !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(selected.dist?.integrity ?? '')) throw new Error('npm full packument does not contain the exact approved version')
          writeFileSync(process.env.NPM_EXACT_RESPONSE_FILE, `${JSON.stringify(selected)}\n`)
          NODE
              exact_status=200
              break
            fi
            if [ "$full_status" != 404 ] || [ "$SECONDS" -ge "$deadline" ]; then echo "npm full packument stopped in HTTP $full_status" >&2; exit 1; fi
            sleep 30
          done
          FOUNDATION_REGISTRY=npm REGISTRY_STATUS="$exact_status" REGISTRY_RESPONSE_FILE="$RESPONSE_FILE" EXPECTED_VERSION="$EXPECTED_VERSION" node scripts/verify-release.mjs --foundation-registry > "$RUNNER_TEMP/npm-state"
          test "$(cat "$RUNNER_TEMP/npm-state")" = match
          NPM_FULL_RESPONSE_FILE="$FULL_RESPONSE_FILE" NPM_EXACT_RESPONSE_FILE="$RESPONSE_FILE" EXPECTED_VERSION="$EXPECTED_VERSION" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const exact = JSON.parse(readFileSync(process.env.NPM_EXACT_RESPONSE_FILE, 'utf8'))
          if (exact.name !== '@elsoul/erpc-sdk' || exact.version !== process.env.EXPECTED_VERSION) throw new Error('npm exact metadata identity mismatch')
          NODE

      - name: Download and cryptographically verify the exact npm archive
        env:
          RESPONSE_FILE: ${{ runner.temp }}/npm-version.json
          NPM_FILE: ${{ runner.temp }}/elsoul-erpc-sdk-0.9.1.tgz
          NPM_SHA256: 592f6fa2d68534ecb3f79ec0bed163880ed5de306f55d365a3dee31ee5a2baf6
        run: |
          set -euo pipefail
          NPM_TARBALL_URL="$(node --input-type=module - "$RESPONSE_FILE" <<'NODE'
          import { readFileSync } from 'node:fs'
          const metadata = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          const expected = 'https://registry.npmjs.org/@elsoul/erpc-sdk/-/erpc-sdk-0.9.1.tgz'
          if (metadata.name !== '@elsoul/erpc-sdk' || metadata.version !== '0.9.1' || metadata.dist?.tarball !== expected || !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(metadata.dist?.integrity ?? '')) throw new Error('npm metadata is not the approved exact version')
          process.stdout.write(expected)
          NODE
