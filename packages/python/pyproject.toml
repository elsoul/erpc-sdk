[build-system]
requires = ["hatchling>=1.25,<1.28"]
build-backend = "hatchling.build"

[project]
name = "erpc-sdk"
version = "0.3.0"
description = "Async Python SDK for ERPC"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ELSOUL LABO B.V." }]
keywords = ["erpc", "ethereum", "json-rpc", "rpc", "solana"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "twine>=5,<7",
]

[project.urls]
Documentation = "https://github.com/elsoul/erpc-sdk/tree/main/packages/python"
Homepage = "https://erpc.global"
Repository = "https://github.com/elsoul/erpc-sdk"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/erpc_sdk"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["erpc_sdk"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
